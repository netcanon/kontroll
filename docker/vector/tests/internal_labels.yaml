# Vector unit tests for the internal shapes' LABELS — `vector test`, run by tests/validate.sh's vector-test step.
# Not loaded at runtime: the compose command loads only vector.yaml, config.d/ and generated/.
#
# What they verify: every event leaving an internal shape carries each field the Loki sink templates as a label
# (`level` and `run_id` above all) with the value a query expects. Why: a field absent from an event fails its
# label template, so Vector warns on every such event and ships it without the label (measured on both boxes and
# on a scratch Vector 0.56 + Loki 3.4.2, 2026-10-20). tests/unit/test_compose_logging.py checks the VRL's shape
# statically; these run it. One event per test: a check over several events passes when ANY one meets it, so it
# would prove nothing about the others (measured).
tests:
  - name: "containers: a plain-text line is level=info with an empty run_id"
    inputs:
      - insert_at: internal_containers_shape
        type: log
        log_fields: {message: "listening on :8080", container_name: "grafana"}
    outputs:
      - extract_from: internal_containers_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "info")
              assert_eq!(.run_id, "")
              assert_eq!(.service, "grafana")
              assert_eq!(.source, "internal")

  - name: "containers: a JSON line keeps its own level; a kontroll_run_id token becomes run_id"
    inputs:
      - insert_at: internal_containers_shape
        type: log
        log_fields: {message: '{"level":"error","msg":"stage failed kontroll_run_id=20261020T120000Z"}',
                     container_name: "onboard-gui"}
    outputs:
      - extract_from: internal_containers_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")
              assert_eq!(.run_id, "20261020T120000Z")

  - name: "journald: run_id is empty, the level comes from PRIORITY"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "disk almost full", PRIORITY: "4", _SYSTEMD_UNIT: "docker.service"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.run_id, "")
              assert_eq!(.level, "warning")
              assert_eq!(.service, "docker.service")

  # The service label is a closed set: a unit name systemd mints per login, transient run, container scope or
  # template instance — and a compose one-off's container name — would each start a new Loki stream (found live,
  # 2026-10-22: a stream per SSH login and one per installer run). The label drops what is minted; the body keeps
  # the name as it came, so a query can still pick one. The rows that keep a name hold each rule from growing to
  # one it would fold. One event per test, as above.
  - name: "journald: a login's scope is session.scope"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "session-42.scope"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "session.scope")
              assert_eq!(._SYSTEMD_UNIT, "session-42.scope")

  - name: "journald: a template's instance is dropped"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "getty@tty1.service"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "getty@.service")
              assert_eq!(._SYSTEMD_UNIT, "getty@tty1.service")

  - name: "journald: an instance with dots in it is dropped whole"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "ifup@eth0.100.service"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "ifup@.service")
              assert_eq!(._SYSTEMD_UNIT, "ifup@eth0.100.service")

  - name: "journald: a container's scope is docker.scope"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "docker-0123456789abcdef.scope"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "docker.scope")
              assert_eq!(._SYSTEMD_UNIT, "docker-0123456789abcdef.scope")

  - name: "journald: a systemd-run transient unit is run.<type>"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "run-r1a2b3c4d5e6f.scope"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "run.scope")
              assert_eq!(._SYSTEMD_UNIT, "run-r1a2b3c4d5e6f.scope")

  - name: "journald: a plain unit is kept as it is"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "sshd.service"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "sshd.service")
              assert_eq!(._SYSTEMD_UNIT, "sshd.service")

  - name: "journald: a login's scope with no audit id is session.scope too"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "session-c1.scope"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "session.scope")

  - name: "journald: a /run mount unit is run.mount"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "run-user-1000.mount"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "run.mount")

  - name: "journald: a unit that only starts like run- is kept"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "runner-agent.service"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "runner-agent.service")

  - name: "journald: a scope named docker- with no hash is kept"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: "docker-cleanup.scope"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "docker-cleanup.scope")

  - name: "journald: an empty unit is host, not an empty label"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6", _SYSTEMD_UNIT: ""}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "host")

  - name: "journald: no unit (a kernel line) is host"
    inputs:
      - insert_at: internal_journald_shape
        type: log
        log_fields: {message: "x", PRIORITY: "6"}
    outputs:
      - extract_from: internal_journald_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "host")

  - name: "containers: a compose one-off drops its run hash from the label, not from the body"
    inputs:
      - insert_at: internal_containers_shape
        type: log
        log_fields: {message: "PLAY RECAP", container_name: "services-init-run-0123456789ab"}
    outputs:
      - extract_from: internal_containers_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "services-init")
              assert_eq!(.container_name, "services-init-run-0123456789ab")

  - name: "containers: a name that only ends like a one-off is kept"
    inputs:
      - insert_at: internal_containers_shape
        type: log
        log_fields: {message: "x", container_name: "backup-run-nightly"}
    outputs:
      - extract_from: internal_containers_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "backup-run-nightly")

  - name: "containers: a run hash that is not compose's twelve hex is kept"
    inputs:
      - insert_at: internal_containers_shape
        type: log
        log_fields: {message: "x", container_name: "x-run-0123456789abc"}
    outputs:
      - extract_from: internal_containers_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "x-run-0123456789abc")

  - name: "containers: an empty name is unknown, not an empty label"
    inputs:
      - insert_at: internal_containers_shape
        type: log
        log_fields: {message: "x", container_name: ""}
    outputs:
      - extract_from: internal_containers_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.service, "unknown")

  - name: "api-audit: a six-field line labels its run_id"
    inputs:
      - insert_at: internal_api_audit_shape
        type: log
        log_fields: {message: "2026-10-20T12:00:00Z	api-token	192.0.2.10	onboard-stage	RUN42	ok"}
    outputs:
      - extract_from: internal_api_audit_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "audit")
              assert_eq!(.run_id, "RUN42")

  - name: "api-audit: a short line still carries run_id (empty)"
    inputs:
      - insert_at: internal_api_audit_shape
        type: log
        log_fields: {message: "truncated"}
    outputs:
      - extract_from: internal_api_audit_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.run_id, "")

  - name: "gui-audit: run_id is empty (its log has no run id)"
    inputs:
      - insert_at: internal_gui_audit_shape
        type: log
        log_fields: {message: "2026-10-20T12:00:00Z	192.0.2.10	login	ok"}
    outputs:
      - extract_from: internal_gui_audit_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.run_id, "")
              assert_eq!(.level, "audit")

  - name: "ansible: a line without kontroll_run_id has an empty run_id"
    inputs:
      - insert_at: internal_ansible_shape
        type: log
        log_fields: {message: "TASK [deploy : up] ok"}
    outputs:
      - extract_from: internal_ansible_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.run_id, "")
              assert_eq!(.level, "info")

  - name: "scripts: run_id is empty, the service comes from the run-log name"
    inputs:
      - insert_at: internal_scripts_shape
        type: log
        log_fields: {message: "done", file: "/host/operator-runs/kontroll-installer-20261020.log"}
    outputs:
      - extract_from: internal_scripts_shape
        conditions:
          - type: vrl
            source: |
              assert_eq!(.run_id, "")
              assert_eq!(.service, "kontroll-installer")

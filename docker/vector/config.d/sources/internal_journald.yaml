# config.d/sources/internal_journald.yaml  → source id "internal_journald", type journald.
# Reads the host journal (Docker daemon, systemd units, kernel, crash-loops).
type: journald
current_boot_only: true
since_now: false                         # read backlog from the checkpoint, not only new entries
journal_directory: /var/log/journal      # the host journal deploy-stack chose is bound here, persistent or volatile
data_dir: /var/lib/vector                # checkpoint so a restart resumes

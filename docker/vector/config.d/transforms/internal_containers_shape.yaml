# config.d/transforms/internal_containers.yaml  → transform id "internal_containers_shape".
# Shapes docker_logs events to the canonical label set (source/host/service/level/run_id). High-cardinality /
# sensitive fields stay in the body (never a label).
type: remap
inputs: [internal_containers]
source: |
  .source = "internal"
  .service = string(.container_name) ?? "unknown"          # low-cardinality: the container name
  .host = string(.host) ?? get_env_var("HOSTNAME") ?? "control-vm"
  # A JSON line's own `level` (or `severity`) wins; a plain-text line is "info". The sink has no default: an
  # unset `level` fails its label template on every event.
  .level = "info"
  parsed, err = parse_json(.message)
  if err == null && is_object(parsed) {
    .level = string(parsed.level) ?? string(parsed.severity) ?? "info"
  }
  # run_id correlation: many container lines carry a kontroll_run_id token; extract it best-effort.
  rid = parse_regex(.message, r'kontroll_run_id[=:]\s*(?P<rid>[A-Za-z0-9._-]+)') ?? {}
  if rid.rid != null { .run_id = rid.rid }
  # Every field the loki sink templates as a label must exist, or the sink warns on each event and drops the
  # label. An empty run_id is no label to Loki: the stream is stored without it, as before.
  if !exists(.run_id) { .run_id = "" }

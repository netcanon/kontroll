# config.d/transforms/internal_containers.yaml  → transform id "internal_containers_shape".
# Shapes docker_logs events to the canonical label set (source/host/service/level/run_id). High-cardinality /
# sensitive fields stay in the body (never a label).
type: remap
inputs: [internal_containers]
source: |
  .source = "internal"
  # Low-cardinality: the container name — but a compose one-off (`docker compose run`, as the installer runs at
  # every deploy) is named <project>-<service>-run-<12 hex>, a new name and so a new Loki stream at each run. The
  # label drops the run's hash; the full name stays in the body (container_name). A bare `docker run` with no
  # `--name` gets a random name, and so a stream of its own: name the container.
  name = string(.container_name) ?? ""
  if name == "" { name = "unknown" }                       # an empty name is no label
  .service = replace(name, r'-run-[0-9a-f]{12}$', "")
  .host = string(.host) ?? get_env_var("HOSTNAME") ?? "control-vm"
  # Grafana's alert delivery that fails logs Go's request error, which names the URL it posted to with only a
  # userinfo password masked — and the operator's notifier URL is its credential (an ntfy topic, a webhook token:
  # SECURITY.md R-ALERT-1). Keep the scheme and host, which say where it failed; drop the userinfo, path and query.
  # The webhook sends POST or PUT; a URL Go cannot parse fails as `parse "<url>"`. A GET is Grafana's own (a
  # datasource, a plugin, the update check) and keeps its path. The path runs through a JSON line's `\u0026`.
  if .service == "grafana" {
    url_re = r'(?P<p>(?:Post|Put|parse) \\?")(?P<s>https?://)(?:[^@/"\\\s]*@)?(?P<h>[^/?#"\\\s]+)(?:[^"\\\s]|\\u\w{4})*'
    .message = replace(string(.message) ?? "", url_re, "$${p}$${s}$${h}/<redacted>")
  }
  # A line's own level: a JSON line's `level` (or `severity`), or a logfmt/slog line's `level` key (Grafana,
  # Prometheus, Semaphore and blackbox all print one). parse_logfmt reads the line's own keys, so a `level=` inside
  # a quoted value, a URL's `?level=` or a `--log.level=` flag is not it. The value counts only if it names a known
  # level, lowercased, so the label stays the closed set below on both branches; any other line is "info". The sink
  # has no default: an unset or empty `level` fails its label template, or ships the stream with no `level` label.
  known_levels = ["trace", "debug", "info", "notice", "warning", "warn", "error", "err", "critical", "crit",
                  "alert", "emerg", "fatal", "panic"]
  lv = ""
  parsed, err = parse_json(.message)
  if err == null && is_object(parsed) {
    lv = string(parsed.level) ?? string(parsed.severity) ?? ""
  } else {
    kv = parse_logfmt(.message) ?? {}
    lv = string(kv.level) ?? ""
  }
  lv = downcase(lv)
  .level = "info"
  if includes(known_levels, lv) { .level = lv }
  # run_id correlation: many container lines carry a kontroll_run_id token; extract it best-effort.
  rid = parse_regex(.message, r'kontroll_run_id[=:]\s*(?P<rid>[A-Za-z0-9._-]+)') ?? {}
  if rid.rid != null { .run_id = rid.rid }
  # Every field the loki sink templates as a label must exist, or the sink warns on each event and drops the
  # label. An empty run_id is no label to Loki: the stream is stored without it, as before.
  if !exists(.run_id) { .run_id = "" }

# docker-socket-proxy — the FILTERED, read-only Docker API that Vector's docker_logs source talks to, so the
# raw root-equivalent /var/run/docker.sock is NEVER mounted into Vector (the C12 promotion-blocker fix). Only THIS
# proxy holds the socket; it exposes a GET/HEAD-only HAProxy filter (POST=0 ⇒ the whole API is read-only, cannot
# create/exec/kill a container) on its OWN internal network, `kontroll-socket`, which Vector alone joins. Brought up
# as a dependency of Vector (vector.yaml depends_on), only when 'vector' is deployed — provision-only-what's-declared.
#
# Why its own network and not the shared `kontroll` one: even read-only, `GET /containers/<id>/json` returns a
# container's Config.Env — every secret the stack passes a container by environment (SEMAPHORE_ACCESS_KEY_ENCRYPTION
# decrypts the store holding the runner's age key). On the shared network any of the stack's containers could have
# asked (2026-10-08 review, finding 4). Now only Vector can reach the proxy at all; tests/unit/test_compose_logging.py
# pins that no other fragment joins `kontroll-socket`.
#
# Access chain used:   holds /var/run/docker.sock (:ro) and exposes a GET/HEAD-only Docker API (the container list,
#                      inspect and logs, plus events/_ping/version) on `kontroll-socket`; Vector targets
#                      http://docker-socket-proxy:2375, never the raw socket.
# May break:           nothing — a read-only API filter; if the proxy is down, docker_logs blanks (others fine).
# Fallback required:   no.
# Blast radius:        control node only — NO host port (C3), NOT on the shared stack network (only Vector can reach
#                      it); POST=0 ⇒ cannot create containers.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0   # pinned tag (consistent with the rest of the stack; the one
                                                 # load-bearing assertion — POST=0 + no ports — is test-pinned).
                                                 # A bump must re-check the start script's exec line below against
                                                 # the new image's ENTRYPOINT + CMD (0.4.x renders /tmp/haproxy.cfg)
    container_name: docker-socket-proxy
    restart: unless-stopped
    # Vector's log streams (`GET /containers/<id>/logs?follow=1`; the route cannot see the query, so every `/logs`
    # request takes it) go to the template's own
    # `docker-events` backend, which differs from the default one only by `timeout server 0`. On the default route
    # the template's `timeout server 10m` cut every stream idle for ten minutes (`sD--`): Vector logged an ERROR and
    # re-attached, once per quiet container every ten minutes (scratch box, 2026-10-20; nothing lost or doubled).
    # The allow/deny filter runs in the frontend before a backend is chosen, so the route changes the timeout only:
    # POST=0 and the CONTAINERS-only grant still hold. The entrypoint renders the template, so the line goes in
    # first, once: a restart finds it there. The edit is written beside the template and moved over it only if the
    # copy is the template plus that one line, after the events route. So a failed write leaves the template as it was,
    # even one awk does not report (busybox awk exits 0 on a full disk, leaving an empty or short copy), and so does an
    # edit that changed any other line. If the edit fails or an image drops the events route, the proxy starts without
    # the route (its streams cut at ten minutes again) and says so. Overriding the entrypoint drops the image's CMD, so
    # the exec line restates 0.3.0's ENTRYPOINT + CMD. `timeout client 10m` still holds: a stream Vector stops reading
    # for ten minutes (Loki down long enough to fill the sink's buffer) is still cut, and that ERROR is real. Vector
    # excludes this container, so the script's lines are in `docker logs docker-socket-proxy` only.
    # tests/unit/test_socket_proxy_start_script.py
    #
    # The stock CONTAINERS grant passes every GET/HEAD under `/containers`, and three of those reads go far past
    # logs: `/containers/<id>/archive` returns a file from a container, `/export` its whole filesystem, and
    # `/attach/ws` (a GET websocket) writes to the stdin of a container started with stdin open. Vector needs only
    # the list, an inspect and the logs. So the script first adds one deny line ahead of every allow line: under
    # `/containers/` only `json` and `<id>/json` / `<id>/logs` pass, for an id that starts with a letter or digit
    # (so not `..`). It fails closed, with the same check on its copy: if that line cannot go in, or the copy is
    # anything but the template plus that line before the first allow line, the proxy does not start (its ERROR is
    # in `docker logs docker-socket-proxy`; Vector's container logs stop until it does). `<id>/json` still returns
    # the container's inspect JSON, its Config (Env among it) and Mounts, which is why the proxy has its own network
    # (above).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        t=/usr/local/etc/haproxy/haproxy.cfg.template
        p='{ path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/'
        R="    http-request deny if $$p } !$$p"'(json|[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs))$$ }'
        L='    use_backend docker-events if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/logs }'
        if R="$$R" awk '/^    http-request allow /{ok = (p == ENVIRON["R"]); exit} {p = $$0} END {exit !ok}' "$$t"; then
          echo "kontroll: container read limit already present"
        elif n=$$(awk '/^    http-request allow /{print NR; exit}' "$$t") && [ -n "$$n" ] \
            && R="$$R" awk '!d && /^    http-request allow /{print ENVIRON["R"]; d=1} {print} END {exit !d}' "$$t" \
            > "$$t.kontroll" && [ "$$(sed -n "$${n}p" "$$t.kontroll")" = "$$R" ] \
            && sed "$${n}d" "$$t.kontroll" | cmp -s - "$$t" \
            && chmod 644 "$$t.kontroll" && mv -f "$$t.kontroll" "$$t"; then
          echo "kontroll: container reads limited to the list, inspect and logs"
        else rm -f "$$t.kontroll"
          echo "kontroll: ERROR could not limit container reads to the list, inspect and logs; not starting"; exit 1; fi
        if grep -qxF "$$L" "$$t"; then echo "kontroll: log-stream route already present"
        elif m=$$(awk '/^    use_backend docker-events if/{print NR + 1; exit}' "$$t") && [ -n "$$m" ]; then
          L="$$L" awk '{print} !d && /^    use_backend docker-events if/{print ENVIRON["L"]; d=1}' "$$t" \
            > "$$t.kontroll" && [ "$$(sed -n "$${m}p" "$$t.kontroll")" = "$$L" ] \
            && sed "$${m}d" "$$t.kontroll" | cmp -s - "$$t" \
            && chmod 644 "$$t.kontroll" && mv -f "$$t.kontroll" "$$t" &&
            echo "kontroll: log streams routed to the no-timeout backend" || {
            rm -f "$$t.kontroll"
            echo "kontroll: WARNING could not add the log-stream route; log streams keep the 10m timeout"; }
        else echo "kontroll: WARNING the events route is gone from the template; log streams keep the 10m timeout"; fi
        exec docker-entrypoint.sh haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    environment:
      CONTAINERS: "1"          # list/inspect/logs — the ONLY grant docker_logs needs
      EVENTS: "1"              # the container lifecycle stream docker_logs watches (Tecnativa default 1; explicit)
      PING: "1"               # health (default 1; explicit)
      VERSION: "1"            # docker_logs negotiates the API version (default 1; explicit)
      POST: "0"                # GET/HEAD only ⇒ the entire API is read-only (cannot create/exec/kill) — the block
      EXEC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      INFO: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      ALLOW_RESTARTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # ONLY the proxy touches the raw socket
    # MUST be false for tecnativa/docker-socket-proxy:0.3.0: its entrypoint `sed`s the SHIPPED
    # /usr/local/etc/haproxy/haproxy.cfg.template into haproxy.cfg IN THAT SAME DIR at startup —
    # read_only:true blocks the write (crash loop), and a tmpfs overlay on the dir HIDES the shipped
    # template (a different crash). So RO-root cannot work here; no-new-privileges + the GET/HEAD-only
    # socket filter + the portless kontroll-network-only reach remain the real controls (see header).
    read_only: false
    tmpfs:
      - /run                   # HAProxy's runtime socket/pid
    security_opt:
      - no-new-privileges:true
    # NO `ports:` (C3) and NOT on the shared `kontroll` network: only `kontroll-socket`, which Vector alone joins —
    # it reaches the proxy by service name over that network. `internal: true` at creation (deploy-stack): nothing
    # on it needs egress.
    networks:
      - kontroll-socket

networks:
  kontroll-socket:
    external: true
    name: kontroll-socket

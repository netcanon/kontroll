# Top-level compose — composition only, NO service definitions live here.
# Each service is its own file under services/ (modularity doctrine §2.5).
# Add a service = add a file + one line below. Never grow this into a god file.
#
# Requires Docker Compose v2.20+ for `include:`.
#
#   docker compose up -d            # brings up everything
#   docker compose up -d homepage   # or one service by name

include:
  - services/homepage.yaml      # portal — built first (Phase 4)
  - services/semaphore.yaml     # Ansible UI (Phase 3)
  - services/onboard-gui.yaml   # capability search + onboard GUI (alpha; staged)
  - services/api.yaml           # typed onboarding API (read-only unless api_privileged; privileged routes need a token)
  - services/caddy.yaml         # optional HTTPS ingress (frontend.tls_mode=acme; Let's Encrypt DNS-01)
  - services/prometheus.yaml    # metrics TSDB (Phase 5)
  - services/grafana.yaml       # metrics UI (Phase 5) — also the logs pane (Loki datasource)
  - services/loki.yaml          # log store (filesystem TSDB + bounded retention) — logging Layer 2
  - services/vector.yaml        # log collector/shipper (internal + capability-derived) — logging Layer 1
  - services/docker-socket-proxy.yaml  # filtered RO Docker API for Vector's docker_logs (no raw socket in Vector)
  - services/pve-exporter.generated.yaml  # Proxmox VM/LXC metrics — GENERATED by gen-exporters.py ← telemetry/pve.yml
  - services/snmp-exporter.generated.yaml  # SNMP (switch/firewall) — GENERATED by gen-exporters.py
  - services/blackbox-exporter.generated.yaml  # reachability icmp/tcp/http — GENERATED by gen-exporters.py

# Shared network so services can reach each other by name (e.g. Grafana ->
# Prometheus). Declared EXTERNAL here and in every service fragment, so each
# fragment can also run standalone. The network is created once by
# ansible/playbooks/deploy-stack.yml (idempotent), not managed by compose.
networks:
  kontroll:
    external: true
    name: kontroll
  kontroll-socket:          # the docker-socket-proxy's private network (internal; Vector is its only peer)
    external: true
    name: kontroll-socket

# Homepage portal tiles TEMPLATE — the CONTROL-PLANE services kontroll itself stands up.
# The only per-instance values are this node's management IP and base domain.
# The scaffold (`fresh-init`, from its `--mgmt-ip` and `--domain`) fills the __MGMT_IP__ / __DOMAIN__
# sentinels below. If you copied this file by hand, replace BOTH sentinels
# (every occurrence) with your mgmt IP and domain — they are deliberately non-routable so an
# un-personalized board fails OBVIOUSLY rather than pointing at a plausible-looking wrong host.
#
# Homepage reads this YAML directly. Add your OWN service = add a list item under the right
# group. The "Fleet" group is GENERATED by scripts/gen-homepage.py (run by deploy-stack) from your
# onboarded fleet, between the `# >>> kontroll fleet (generated) >>>` markers below — do not hand-edit
# between them (overwritten on regen; the :8443 editor flags it read-only). See this directory's README.md.
# Homepage is unauthenticated by design — read the README before you expose it.

- Control plane:
    - Onboarding GUI:
        href: https://__MGMT_IP__:8443
        description: Device & secret onboarding (kontroll GUI)
    - Semaphore:
        href: http://__MGMT_IP__:3001
        description: Ansible automation
    - Grafana:
        href: http://__MGMT_IP__:3002
        description: Metrics dashboards
    - Prometheus:
        href: http://__MGMT_IP__:9090
        description: Metrics TSDB
    - API:
        href: https://__MGMT_IP__:8444
        description: kontroll API (read-only until armed)

- Infrastructure:
    - Control portal (NPM):
        href: https://control.__DOMAIN__
        description: This portal, fronted by NPM (mgmt VLAN)


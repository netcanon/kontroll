# Security — secret scanning + dependency audit. Complements the working-tree gitleaks
# in ci.yml's validate with a FULL-HISTORY scan, and audits the Python deps.
# docs/qa-and-release-pipeline.md §3. (bandit/trivy land as the GUI + images harden.)
name: security
on:
  push:
    branches: [main, 'homelab*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1'        # weekly, Monday 06:00 UTC
permissions:
  contents: read

jobs:
  gitleaks-history:
    name: gitleaks (full history)
    runs-on: ${{ fromJSON(vars.KONTROLL_RUNS_ON || '"ubuntu-latest"') }}   # see ci.yml "RUNNERS"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history, so a secret in ANY past commit is caught
          persist-credentials: false
      - name: Install gitleaks (the pinned release, sha256-verified, as ci.yml installs it)
        shell: bash
        run: |
          set -euo pipefail
          # user-local, no sudo: the same on a GitHub-hosted and a self-hosted runner
          bin="$RUNNER_TEMP/kontroll-tools"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/.github/scripts/fetch-pinned.sh" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
      - name: Scan all commits
        run: gitleaks detect -c .gitleaks.toml --redact --no-banner

  pip-audit:
    name: pip-audit (gui · api · tests floors, image pins)
    runs-on: ${{ fromJSON(vars.KONTROLL_RUNS_ON || '"ubuntu-latest"') }}   # see ci.yml "RUNNERS"
    defaults:
      run:
        shell: bash   # the runner comes from a variable: on Windows an unnamed shell is pwsh, which need not stop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pip-audit
      - run: pip-audit -r gui/requirements.txt -r api/requirements.txt -r tests/requirements-dev.txt
      # The versions the images actually install: exact pins, each file already its whole closure, so no resolve.
      - run: pip-audit --no-deps -r docker/semaphore-runner/requirements.txt -r docker/installer/requirements.txt

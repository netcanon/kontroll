name: publish-images

# Publish the kontroll-owned images to ghcr.io under the REPOSITORY'S OWNER (`ghcr.io/<owner>/kontroll-*`, nothing
# hard-coded — the same file publishes the public tool's packages and a private instance's) on a release tag — NEVER
# on every push (publishing is a deliberate, tagged event, mirroring make-bundle.sh's git-describe versioning).
# workflow_dispatch lets a maintainer publish a test tag (e.g. an `edge` or `sha-<short>` build) without cutting
# a release; a dispatch is honoured from `main` or a `v*` tag only, the tag must fit the docker tag grammar, and
# a `sha-<short>` tag must name the commit being built. Every image carries org.opencontainers.image.source and
# org.opencontainers.image.revision. C0 = kontroll-control (the Semaphore runner,
# baking the all-modules SUPERSET — report 22 §2.3) + kontroll-vector. C1 adds kontroll-installer (the compose-native
# installer glue — report 22 §2.1 Image C): so a fresh node pulls the installer by digest instead of building it.
#
# AFTER a publish: `python3 scripts/gen-image-digests.py --refresh <tag>` records the digests into
# docker/images.lock.yml (anonymous for a public package; `docker login ghcr.io` only while one is private); commit
# that, then deploy with `-e use_published_images=true` to pull by digest. A NEW package starts PRIVATE whatever the
# repository's visibility (the first publish from this public repository, 2026-10-09, produced private packages); the
# owner makes it public once, by hand, in the package's settings (no API — docs/public-split.md), and a public
# container package cannot be made private again. The public tool's three packages are public since 2026-10-11:
# every pull is anonymous and the control node holds no registry credential (SECURITY.md R-IMG-1, retired).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.0.0 or edge)'
        required: true
        default: edge
      platforms:
        description: 'Build platforms (linux/amd64 default; add linux/arm64 for SBC control nodes — slower, QEMU)'
        required: false
        default: linux/amd64

permissions:
  contents: read

jobs:
  # M5 (Phase-B bake-code): the read-only-by-construction AST pin must pass on THIS commit before any code-baking
  # image is published. Baking the api/gui/service code into the control image moves the read-only guarantee from
  # "proven on the running clone (== the tested source)" to "proven on the tested source, then baked" — so the
  # publish MUST be gated on the pin + the WRITE_ROOT seam, on the same commit (review 21 §3.3 / phase-b synthesis M5).
  gate:
    # A publish is a release-grade event: a dispatch is honoured from `main` or a `v*` tag only (the publish job
    # `needs` this one, so it is skipped too). Only users with write access can dispatch; this is about traceability.
    if: >-
      ${{ github.event_name != 'workflow_dispatch'
          || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ fromJSON(vars.KONTROLL_RUNS_ON || '"ubuntu-latest"') }}   # see ci.yml "RUNNERS"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest pyyaml
      - name: read-only-by-construction pin (gates the code-baked publish)
        run: python -m pytest tests/unit/test_readonly_completeness.py tests/unit/test_write_root_seam.py -q
      - name: baked-code manifest matches the code being baked (M6 "L2b for code")
        # The published control image bakes scripts/kontroll/ at /opt/kontroll. Gate the publish on the recorded
        # sha256 floor (docker/code-manifest.lock.yml) matching the source on THIS commit — so a tag can never
        # publish baked code that drifts from the committed, reviewed manifest (phase-b synthesis §3, M6 / M5-adjacent).
        run: python scripts/gen-code-manifest.py --check

  publish:
    needs: gate                  # M5: no code-baked image publishes unless the read-only pin clears on this commit
    runs-on: ${{ fromJSON(vars.KONTROLL_RUNS_ON || '"ubuntu-latest"') }}   # see ci.yml "RUNNERS"
    permissions:
      contents: read
      packages: write            # push to ghcr.io/<owner>/kontroll-*
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control
            context: .
            dockerfile: docker/semaphore-runner/Dockerfile
            superset: true       # the runner bakes the all-modules superset (a published image can't know a fleet)
          - image: vector
            context: docker/vector-image
            dockerfile: docker/vector-image/Dockerfile
            superset: false
          - image: installer
            context: .
            dockerfile: docker/installer/Dockerfile
            # NOT superset: the installer bakes only the control-plane base (modules/_core.yml, generated inside
            # the build by `gen-requirements.py --core` — Dockerfile §"Bake the CONTROL-PLANE collection base") —
            # never the device fleet. The all-modules superset is the RUNNER's job (it runs fleet ansible); the
            # installer only drives bootstrap/local-canonical/deploy-stack on the control node itself.
            superset: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate the all-modules superset lockfile (offline; the published runner bakes the full catalog)
        if: ${{ matrix.superset }}
        run: |
          pip install --quiet pyyaml
          python3 scripts/gen-requirements.py --all-modules
          echo "superset lockfile:"; cat ansible/collections/requirements.generated.yml

      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          TAG="$REF_NAME"
          [ "$EVENT" = "workflow_dispatch" ] && TAG="$DISPATCH_TAG"
          # The docker tag grammar ([A-Za-z0-9_][A-Za-z0-9_.-]{0,127}); rejects a comma/newline that could add refs.
          case "$TAG" in ''|[.-]*|*[!A-Za-z0-9_.-]*) echo "::error::invalid image tag '$TAG'"; exit 1 ;; esac
          [ "${#TAG}" -le 128 ] || { echo "::error::image tag longer than 128 characters"; exit 1; }
          # A sha-<short> tag is a claim about the commit; make it true or fail.
          case "$TAG" in
            sha-*) short="${TAG#sha-}"
                   [ "${#short}" -ge 7 ] || { echo "::error::a sha- tag needs at least 7 hex digits"; exit 1; }
                   case "$SHA" in
                     "$short"*) ;;
                     *) echo "::error::$TAG does not name the commit being built ($SHA)"; exit 1 ;;
                   esac ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # ghcr.io namespaces are lowercase; the repository owner is whatever case GitHub shows.
          echo "owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build platforms
        id: plat
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
        run: |
          PLATFORMS="linux/amd64"
          [ "$EVENT" = "workflow_dispatch" ] && PLATFORMS="$DISPATCH_PLATFORMS"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

      # QEMU only matters for cross-arch (linux/arm64). Harmless for amd64-only.
      # Third-party actions are SHA-pinned (the .github/zizmor.yml policy; Dependabot keeps the pins current).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/kontroll-${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          # Provenance a re-pin reviewer can check: which repository and commit these bytes were built from.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # NO secrets, NO instance/ in the context — the repo-root .dockerignore strips instance/ and a clean CI
          # checkout has none (report 22 §3.3 build-context hygiene).

      - name: Record the published digest (run gen-image-digests.py --refresh to pin the lock)
        env:
          IMG: kontroll-${{ matrix.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ steps.meta.outputs.owner }}
        run: |
          { echo "### $IMG"; echo "\`ghcr.io/$OWNER/$IMG:$TAG@$DIGEST\`"; } >> "$GITHUB_STEP_SUMMARY"

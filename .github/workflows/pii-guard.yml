name: PII guard

# The public-tree identifier gate (SECURITY.md C21; design-of-record in the 2026-10-08 public-split review's
# 99-synthesis.md).
# Fails the build if any shippable, tracked file carries a real network identifier (an RFC-1918 address in any
# spelling, a non-documentation MAC or global IPv6, a real age recipient/secret key), a maintainer personal
# identifier (matched by salted sha256 digest from .github/pii-guard.hashes, so neither this repo nor a failure log
# ever spells it) or an operator-machine user-profile path — or one of THIS instance's own names (hostnames,
# domain) supplied privately. Same scanner as `tests/validate.sh` step `pii-guard` and the pytest twin
# tests/unit/test_leak_guard.py: one gate, run everywhere. It also scans the author, committer and message of every
# commit being merged, with the shared scanner every netcanon repository carries (.github/scripts/pii_guard.py).
# Runs on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main, 'homelab*']

# Read-only: this job only inspects the checked-out tree.
permissions:
  contents: read

jobs:
  scan-tracked-files:
    name: No leaked personal identifiers
    # ALWAYS GitHub-hosted (deliberately not the KONTROLL_RUNS_ON variable): the scan needs nothing but python3 + git,
    # and a secret-bearing step must not run on a shared self-hosted box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit-metadata scan walks BASE..HEAD

      - name: Self-test the shared scanner (each layer fires on a synthetic canary; clean text passes)
        run: python3 -I .github/scripts/pii_guard.py --self-test

      - name: Provide the instance-token list (repository secret KONTROLL_LEAK_TOKENS; absent on fork PRs)
        # The names that identify the maintainer's deployment live in a repository SECRET, one regex per line, so
        # the public repo's CI catches a real hostname/domain without ever publishing the list. Fork PRs have no
        # secrets: the layer then runs on the shipped canaries and the structural layer still enforces.
        env:
          TOKENS: ${{ secrets.KONTROLL_LEAK_TOKENS }}
        run: |
          if [ -n "$TOKENS" ]; then
            printf '%s\n' "$TOKENS" > "$RUNNER_TEMP/leak-tokens.txt"
            echo "KONTROLL_LEAK_TOKENS_FILE=$RUNNER_TEMP/leak-tokens.txt" >> "$GITHUB_ENV"
            n=$(grep -cvE '^\s*(#|$)' "$RUNNER_TEMP/leak-tokens.txt")
            echo "instance-token layer: repository secret ($n pattern(s))"
          else
            echo "instance-token layer: no KONTROLL_LEAK_TOKENS secret (fork PR or unset) — shipped canaries only"
          fi

      - name: Scan every shippable tracked file (structural + instance-token layers) and check the overlay invariant
        # --tree also checks the overlay-tracking invariant: a PUBLIC tree tracks nothing under instance/ and ignores
        # it (`/instance/*`); an INSTANCE tree tracks its overlay and every tracked path is re-included by
        # instance/.gitignore. A `git add -f`, a bad merge or a lost rule is a finding — the earlier path probe used
        # `git check-ignore` without --no-index, which never reports a TRACKED path, so it passed exactly that case.
        run: python3 -I tests/_leak_guard.py --tree

      - name: Scan the identity and message of every commit being merged
        # The server-side backstop for a clone without a pre-push hook. Fork and Dependabot PRs have no secrets:
        # the digest and user-profile-path layers still enforce.
        env:
          PII_GUARD_TOKENS: ${{ secrets.KONTROLL_LEAK_TOKENS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -I .github/scripts/pii_guard.py --range "$BASE" "$HEAD"

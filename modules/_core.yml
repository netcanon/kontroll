# Core collections — always installed, independent of which device modules are
# enabled. Not tied to any device class. Every collection the INSTALL playbooks
# themselves (bootstrap, local-canonical, deploy-stack) import must be listed here —
# that is what lets them run on any fleet (tests/unit/test_installer_phase1.py holds
# it) — beside the general utility base.
# The bootstrap merges these with the collections of every enabled module
# (instance/fleet.yml) to produce the final install set; the installer image bakes
# exactly this file (`gen-requirements.py --core`). See modules/README.md.
collections:
  - name: community.sops        # SOPS+age runtime secret decryption
    version: ">=1.6.0"
  - name: community.general     # broadly-used utility modules
    version: ">=9.0.0"
  - name: community.docker      # deploy-stack drives the control node's OWN Docker (image build, networks) —
    version: ">=4.0.0"          # on every fleet, also one with no docker_host class (which declares it too)

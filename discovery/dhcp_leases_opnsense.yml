# Discovery method: read an OPNsense firewall's OWN DHCPv4 lease table read-only, to surface un-onboarded hosts on
# the network into the onboard inbox. The CONCRETE worked example of the passive-discovery pattern (its analogue is
# logging/proxmox_api.yml — a credentialed read-only GET of a device's own API). PASSIVE by construction: the sweep
# GETs the lease view an already-onboarded firewall already keeps; it NEVER scans the network (no ICMP/ARP sweep, no
# CIDR expansion — the sweep only reaches the onboarded device address). Read-only: an HTTP GET reads leases and
# actuates NOTHING. SECURITY C18.
#
# Auth/token flow (C12): the OPNsense API key+secret are HTTP Basic (key=user, secret=pass), INJECTED as
# ${KONTROLL_OPNSENSE_DISCOVERY_KEY}/${KONTROLL_OPNSENSE_DISCOVERY_SECRET} at the fetcher boundary from the existing
# `network` SOPS domain — reused AS-SCOPED (a read-only API key; never widened). The value enters ONLY at the fetcher
# boundary, never the audit line / the artifact (which carry NAMES + counts only). Unset creds => the source is
# recorded `no-creds` and skipped (honest, non-fatal) — CI never needs them (the dispatch/parse is proven via an
# injected fake fetcher).
#
# F11 (dogfood-confirmed-not-CI-confirmed): the endpoint path + the row field NAMES below are the OPNsense
# /api/dhcpv4/leases/searchLease shape as documented; CI pins the parser against a mocked fixture of this ASSUMED
# shape (tests/fixtures/discovery/opnsense_searchlease.json). The deferred live-OPNsense dogfood confirms/corrects
# it — a 1-line `parse.fields` / `parse.rows` edit if the real shape differs.
name: dhcp_leases_opnsense
label: OPNsense DHCPv4 leases (read the firewall's own lease table, read-only)
order: 10
source:
  endpoint: "https://${DEVICE_ADDR}/api/dhcpv4/leases/searchLease"   # the sweep templates the host addr; mgmt-routed
  method: GET                                                        # hard-wired GET (the fetcher has no other verb)
  auth:
    strategy: basic                            # OPNsense API key+secret => HTTP Basic (key=user, secret=pass)
    value: "${KONTROLL_OPNSENSE_DISCOVERY_KEY}:${KONTROLL_OPNSENSE_DISCOVERY_SECRET}"   # ${ENV} only; never committed
  verify: false                                # an API firewall serves a self-signed cert; a read-only lease GET.
                                               # Deriving the posture from vendor_defaults (like proxmox_api) is a
                                               # later rung — Rung 1a reaches read-only with verify off (mgmt-VLAN).
# The parse SHAPE is a NAME the sweep's `_PARSERS` table keys on — NO function knows the word "opnsense" (de-bespoke,
# the no-bespoke-config tenet). `json_rows` = a JSON body `{<rows>: [ {<fields>}, ... ]}` (or a bare top-level array);
# a sibling DHCP-API method (routeros/fortigate/openwrt) reuses `json_rows` with its own rows/fields, never new code.
parse:
  shape: json_rows
  rows: rows                                   # the array field in the response body ({rows: [...], total: N})
  fields: {ip: address, mac: hwaddr, hostname: hostname}   # response field -> canonical {ip, mac, hostname}
secret_domain: network                         # REUSE the existing network domain's OPNsense API key, read-only use;
                                               # audited by NAME only (C12). No new SOPS domain.
# CREDS ARE OPERATOR-EXPORTED at sweep time (there is deliberately NO secret_env_map): gen-secret-env renders .env from
# metrics:/logs: only, never discovery:, and the network-domain field name is INSTANCE-GENERATED by onboard (dogfood-
# observed pattern <ns>_<coll>_<N>_<field>) so a shipped descriptor cannot hardcode it. Before the sweep the operator
# exports KONTROLL_OPNSENSE_DISCOVERY_KEY/SECRET from that domain — see discovery/README.md § Extending. Unset =>
# `no-creds`, skipped. (opnsense is STAGED — its network field is created at the post-cutover onboard.)
# NO applies_when -> DECLARED-only: opnsense ships no httpapi plugin (facts plugins:{}; the class declares raw_ssh),
# so a facts predicate would offer to NOTHING (F2). The class opts in via a `discovery:` block in its module.yml.
access_chain:
  chain: "control VM (kontroll net) -> sweep http_get -> HTTPS GET <opnsense>/api/dhcpv4/leases/searchLease (read-only)"
  may_break: nothing — a read-only lease poll; a creds/reach failure records the source `no-creds`/`unreachable`
  fallback: "no"
  blast_radius: control node only (an HTTP GET reads the lease table; actuates NOTHING on the firewall)

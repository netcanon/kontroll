---
# Generic liveness for ANY network_cli platform that ships a cliconf plugin.
# The device class provides ansible_network_os (network_os) + connection vars; this
# backend has NO vendor-specific code. backend_liveness_command is overridable.
- name: Liveness via cli_command (network_cli)
  ansible.netcommon.cli_command:
    command: "{{ backend_liveness_command | default('show version') }}"
  changed_when: false

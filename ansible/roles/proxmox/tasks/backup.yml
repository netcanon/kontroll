---
# Backup entrypoint for the Proxmox VE device class (hypervisor nodes).
# Captures the text configs needed to understand/rebuild a node: per-guest
# definitions (.conf), node network, and storage — all read-only over SSH.
# Follows the backup contract — see roles/cisco_ios/tasks/backup.yml.
#
# Scope note: this is a CONFIG capture (how the node + guests are defined), not a
# data/VM-image backup — bulk guest backups are vzdump/PBS's job, deliberately
# out of scope for this read-only seam.
#
# Access chain used:   control VM (mgmt VLAN) -> PVE node mgmt (SSH, root key)
# May break:           none (read-only `cat`/`pvesh get`)
# Fallback required:   no
# Blast radius:        none — pure read
# Idempotence:         capture file overwritten each run; no node state changes
#                      (an answer of headers alone is refused and writes nothing: I-10)
#
# no_log: storage.cfg can hold backend credentials and guest .conf can hold
# cloud-init passwords, so the capture output and file are no_log.

- name: Record skip when this class is not backup-capable
  ansible.builtin.set_fact:
    kontroll_backup_result: "skipped — class not backup-capable"
  when: not (backup_capable | default(true) | bool)

- name: Capture Proxmox node + guest config
  when:
    - backup_capable | default(true) | bool
  block:
    - name: Resolve capture filename
      ansible.builtin.set_fact:
        _backup_file: "Proxmox_{{ inventory_hostname }}_node-and-guests.txt"

    - name: Gather node + guest config (read-only)
      ansible.builtin.shell: |
        echo "### pveversion";            pveversion 2>/dev/null
        echo "### /etc/network/interfaces"; cat /etc/network/interfaces 2>/dev/null
        echo "### /etc/pve/storage.cfg";   cat /etc/pve/storage.cfg 2>/dev/null
        echo "### qemu guests (/etc/pve/qemu-server/*.conf)"
        for f in /etc/pve/qemu-server/*.conf; do [ -e "$f" ] || continue; echo "--- $f"; cat "$f"; done
        echo "### lxc guests (/etc/pve/lxc/*.conf)"
        for f in /etc/pve/lxc/*.conf; do [ -e "$f" ] || continue; echo "--- $f"; cat "$f"; done
      register: pve_cfg
      changed_when: false
      no_log: true                       # storage creds / cloud-init passwords

    # The script prints a `### ` header before each read, so a node that answers none of them (no pveversion, no
    # /etc/network/interfaces, no /etc/pve: not a Proxmox node) still exits 0 with the headers alone. That is no
    # config, and a capture of it would overwrite the last good one (I-10). So an answer with no line but its
    # headers (and blank lines) is recorded as a failed capture, which fails the run at its summary, and the write
    # does not run: any earlier capture is kept. A node whose cluster filesystem is not mounted still answers
    # pveversion and its network config (neither is under /etc/pve), so its capture is written without storage.cfg
    # or a guest's .conf; the one before it stays in the history (I-50). `shell` does not run its script under
    # --check: it skips it with no `skip_reason` (a `when` that skips a task adds one), so only that skip is taken
    # as not read, and the dry-run previews an empty capture, as the other backups' do. An unreachable host (the
    # play tolerates one) gave no answer either: it is not refused, and the summary says so.
    - name: Record an empty capture as failed (any earlier capture is kept)
      ansible.builtin.set_fact:
        kontroll_backup_result: >-
          FAILED: the node answered only the capture's section headers (no pveversion, network or /etc/pve), so no
          capture was written and any earlier one is kept.
        kontroll_backup_failed: true
      when:
        - pve_cfg is not unreachable
        - not (ansible_check_mode and pve_cfg is skipped and pve_cfg.skip_reason is not defined)
        - (pve_cfg.stdout | default('')).splitlines() | reject('match', '### ') | join('') | trim | length == 0

    - name: Write capture
      ansible.builtin.copy:
        content: "{{ pve_cfg.stdout }}\n"
        dest: "{{ config_backup_dir }}/{{ _backup_file }}"
        mode: "0640"
      delegate_to: localhost
      no_log: true                       # content is the secret-bearing config
      register: _pve_write
      when: >-
        ((pve_cfg.stdout | default('')).splitlines() | reject('match', '### ') | join('') | trim | length > 0)
        or (ansible_check_mode and pve_cfg is skipped and pve_cfg.skip_reason is not defined)

    # Recorded where the write ran (in a dry-run, its preview), and only there, so "captured" never outruns the write.
    - name: Record successful capture
      ansible.builtin.set_fact:
        kontroll_backup_result: "captured -> {{ _backup_file }}"
      when: _pve_write is not skipped

---
# Generic liveness check for REST/API devices — driven by a per-API recipe
# (ansible/backends/api/recipes/<name>.yml). Plain `uri` GET against the recipe's
# `check.path`, delegated to localhost; no vendor module, no httpapi plugin.
# A device class points here via `role: backend_api` + `backend_api_recipe: <name>`.
#
# Access chain used:   control node (localhost) -> device REST API (HTTPS)
# May break:           none (read-only GET)
# Blast radius:        none — pure read
# no_log:              the request carries the API token

- name: Load the API recipe
  ansible.builtin.set_fact:
    _api_recipe: >-
      {{ lookup('file', role_path | dirname | dirname
         ~ '/backends/api/recipes/' ~ backend_api_recipe ~ '.yml') | from_yaml }}
  when: backend_api_recipe is defined

- name: Liveness via the recipe's check endpoint
  when:
    - backend_api_recipe is defined
    - _api_recipe.check is defined
  block:
    - name: Resolve the auth token — the recipe's token_var, else the onboarded per-host convention
      # TWO names are tried because the repo has always had two, and they never met.
      #
      # The recipe declares the var it READS (`token_var`, e.g. `fortios_api_token`), and
      # backends/api/backend.yml said "the token's hostvar is the recipe's token_var (resolved by the
      # planner)". Nothing ever resolved it: service/onboard.py built `backend_params` with only
      # `network_os`, so `params.get("token_var")` was always None and every onboarded api host got
      # `<host>_api_token` instead — a name this role never looked up. paths.py:35 defines RECIPES_DIR and
      # no Python reads it. So the documented design was never implemented, and the edge-firewall check had
      # been unable to authenticate for as long as the class had existed. (Since S27 that per-host name is
      # backend.yml's own `maps_to` template for `api_token`.)
      #
      # `default=''` is load-bearing. ansible/plugins/lookup/vars.py raises AnsibleUndefinedVariable for a
      # missing name, and this task carries `no_log: true`, so that fatal arrived CENSORED — ping.yml's
      # block/rescue then reported a perfectly healthy device as a bare `UNREACHABLE` with nothing to go on.
      # Live-caught 2026-07-28.
      ansible.builtin.set_fact:
        _api_token: >-
          {{ lookup('vars', _api_recipe.auth.token_var, default='')
             | default(lookup('vars', inventory_hostname | replace('-', '_') ~ '_api_token', default=''), true) }}
      when: _api_recipe.auth.token_var is defined
      no_log: true

    - name: Refuse an unresolvable API credential (var NAMES only — never the value)
      # Deliberately NOT no_log: the whole failure of the old code was being silent. `assert` reports the
      # `that` expression, not the evaluated token, and the message names variables rather than secrets.
      # Also catches the empty-string case peer review flagged: kontroll_sops_domain returns {} for an
      # absent or undecryptable domain, so a lookup can succeed and still yield nothing — which would
      # otherwise authenticate as anonymous and be indistinguishable from a credential failure.
      ansible.builtin.assert:
        that: _api_token | default('') | length > 0
        fail_msg: >-
          {{ inventory_hostname }}: no API token is in scope, so this check cannot authenticate.
          The {{ backend_api_recipe }} recipe reads `{{ _api_recipe.auth.token_var }}`; the onboard writes
          `{{ inventory_hostname | replace('-', '_') }}_api_token`. Neither is defined, or both are empty.
          Define one in the host's inventory drop-in as an inline community.sops lookup into its SOPS domain.
        success_msg: "{{ inventory_hostname }}: API token resolved"
      when: _api_recipe.auth.token_var is defined

    - name: Build request headers (bearer / apikey_header)
      ansible.builtin.set_fact:
        _api_headers: "{{ {(_api_recipe.auth.header_name | default('Authorization')):
          (('Bearer ' ~ _api_token) if _api_recipe.auth.type == 'bearer' else _api_token)} }}"
      when: _api_recipe.auth.type in ['bearer', 'apikey_header']
      no_log: true

    - name: GET the check endpoint
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ _api_recipe.port | default(443) }}{{ _api_recipe.check.path }}"
        method: "{{ _api_recipe.check.method | default('GET') }}"
        headers: "{{ _api_headers | default({}) }}"
        url_username: >-
          {{ lookup('vars', _api_recipe.auth.username_var)
             if _api_recipe.auth.username_var is defined else omit }}
        url_password: >-
          {{ lookup('vars', _api_recipe.auth.password_var)
             if _api_recipe.auth.password_var is defined else omit }}
        force_basic_auth: "{{ _api_recipe.auth.type == 'basic' }}"
        validate_certs: "{{ _api_recipe.validate_certs | default(false) }}"
      delegate_to: localhost
      register: _api_check
      changed_when: false
      failed_when: false           # branch on status below — a censored `uri` fatal tells the operator nothing
      no_log: true                 # request carries the live API token

    # `uri` has no check mode, so a --check run skips the GET and its result has no status. The dry-run reports that
    # it did not ask, and the refusal below does not read that skip as a failed answer. A check-mode skip registers no
    # `skip_reason` (a `when` that skips a task adds one), so only it is taken as not asked. A real run reads the
    # status as before, and a read a real run skipped, or a dry-run's skipped by a `when`, is still refused.
    - name: Report the check endpoint as not read in a dry-run
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: the {{ backend_api_recipe }} check endpoint is not read in a dry-run (`uri` has no
          check mode), so its API was not asked; a real run reads it.
      when:
        - ansible_check_mode
        - _api_check is skipped
        - _api_check.skip_reason is not defined

    - name: Refuse unless the API actually answered successfully
      # THE LIVENESS CHECK'S ONLY TEETH. Before this task, `_api_check` was registered with
      # `failed_when: false` and then never read again — the file ended one line below. A 200, a 401, a 403
      # and a refused connection were indistinguishable, so the edge-firewall check COULD NOT FAIL. It
      # reported success against a device it had never authenticated to. That is worse than no check: a
      # green result was actively misleading, and this is the highest-blast-radius device in the fleet.
      #
      # ping.yml wraps the class check in block/rescue, so failing here is how a device is correctly
      # recorded UNREACHABLE. Only `status` and the recipe's path are surfaced — the response BODY can be
      # device configuration and the request carried the token, so neither is safe to print. That is
      # precisely why this is a separate task rather than dropping `no_log` on the GET.
      #
      # The remedy names the variables the recipe's auth type reads, never their values: a `basic` recipe has
      # `username_var`/`password_var` and no `token_var` (naming `token_var` failed the message itself on a basic
      # 401, I-7), and a token recipe's token resolves from `token_var`, else the onboarded per-host name. A
      # status below 0 (uri's "no response": refused, timed out, TLS) or none is the transport's; any other
      # non-success status is the API's own answer.
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: {{ backend_api_recipe }} liveness check FAILED —
          HTTP {{ _api_check.status | default('no response') }} from {{ _api_recipe.check.path }}.
          {{ _api_auth_hint
             if (_api_check.status | default(0)) in [401, 403]
             else ('The device did not answer the API port — wrong address, port, or the service is down.'
                   if (_api_check.status | default(-1) | int) < 0
                   else 'The API answered with an error: check the recipe check path and the device API.') }}
      vars:
        _api_auth_hint: >-
          {{ ('The API rejected the credential: check that `' ~ (_api_recipe.auth.username_var | default('?'))
              ~ '` and `' ~ (_api_recipe.auth.password_var | default('?'))
              ~ '` hold a current username and password with read permission.')
             if (_api_recipe.auth.type | default('')) == 'basic'
             else (('The API rejected the credential: check that `' ~ _api_recipe.auth.token_var
                    ~ '` (or, if it is empty, `' ~ (inventory_hostname | replace('-', '_'))
                    ~ '_api_token`) holds a current token with read permission.')
                   if _api_recipe.auth.token_var is defined
                   else 'The API refused the request, and the recipe sends no credential: name one in its auth.') }}
      when:
        - not (ansible_check_mode and _api_check is skipped and _api_check.skip_reason is not defined)
        - (_api_check.status | default(0)) not in [200, 201, 204]

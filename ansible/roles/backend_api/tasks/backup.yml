---
# Generic config backup for REST/API devices and services — driven by a per-API
# RECIPE (ansible/backends/api/recipes/<name>.yml), not a vendor module. A device
# class points here via `role: backend_api` + `backend_api_recipe: <name>`. The
# recipe declares auth + the backup endpoint; this role does a plain `uri` request
# (delegated to localhost) and writes the body. Vendor-neutral: one role, N recipes.
# This is the generalization of the proven roles/fortigate capture.
#
# Access chain used:   control node (localhost) -> device REST API (HTTPS)
# May break:           none (recipe backup endpoints are read-only GET/export)
# Fallback required:   no
# Blast radius:        none — pure read
# Idempotence:         capture file overwritten each run; no device state changes
# no_log:              the token or basic-auth pair (request) and the returned config (response) are secret

- name: Record skip when this class is not backup-capable
  ansible.builtin.set_fact:
    kontroll_backup_result: "skipped — class not backup-capable"
  when: not (backup_capable | default(true) | bool)

- name: Load the API recipe
  ansible.builtin.set_fact:
    _api_recipe: >-
      {{ lookup('file', role_path | dirname | dirname
         ~ '/backends/api/recipes/' ~ backend_api_recipe ~ '.yml') | from_yaml }}
  when:
    - backup_capable | default(true) | bool
    - backend_api_recipe is defined

- name: Record skip when no recipe / no backup endpoint
  ansible.builtin.set_fact:
    kontroll_backup_result: "skipped — api backend needs backend_api_recipe with a backup endpoint"
  when:
    - backup_capable | default(true) | bool
    - (backend_api_recipe is not defined) or (_api_recipe.backup is not defined)

- name: Capture config via the API recipe
  when:
    - backup_capable | default(true) | bool
    - backend_api_recipe is defined
    - _api_recipe.backup is defined
  block:
    - name: Look up the auth token, refusing by name a lookup that fails
      # As in tasks/check.yml: `default=''` below catches a name not in scope. It cannot catch a name that is defined
      # and whose own value fails when it is read: an inline community.sops lookup whose domain file is missing or
      # cannot be decrypted on this box (no age key), or, on 2.19, lacks the key it reads. Such a value fails the
      # no_log resolve, censored, and on 2.18 nothing else is printed (ping.yml would name only the task); the
      # rescue refuses the host by name instead (I-16's reads).
      block:
        - name: Resolve the auth token — the recipe's token_var, else the onboarded per-host convention
          # Same two-name resolution and the same `default=''` reason as tasks/check.yml — see the long comment
          # there. Without the default, a missing var raises under `no_log` and the nightly backup schedule fails
          # with a censored message at 02:30 with nobody watching. The per-host name is read only when the
          # recipe's yields nothing, for the reason check.yml gives.
          ansible.builtin.set_fact:
            _api_token: >-
              {{ lookup('vars', _api_recipe.auth.token_var, default='')
                 or lookup('vars', inventory_hostname | replace('-', '_') ~ '_api_token', default='') }}
          when: _api_recipe.auth.token_var is defined
          no_log: true
      rescue:
        - name: Refuse an API token whose lookup failed (var NAMES only — never the value)
          # Not no_log, as the refusal of an empty credential is not. It reads nothing of the failed task (its result
          # is the censored one): the names it prints are the recipe's and the host's, never a value.
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: the lookup of the API token failed, so this capture cannot authenticate. The
              {{ backend_api_recipe }} recipe reads `{{ _api_recipe.auth.token_var }}`; the onboard writes `{{
              inventory_hostname | replace('-', '_') }}_api_token`. One of them is defined, and its value failed when
              it was read; for an inline community.sops lookup, its SOPS domain is missing, this box cannot decrypt it
              (no age key), or it lacks the key the lookup reads.

    - name: Refuse an unresolvable API credential (var NAMES only — never the value)
      # A capture that silently authenticates as nobody would write an error page into the config store and
      # commit it as this device's backup. Fail before the request instead.
      ansible.builtin.assert:
        that: _api_token | default('') | length > 0
        fail_msg: >-
          {{ inventory_hostname }}: no API token is in scope, so this capture cannot authenticate.
          The {{ backend_api_recipe }} recipe reads `{{ _api_recipe.auth.token_var }}`; the onboard writes
          `{{ inventory_hostname | replace('-', '_') }}_api_token`. Neither is defined, or both are empty
          (where a drop-in defines one, its SOPS domain may hold that key empty, or lack it).
        success_msg: "{{ inventory_hostname }}: API token resolved"
      when: _api_recipe.auth.token_var is defined

    - name: Look up the basic-auth pair, refusing by name a lookup that fails
      # As for the token above: a defined name whose value fails when it is read is refused by the rescue.
      block:
        - name: Resolve the basic-auth pair — the recipe's username_var and password_var, else the per-host names
          # The token's two-name rule for the basic pair, and the reason it is resolved here and not in the pull's own
          # arguments, as tasks/check.yml says: a name not in scope failed the pull under its `no_log`, censored, so the
          # nightly backup failed with nothing to go on. The per-host name is read only when the recipe's yields
          # nothing.
          ansible.builtin.set_fact:
            _api_username: >-
              {{ (lookup('vars', _api_recipe.auth.username_var, default='')
                  if _api_recipe.auth.username_var is defined else '')
                 or lookup('vars', inventory_hostname | replace('-', '_') ~ '_api_username', default='') }}
            _api_password: >-
              {{ (lookup('vars', _api_recipe.auth.password_var, default='')
                  if _api_recipe.auth.password_var is defined else '')
                 or lookup('vars', inventory_hostname | replace('-', '_') ~ '_api_password', default='') }}
          when: >-
            (_api_recipe.auth.type | default('')) == 'basic' or _api_recipe.auth.username_var is defined
            or _api_recipe.auth.password_var is defined
          no_log: true
      rescue:
        - name: Refuse a basic-auth pair whose lookup failed (var NAMES only — never the values)
          # Not no_log, as the refusal of an empty credential is not. It reads nothing of the failed task (its result
          # is the censored one): the names it prints are the recipe's and the host's, never a value.
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: the lookup of the API username or password failed, so this capture cannot
              authenticate. The {{ backend_api_recipe }} recipe reads {{ ('`' ~ _api_recipe.auth.username_var ~ '`')
              if _api_recipe.auth.username_var is defined else 'no username var' }} and {{ ('`' ~
              _api_recipe.auth.password_var ~ '`') if _api_recipe.auth.password_var is defined else 'no password var'
              }}; the onboard writes `{{ inventory_hostname | replace('-', '_') }}_api_username` and `{{
              inventory_hostname | replace('-', '_') }}_api_password`. One of them is defined, and its value failed
              when it was read; for an inline community.sops lookup, its SOPS domain is missing, this box cannot
              decrypt it (no age key), or it lacks the key the lookup reads.

    - name: Refuse an unresolvable basic-auth pair (var NAMES only — never the values)
      # As for the token: a capture that authenticates as nobody would write an error page into the config store
      # and commit it as this device's backup. Fail before the request instead.
      ansible.builtin.assert:
        that:
          - _api_username | default('') | length > 0
          - _api_password | default('') | length > 0
        fail_msg: >-
          {{ inventory_hostname }}: the API username or password (the failed assertion says which) is not in scope,
          so this capture cannot authenticate. The {{ backend_api_recipe }} recipe reads {{ ('`' ~
          _api_recipe.auth.username_var ~ '`') if _api_recipe.auth.username_var is defined else 'no username var' }}
          and {{ ('`' ~ _api_recipe.auth.password_var ~ '`') if _api_recipe.auth.password_var is defined else 'no
          password var' }}; the onboard writes `{{ inventory_hostname | replace('-', '_') }}_api_username` and `{{
          inventory_hostname | replace('-', '_') }}_api_password`. Neither name is defined, or both are empty
          (where a drop-in defines one, its SOPS domain may hold that key empty, or lack it). Define them in the
          host's inventory drop-in as inline community.sops lookups into its SOPS domain.
        success_msg: "{{ inventory_hostname }}: API username and password resolved"
      when: >-
        (_api_recipe.auth.type | default('')) == 'basic' or _api_recipe.auth.username_var is defined
        or _api_recipe.auth.password_var is defined

    - name: Build request headers (bearer / apikey_header)
      ansible.builtin.set_fact:
        _api_headers: "{{ {(_api_recipe.auth.header_name | default('Authorization')):
          (('Bearer ' ~ _api_token) if _api_recipe.auth.type == 'bearer' else _api_token)} }}"
      when: _api_recipe.auth.type in ['bearer', 'apikey_header']
      no_log: true

    - name: Ensure the capture dir exists (backend is self-sufficient)
      ansible.builtin.file:
        path: "{{ config_backup_dir }}"
        state: directory
        mode: "0700"            # deploy-stack.yml's mode: the captures hold device secrets (C8)
      delegate_to: localhost

    - name: Resolve capture filename
      ansible.builtin.set_fact:
        _backup_file: "{{ _api_recipe.backup.label | default(backend_backup_label | default(device_role)) }}_{{
          ansible_host | replace('.', '-') }}_{{ _api_recipe.backup.suffix | default('config') }}"

    - name: Pull config via the recipe's backup endpoint
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ _api_recipe.port | default(443) }}{{ _api_recipe.backup.path }}"
        method: "{{ _api_recipe.backup.method | default('GET') }}"
        headers: "{{ _api_headers | default({}) }}"
        url_username: "{{ _api_username if _api_username is defined else omit }}"
        url_password: "{{ _api_password if _api_password is defined else omit }}"
        force_basic_auth: "{{ _api_recipe.auth.type == 'basic' }}"
        validate_certs: "{{ _api_recipe.validate_certs | default(false) }}"
        return_content: true
      delegate_to: localhost
      register: _api_resp
      changed_when: false
      failed_when: false                 # branch on status below — don't abort the host
      no_log: true                       # request carries the token, response the config

    # `uri` has no check mode: a --check run skips the pull, and its result then has no status or content. The
    # dry-run reports that it did not pull and previews an empty capture, as the raw-SSH and RouterOS backups do; it
    # does not read that skip as a failed answer. A check-mode skip registers no `skip_reason` (a `when` that skips a
    # task adds one), so only it is taken as not pulled. A real run reads the status and content as before, and a
    # pull a real run skipped, or a dry-run's skipped by a `when`, is still a failed capture.
    - name: Report the backup endpoint as not read in a dry-run
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: the {{ backend_api_recipe }} backup endpoint is not read in a dry-run (`uri` has
          no check mode), so no config was pulled and none is written; a real run pulls it.
      when:
        - ansible_check_mode
        - _api_resp is skipped
        - _api_resp.skip_reason is not defined

    # The failure names its cause as the check's refusal does (tasks/check.yml): a 401 or 403 prints the hint for the
    # recipe's auth, the check's word for word, which names the variables it reads and never their values; no status,
    # or one below 0, is a device that did not answer; any other status is an API that answered, but not with 200. The
    # summary prints this result, so it reads only the status, the recipe's backup path and the names its auth reads,
    # and the task's only var is the hint: a task var outranks a host var, so another could rebind a printed name.
    - name: Record capture failure (reported in summary, not a hard abort)
      ansible.builtin.set_fact:
        kontroll_backup_result: >-
          FAILED: HTTP {{ _api_resp.status | default('?') }} from the {{ backend_api_recipe }}
          backup endpoint {{ _api_recipe.backup.path }}.
          {{ _api_auth_hint
             if (_api_resp.status | default(0)) in [401, 403]
             else (('The device did not answer the API port, or its TLS failed — wrong address, port, certificate,'
                    ~ ' or the service is down.')
                   if (_api_resp.status | default(-1) | int) < 0
                   else ('The API answered, but not with 200: check the recipe backup path and method, and the'
                         ~ ' device API.')) }}
        kontroll_backup_failed: true
      vars:
        _api_auth_hint: >-
          {{ ('The API rejected the credential: check that '
              ~ (('`' ~ _api_recipe.auth.username_var ~ '` (or, if that is unset or empty, `')
                 if _api_recipe.auth.username_var is defined else '`')
              ~ (inventory_hostname | replace('-', '_')) ~ '_api_username`'
              ~ (')' if _api_recipe.auth.username_var is defined else '') ~ ' and '
              ~ (('`' ~ _api_recipe.auth.password_var ~ '` (or, if that is unset or empty, `')
                 if _api_recipe.auth.password_var is defined else '`')
              ~ (inventory_hostname | replace('-', '_')) ~ '_api_password`'
              ~ (')' if _api_recipe.auth.password_var is defined else '')
              ~ ' hold a current username and password with read permission.')
             if (_api_recipe.auth.type | default('')) == 'basic' or _api_recipe.auth.username_var is defined
                or _api_recipe.auth.password_var is defined
             else (('The API rejected the credential: check that `' ~ _api_recipe.auth.token_var
                    ~ '` (or, if that is unset or empty, `' ~ (inventory_hostname | replace('-', '_'))
                    ~ '_api_token`) holds a current token with read permission.')
                   if _api_recipe.auth.token_var is defined
                   else 'The API refused the request, and the recipe sends no credential: name one in its auth.') }}
      when:
        - not (ansible_check_mode and _api_resp is skipped and _api_resp.skip_reason is not defined)
        - (_api_resp.status | default(0)) != 200

    # A 200 with nothing in its body (empty, or only blank lines) is no config, and a capture of it would overwrite
    # the last good one. So it is recorded as a failed capture too, and the write does not run: any earlier capture
    # is kept. Only a pull that was made has a status, so a dry-run's skipped pull is never refused here.
    - name: Record an empty capture as failed (any earlier capture is kept)
      ansible.builtin.set_fact:
        kontroll_backup_result: >-
          FAILED: the {{ backend_api_recipe }} backup endpoint {{ _api_recipe.backup.path }} answered HTTP 200 with
          nothing in its body, so no capture was written and any earlier one is kept.
        kontroll_backup_failed: true
      when:
        - (_api_resp.status | default(0)) == 200
        - _api_resp.content | default('') | trim | length == 0

    - name: Write capture
      ansible.builtin.copy:
        content: "{{ _api_resp.content | default('') if ansible_check_mode else _api_resp.content }}"
        dest: "{{ config_backup_dir }}/{{ _backup_file }}"
        mode: "0640"
      delegate_to: localhost
      no_log: true                       # content is the secret-bearing config
      register: _api_write
      when: >-
        ((_api_resp.status | default(0)) == 200 and (_api_resp.content | default('') | trim | length > 0))
        or (ansible_check_mode and _api_resp is skipped and _api_resp.skip_reason is not defined)

    # Recorded where the write ran (in a dry-run, its preview), and only there, so "captured" never outruns the write.
    - name: Record successful capture
      ansible.builtin.set_fact:
        kontroll_backup_result: "captured -> {{ _backup_file }}"
      when: _api_write is not skipped

---
# Backup entrypoint for the OPNsense device class (STAGED — post-cutover edge).
# Captures /conf/config.xml (the complete restorable config) via SSH. Follows the
# backup contract — see roles/cisco_ios/tasks/backup.yml.
#
# STAGED: logic written from OPNsense conventions but NOT yet verified against a
# live device — there is no OPNsense in the active fleet. Verify at cutover
# before trusting the output.
#
# Access chain used:   control VM (mgmt VLAN) -> OPNsense mgmt (SSH, root)
# May break:           none (read-only `cat`)
# Fallback required:   no
# Blast radius:        none — pure read
# Idempotence:         capture file overwritten each run; no device state changes
#
# no_log: config.xml carries secrets (CA keys, PSKs, password hashes).

- name: Record skip when this class is not backup-capable
  ansible.builtin.set_fact:
    kontroll_backup_result: "skipped — class not backup-capable"
  when: not (backup_capable | default(true) | bool)

- name: Capture OPNsense config.xml
  when:
    - backup_capable | default(true) | bool
  block:
    - name: Resolve capture filename
      ansible.builtin.set_fact:
        _backup_file: "OPNsense_{{ ansible_host | replace('.', '-') }}_config.xml"

    - name: Read /conf/config.xml
      ansible.builtin.slurp:
        src: /conf/config.xml
      register: opn_cfg
      no_log: true

    # A config.xml with nothing in it (empty, or only blank lines) is no config, and a capture of it would overwrite
    # the last good one. So that answer is recorded as a failed capture, which fails the run at its summary, and the
    # write does not run: any earlier capture is kept. `slurp` reads in a --check run too, so a dry-run is held to the
    # same answer.
    # An unreachable host (the play tolerates one) gave no answer either: it is not refused, and the summary says so.
    - name: Record an empty capture as failed (any earlier capture is kept)
      ansible.builtin.set_fact:
        kontroll_backup_result: >-
          FAILED: /conf/config.xml is empty or only blank lines, so no capture was written and any earlier one is kept.
        kontroll_backup_failed: true
      when:
        - opn_cfg is not unreachable
        - opn_cfg.content | default('') | b64decode | trim | length == 0

    - name: Write capture
      ansible.builtin.copy:
        content: "{{ opn_cfg.content | b64decode }}"
        dest: "{{ config_backup_dir }}/{{ _backup_file }}"
        mode: "0640"
      delegate_to: localhost
      no_log: true                       # content is the secret-bearing config
      register: _opn_write
      when: opn_cfg.content | default('') | b64decode | trim | length > 0

    # Recorded where the write ran, and only there, so "captured" never outruns the write.
    - name: Record successful capture
      ansible.builtin.set_fact:
        kontroll_backup_result: "captured -> {{ _backup_file }} (staged/unverified)"
      when: _opn_write is not skipped

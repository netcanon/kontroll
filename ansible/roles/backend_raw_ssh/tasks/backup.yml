---
# Generic config backup for bespoke SSH devices — captures the output of a
# device-supplied command (backend_backup_command, e.g. `uci export`) over raw SSH.
# The backend for things with no collection — chosen by declaration, never as a catch-all
# (S24). A device class points here by declaring `role: backend_raw_ssh` + backend_backup_command.
#
# Access chain used:   control node -> device (raw SSH)
# May break:           none (read-only — runs only the capture command)
# Fallback required:   no
# Blast radius:        none — pure read (caller must supply a read-only command)
# Idempotence:         capture file overwritten each run; no device state changes
# no_log:              the captured config may carry secrets (PSKs, passwords)

- name: Record skip when this class is not backup-capable
  ansible.builtin.set_fact:
    kontroll_backup_result: "skipped — class not backup-capable"
  when: not (backup_capable | default(true) | bool)

- name: Record skip when no backup command is configured
  ansible.builtin.set_fact:
    kontroll_backup_result: "skipped — raw_ssh backend needs backend_backup_command"
  when:
    - backup_capable | default(true) | bool
    - backend_backup_command is not defined

- name: Capture config (raw SSH, generic)
  when:
    - backup_capable | default(true) | bool
    - backend_backup_command is defined
  block:
    - name: Ensure the capture dir exists (backend is self-sufficient)
      ansible.builtin.file:
        path: "{{ config_backup_dir }}"
        state: directory
        mode: "0700"            # deploy-stack.yml's mode: the captures hold device secrets (C8)
      delegate_to: localhost

    - name: Resolve capture filename
      ansible.builtin.set_fact:
        _backup_file: "{{ backend_backup_label | default(device_role) }}_{{ ansible_host | replace('.', '-') }}.cfg"

    - name: Pull config via raw command
      ansible.builtin.raw: "{{ backend_backup_command }}"
      register: _cfg
      changed_when: false
      no_log: true

    # A command that answers nothing (exit 0 with no output, or only blank lines) has given no config, and a capture
    # of it would overwrite the last good one. So that answer is recorded as a failed capture, which fails the run at
    # its summary, and the write does not run: any earlier capture is kept. `raw` has no check mode: a --check run
    # skips it, and its result then has no stdout. A check-mode skip registers no `skip_reason` (a `when` that skips
    # a task adds one), so only it is taken as not read: the dry-run previews an empty capture, as it did since T27
    # (tests/fresh-node-check.sh's backup step failed here), and refuses nothing it did not read.
    # An unreachable host (the play tolerates one) gave no answer either: it is not refused, and the summary says so.
    - name: Record an empty capture as failed (any earlier capture is kept)
      ansible.builtin.set_fact:
        kontroll_backup_result: >-
          FAILED: `{{ backend_backup_command }}` answered nothing, so no capture was written and any earlier one is
          kept.
        kontroll_backup_failed: true
      when:
        - _cfg is not unreachable
        - not (ansible_check_mode and _cfg is skipped and _cfg.skip_reason is not defined)
        - _cfg.stdout | default('') | trim | length == 0

    - name: Write capture
      ansible.builtin.copy:
        content: "{{ _cfg.stdout | default('') if ansible_check_mode else _cfg.stdout }}"
        dest: "{{ config_backup_dir }}/{{ _backup_file }}"
        mode: "0640"
      delegate_to: localhost
      no_log: true
      register: _cfg_write
      when: >-
        (_cfg.stdout | default('') | trim | length > 0)
        or (ansible_check_mode and _cfg is skipped and _cfg.skip_reason is not defined)

    # Recorded where the write ran (in a dry-run, its preview), and only there, so "captured" never outruns the write.
    - name: Record successful capture
      ansible.builtin.set_fact:
        kontroll_backup_result: "captured -> {{ _backup_file }}"
      when: _cfg_write is not skipped

---
# Backup entrypoint for the docker_host device class.
# This class is NOT backup-capable by default (see defaults/main.yml): a docker
# host has no single uniform "device config" — its real state is per-app appdata
# and compose files managed outside this seam. So the default path is a clean,
# logged skip, NOT a forced empty capture.
#
# If you set `backup_capable: true` on a specific host (host_vars/<host>.yml),
# the capable branch below captures a lightweight CONTAINER/STACK MANIFEST
# (what's deployed), which is a useful inventory but not a full config restore.
# Add that host's deeper, app-specific capture here behind the same gate.
#
# Access chain used:   control VM (mgmt VLAN) -> docker host (SSH, root key)
# May break:           none (read-only `docker ...`)
# Fallback required:   no
# Blast radius:        none — pure read
# Idempotence:         capture file overwritten each run; no host state changes
# no_log:              the manifest is no config, but `docker ps -a` prints each container's command line
#                      (truncated), and a credential passed as an argument can show there (I-13)

- name: Record skip when this class is not backup-capable
  ansible.builtin.set_fact:
    kontroll_backup_result: "skipped — not backup-capable (docker state is app-managed; opt in per host)"
  when: not (backup_capable | default(false) | bool)

- name: Capture container/stack manifest (opt-in hosts only)
  when:
    - backup_capable | default(false) | bool
  block:
    - name: Resolve capture filename
      ansible.builtin.set_fact:
        _backup_file: "Docker_{{ inventory_hostname }}_manifest.txt"

    # `set -e`: a read that fails (no docker: 127; no daemon, or no access to its socket: 1) stops the script there,
    # so its exit code is that read's, not the last read's. The compose plugin is optional: a host without it answers
    # its other sections and an empty stacks section, and is captured (I-62: its `docker compose ls` failed the
    # read, as the script's last command). `failed_when: false`: a read that fails is recorded below as a failed
    # capture, which the summary reports and fails the run on, as the API backend's non-200 is; before, the host
    # failed at this task and left the summary with no line for it (I-62).
    - name: Gather container + stack manifest (read-only, brace-free output)
      ansible.builtin.shell: |
        set -e
        echo "### docker version";   docker version 2>/dev/null
        echo "### containers";       docker ps -a 2>/dev/null
        echo "### images";           docker images 2>/dev/null
        echo "### compose stacks"
        if docker compose version >/dev/null 2>&1; then docker compose ls --all 2>/dev/null; fi
      register: dkr
      changed_when: false
      failed_when: false                 # recorded below; the summary fails the run on it
      no_log: true                       # a container's command line can carry a credential

    # The message names the exit code alone: the answer is no_log, and the summary prints this line.
    - name: Record capture failure (reported in summary, not a hard abort)
      ansible.builtin.set_fact:
        kontroll_backup_result: >-
          FAILED: the manifest read exited {{ dkr.rc | default('without an exit code') }} (no docker, no daemon, or
          no access to it), so no capture was written and any earlier one is kept.
        kontroll_backup_failed: true
      when:
        - dkr is not unreachable
        - dkr is not skipped
        - (dkr.rc | default(1)) != 0

    # The script prints a `### ` header before each read, so a host that answers none of them exits with the headers
    # alone. A read that fails is recorded above (the script stops there); but a docker that answers nothing and
    # exits 0 gave a manifest of headers, which is no manifest, and it overwrote the last good one (I-10). So an
    # answer with no line but its headers (and blank lines) is recorded as a failed capture, which fails the run at
    # its summary, and the write does not run: any earlier capture is kept. `shell` does not run its script under
    # --check: it skips it with no `skip_reason` (a `when` that skips a task adds one), so only that skip is taken
    # as not read, and the dry-run previews an empty capture. An unreachable host (the play tolerates one) gave no
    # answer either: it is not refused.
    - name: Record an empty capture as failed (any earlier capture is kept)
      ansible.builtin.set_fact:
        kontroll_backup_result: >-
          FAILED: the host answered only the manifest's section headers (no docker version, containers, images or
          stacks), so no capture was written and any earlier one is kept.
        kontroll_backup_failed: true
      when:
        - dkr is not unreachable
        - (dkr.rc | default(0)) == 0
        - not (ansible_check_mode and dkr is skipped and dkr.skip_reason is not defined)
        - (dkr.stdout | default('')).splitlines() | reject('match', '### ') | join('') | trim | length == 0

    - name: Write capture
      ansible.builtin.copy:
        content: "{{ dkr.stdout }}\n"
        dest: "{{ config_backup_dir }}/{{ _backup_file }}"
        mode: "0640"
      delegate_to: localhost
      register: _dkr_write
      when: >-
        ((dkr.rc | default(0)) == 0
         and (dkr.stdout | default('')).splitlines() | reject('match', '### ') | join('') | trim | length > 0)
        or (ansible_check_mode and dkr is skipped and dkr.skip_reason is not defined)
      no_log: true                       # the diff of a dry-run would print the manifest

    # Recorded where the write ran (in a dry-run, its preview), and only there, so "captured" never outruns the write.
    - name: Record successful capture
      ansible.builtin.set_fact:
        kontroll_backup_result: "captured -> {{ _backup_file }} (manifest)"
      when: _dkr_write is not skipped

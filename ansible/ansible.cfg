# tests/unit/test_group_dispatch_refuses_local.py holds this file to its shipped sections, `[defaults]` keys and
# values (`_CFG_SECTIONS`, `_CFG_DEFAULTS`, `_CFG_INVENTORY`, `_SSH_CONNECTION`) and filter_plugins/ to its pinned
# files (`_FILTER_FILES`): a change to either changes that pin in the same diff (SECURITY.md C4). Comment lines are
# not held.
[defaults]
inventory          = ../instance/inventory
roles_path         = roles
collections_path   = collections
# Custom Jinja filters the playbooks use (kontroll_render_token composes a secret env value from a secret_env_map
# template; kontroll_sops_domain decrypts a SOPS domain by name for the unified .env render loop). Resolved from
# the deploy cwd (ansible/), same as roles_path/collections_path — Ansible's DEFAULT filter search is
# playbook-adjacent (ansible/playbooks/) + ~/.ansible, NEITHER of which is ansible/filter_plugins/. (B1-caught.)
filter_plugins     = filter_plugins
# Auto-trust host keys on first connect (TOFU). The control node reaches a known
# fleet on the trusted mgmt VLAN; this removes the manual `ssh-keyscan` step so
# the setup is fully hands-off. Tradeoff documented in SECURITY.md (accepted risk).
host_key_checking  = False
retry_files_enabled = False
# Built-in default callback with YAML-formatted results (ansible-core >=2.13). NOT the bare `yaml` alias: that
# resolved to community.general.yaml, which community.general REMOVED in 12.0 — `stdout_callback = yaml` then aborts
# every run "community.general.yaml has been removed". `default` + result_format is the version-proof equivalent.
stdout_callback    = default
result_format      = yaml
nocows             = True
interpreter_python = auto_silent
# Central run log (engineering-standards.md §3a). Captured with timestamps;
# tasks that touch secrets carry no_log:true so creds never reach this file.
log_path           = ./.ansible/ansible.log
# Vars plugins that decrypt SOPS at runtime (community.sops)
vars_plugins_enabled = host_group_vars,community.sops.sops

[inventory]
enable_plugins = yaml, ini, constructed

[ssh_connection]
pipelining = True
# Reuse SSH connections for speed across many small tasks
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

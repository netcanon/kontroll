---
# Ensure the LOCAL CANONICAL git — the instance's source of truth (Phase A of
# docs/local-source-of-truth.md). A bare repo on the control node that Semaphore
# reads instead of GitHub, so the running instance needs no remote git. The working
# tree gains a `local` remote pointing at it; the operator's own changes LAND here
# (offline, free; judged by the promote gate first — scripts/kontroll-land.py) so they
# are visible to Semaphore with zero GitHub dependency; the network service stages
# proposals here by push.
#
# Access chain used:   localhost (the control node itself)
# May break:           nothing on the lab — control-node git only
# Fallback required:   no
# Blast radius:        this VM only
# Idempotence:         re-runnable; init is `creates:`-guarded, remote add tolerated,
#                      the landing is a fast-forward compare-and-swap ("up to date" if already current);
#                      the sync before it changes the worktree only when a promote moved the canonical's
#                      `main` past it ("in step" otherwise) — it then rewrites the operator's checkout (the
#                      worktree's own commits are replayed on top, with new ids) and the run STOPS in that task, a
#                      failed run by design, so the next run lands (`kontroll-land.py --sync --stop-as`);
#                      the fleet check, the plaintext gate and the landing's `--check` in front of
#                      the commit and the landing are read-only. The ownership pass runs again AFTER the
#                      landing, on what the landing left (the service's, when root landed — rule 5; and git's
#                      read-only pack files either way), so the deploy that follows a landing reports 0 changed
#                      (measured in the gate image, 2026-10-20: tests/integration/test_local_canonical_as_root.py).

# The run's correlation id first, when this runs alone (the recovery paths: state-restore.sh, update.sh,
# update-from-bundle.sh). Under deploy-stack.yml, whose own stamp has run, this import says nothing (I-41).
- name: Stamp the run correlation id
  ansible.builtin.import_playbook: _log-run-id.yml

- name: Ensure the local canonical bare repo
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # Operator-owned (the working tree lands here) and runner-readable (Semaphore
    # clones it via the mount). NOT under the storage root (/var/lib/kontroll): that dir is
    # root's (deploy-stack.yml makes a missing one 0711; the installer's is Docker's 0755),
    # and its stores are the services' — the secret captures 1001's 0700. The operator's
    # canonical stays apart.
    bare: /srv/kontroll.git
    worktree: "{{ playbook_dir }}/../.."
    # MF-1 (compose-native installer — docs/reviews/2026-06-29-compose-native-install/99-synthesis.md): inside the
    # ephemeral installer container this play runs as root (user:0:0), so ansible_user_id is 'root' and a fact-derived
    # chown would make the canonical root-owned — breaking the (non-root) operator's own landings (`kontroll-land.py`;
    # the F-CANON bug, when they were pushes). The launcher passes the INVOKING host operator's identity in
    # KONTROLL_OPERATOR_{USER,UID,GID}; on a host-direct
    # run those env vars are absent ⇒ fall back to the gathered facts (the SAME value), so off-container is unchanged.
    operator: "{{ lookup('env', 'KONTROLL_OPERATOR_USER') or ansible_user_id }}"
    # Chowns use the NUMERIC uid, not the name: in-container the host operator is absent from /etc/passwd, so a
    # name owner can't resolve — a numeric uid is user-DB-independent and works on host + container alike.
    operator_uid: "{{ lookup('env', 'KONTROLL_OPERATOR_UID') or ansible_user_uid }}"
    # True only inside the installer container (the launcher sets KONTROLL_IN_CONTAINER=1). The NAMED gid-1001 group +
    # the operator's membership are HOST gestures (MF-6) — writing a container-local group that dies with the ephemeral
    # container is pointless; the canonical bytes still get gid 1001 via the numeric `group: "1001"` chown below.
    in_container: "{{ (lookup('env', 'KONTROLL_IN_CONTAINER') | default('', true)) | length > 0 }}"
    # The operator's primary gid — the launcher passes it beside the uid (scripts/kontroll.sh, kontroll-installer.sh);
    # the installer's entrypoint takes the uid for it when it is absent, and so does this.
    operator_gid: >-
      {{ lookup('env', 'KONTROLL_OPERATOR_GID') or (operator_uid if (in_container | bool) else ansible_user_gid) }}
    # T25: what writes the OPERATOR'S repository runs as the operator. Inside the installer container this play is
    # root, and root's git there left root's objects, index and ref files in the operator's worktree, which the
    # operator's own git cannot write over afterwards. So the state commit and the sync run through this prefix:
    # the operator's uid and gid, no supplementary group, no new privileges, and an environment of its own (no
    # HOME, so no root's config is read as someone who may not read it). Host-direct the play IS the operator.
    # In the container a run that is not root has no uid to give up: it is the operator (CI's fresh-node check runs
    # the installer's passes as the operator's account) and runs the same environment without setpriv, whose
    # --clear-groups needs CAP_SETGID even to its own ids (I-123); one that is neither is refused by the stop below.
    as_operator: >-
      {{ ((('setpriv --reuid=' ~ operator_uid ~ ' --regid=' ~ operator_gid ~ ' --clear-groups --no-new-privs -- ')
           if (ansible_user_uid | int) == 0 else '')
          ~ 'env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/nonexistent LC_ALL=C'
          ~ ' GIT_TERMINAL_PROMPT=0') if (in_container | bool) else '' }}
    # What git leaves in the worktree's git directory while an operation is in progress — the same names the sync
    # refuses on (scripts/kontroll/gitio.py `_SYNC_BUSY`; a unit test holds the two equal). Checked before the state
    # commit, which would otherwise commit onto a rebase's detached HEAD.
    sync_busy: [rebase-merge, rebase-apply, MERGE_HEAD, CHERRY_PICK_HEAD, REVERT_HEAD, BISECT_LOG, sequencer]

  tasks:
    # Q-6 of the canonical's doors: the canonical's hook and the seam tell the network service from everyone else by
    # ONE number, uid 1001. An operator whose login uid IS 1001 would be taken for the service — the landing below
    # would run as "the service", and this play's chown would hand the service the operator's grant. Say so first,
    # in a sentence, instead of failing later with a message about something else.
    - name: Refuse an operator whose uid is the service's (1001) — the canonical cannot tell the two apart
      ansible.builtin.assert:
        that: operator_uid | string != "1001"
        fail_msg: >-
          local-canonical: the operator ({{ operator }}) has uid 1001, which is the uid the network service runs as
          and the canonical's grant and hook are keyed on. The canonical cannot tell such an operator from the
          service, so this play refuses to make a canonical for them (docs/troubleshooting.md section 10). Deploy as
          an account with another uid (KONTROLL_OPERATOR_UID on a launcher run). Nothing was changed.
        quiet: true

    # Before anything of the worktree runs (the audit, the fleet check, the plaintext gate, the landing's
    # judgement): a sync that brought the worktree forward — by hand, or in a run killed before it stopped — and
    # that no run has stopped on since stops this one, saying what came in (tasks/stop-after-sync.yml; SECURITY.md
    # C10). This play's own sync, below, stops its run itself.
    - name: Stop when a sync brought the worktree forward and no run has stopped on it since
      ansible.builtin.import_tasks: tasks/stop-after-sync.yml
      vars:
        stop_play: local-canonical

    - name: List a rebase, merge, cherry-pick, revert or bisect in progress in the worktree (names only)
      # The state commit below commits onto HEAD, whatever HEAD is. A replay a deploy could not finish (killed, or
      # out of time) leaves a rebase in progress and HEAD detached, and so does a rebase or a merge the operator
      # started: the state commit would then land the instance state on that detached HEAD, and the abort the
      # sync's refusal names (`git rebase --abort`) would take it away again. So this asks first — the names the
      # sync refuses on (`sync_busy`), each in the worktree's own git directory (asked of git as the operator) and
      # by its name there, a link too, as the sync reads them (`--git-path` would name a link's target) — and the
      # refusal below stops before anything is committed. Read-only, so it runs under --check too. It runs first,
      # right after the stop: a checkout cut short leaves the worktree's scripts half main's, and the audit, the
      # fleet check and the plaintext guard below run them as root (read A-f6, N2). With none of them, a HEAD on no
      # branch is listed (`<git dir>/HEAD`): a replay quit part-way (`git rebase --quit`) leaves HEAD detached on
      # main, and the state commit would land the half-replayed pick of the operator's own commit and leave the rest
      # undeployed (read A-f9, N3), and so is a HEAD that names a ref outside `refs/heads/` (a hand-made
      # `git symbolic-ref HEAD refs/remotes/local/main`: the sync fetches into it, and the next state commit records
      # the promote's revert as instance state: read A-f11, N5). A branch with no commit yet is a branch, and is not
      # listed (read B-f11, N5). Every road the tree installs or updates by keeps a branch checked out.
      ansible.builtin.shell: |
        set -e
        cd {{ worktree | quote }}
        dir=$({{ as_operator }} git rev-parse --path-format=absolute --git-dir)
        found=
        for n in {% for n in sync_busy %}{{ n | quote }} {% endfor %}; do
          if [ -e "$dir/$n" ] || [ -L "$dir/$n" ]; then echo "$dir/$n"; found=1; fi
        done
        [ -n "$found" ] || case $({{ as_operator }} git symbolic-ref -q HEAD) in
          refs/heads/*) ;; *) echo "$dir/HEAD";; esac
      args:
        executable: /bin/bash
      register: _wt_busy
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to commit or land while git has an operation in progress in the worktree, and say which
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to commit or land —

          {% if _wt_busy.rc == 0 and _wt_busy.stdout_lines | select('search', '/HEAD$') | list %}HEAD is on no branch in
          {{ worktree }}, and no operation is in progress: a replay quit part-way (`git rebase --quit`) leaves it so,
          and the state commit would land on it; or HEAD names a ref that is not a branch (`git -C {{ worktree | quote
          }} symbolic-ref HEAD` says which; `git branch` then fails, `--points-at` too, until you switch; `git -C
          {{ worktree | quote }} for-each-ref --format='%(refname:lstrip=2)' refs/heads/` lists your branches). Switch
          back to your branch — after a replay quit part-way, `git -C {{ worktree | quote }} branch --points-at
          ORIG_HEAD` names the branch the sync started on (unless a reset, stash, merge, pull, rebase or `git am` of
          your own, or a commit on that branch, came since); after a switch or detach of your own, `git -C {{ worktree |
          quote }} reflog` names it (`checkout: moving from <branch>`, above its newest `rebase (start)`: one below it
          is older than the sync), and where the two differ the reflog's is yours; `git -C {{ worktree | quote }}
          branch` lists yours. If git says a file is in the way — untracked, or tracked with local changes — it is the
          cut replay's copy of your own commit's (in the bash commands below, each `'<path>'` is its name as git lists
          it, a `'` in it written `'\''`): compare it with your branch's (`git -C {{ worktree | quote }} cat-file
          --filters refs/heads/<branch>:'<path>' | cmp - {{ worktree | quote }}/'<path>'`; for a link, its text, in
          bash: `git -C {{ worktree | quote }} cat-file -p refs/heads/<branch>:'<path>' | cmp - <(readlink -nv -- {{
          worktree | quote }}/'<path>') && test -L {{ worktree | quote }}/'<path>'`); where it is the same, remove it
          (untracked) or put HEAD's back (`git -C {{
          worktree | quote }} --literal-pathspecs checkout HEAD -- '<path>'`); where it differs, move it out of the
          worktree, to a directory of its own (`mkdir -p ~/kontroll-moved && mv --backup=numbered -- {{ worktree |
          quote }}/'<path>' ~/kontroll-moved/`), and look; then switch (`git -C {{ worktree | quote }} switch --no-guess
          <branch>`) — then run again: the next run brings your commit forward again.
          {%- elif _wt_busy.rc == 0 %}git has an operation in progress in {{ worktree }}
          ({{ _wt_busy.stdout_lines | join(', ') }}). Finish it or abort it — `git -C {{ worktree | quote }} status`
          says which and how; `git bisect reset` ends a bisect — then run again.{% if _wt_busy.stdout_lines
          | select('search', '/rebase-(merge|apply)$') | list %} If it is a sync's replay cut short (a run killed in
          it), `git -C {{ worktree | quote }} rebase --abort` puts HEAD back where it was before the replay (if git
          says {{ ((_wt_busy.stdout_lines | first | dirname) ~ '/index.lock') | quote }} exists and no git is running,
          remove that file first; move aside any untracked file the abort names); then `git -C {{ worktree | quote }}
          -c core.ignoreCase=false status --untracked-files=all --ignored` names, among your own, any file of main's
          the replay left: remove those before running again.
          `git -C {{ worktree | quote }} -c core.quotePath=true ls-files -v | grep -v '^H '` (this and the commands
          after it are bash's: `$'…'` and `<(…)`) names any tracked file git's status does not compare (skip-worktree,
          assume-unchanged; under `core.ignoreStat`, every file; a name the listing prints in double quotes is quoted
          the C way: give it to the shell as `$'…'`, with what is between the quotes, each `'` in it written `\'`): the
          replay may have left main's bytes in one, and that status does not see them. Compare each with main's (`git -C
          {{ worktree | quote }} cat-file --filters refs/remotes/local/main:<path> | cmp - {{ worktree | quote
          }}/<path>`; for a link, whose target `cmp` would read, its text: `git -C {{ worktree | quote }} cat-file -p
          refs/remotes/local/main:<path> | cmp - <(readlink -nv -- {{ worktree | quote }}/<path>)`); where one holds
          main's bytes or is missing, put HEAD's back (`git -C {{ worktree | quote }} checkout
          --ignore-skip-worktree-bits HEAD -- <path>`). `git rebase --continue` can drop the commit it was replaying.
          {%- endif %}{% else %}git could not say whether an
          operation is in progress in {{ worktree }}
          ({{ _wt_busy.stderr_lines | default([]) | last | default('nothing was printed', true) }}).{% endif %}
          This run committed and landed nothing, and changed nothing in the worktree.
      when: _wt_busy.rc != 0 or (_wt_busy.stdout_lines | default([]) | length > 0)

    # F-CANON (#119): the canonical is group-1001 (the runtime uid:gid the privileged API/runner writes as), but a
    # FRESH control node has no NAMED group at gid 1001 AND the operator is not a member of it — so the operator's
    # landing below (run as the operator, no become) hits "Permission denied" the moment any canonical object
    # is group-1001-owned but not operator-owned. Create the group + add the operator here, BEFORE the canonical is
    # touched. (Old `.10` never hit this — it ran no onboard-gui that staged gid-1001 objects.) Both tasks are
    # idempotent. The owner-side half lands on the recursive grant below.
    # MF-6: these two are HOST gestures — skipped in-container (a container-local group/membership dies with the
    # ephemeral installer and the operator name isn't even in the container's /etc/passwd). On the host they run as
    # before; in-container the operator does `groupadd -g 1001 kontroll && usermod -aG kontroll $USER` once by hand.
    - name: Ensure the gid-1001 group exists (the canonical's group = the runtime uid:gid)
      become: true
      ansible.builtin.group:
        name: kontroll
        gid: "1001"
        state: present
      when: not in_container

    - name: Add the operator to the gid-1001 group (so its landings — `kontroll-land.py` — can write the canonical)
      become: true
      ansible.builtin.user:
        name: "{{ operator }}"
        groups: kontroll
        append: true            # supplementary only — never touches the operator's primary group
      when: not in_container
      # A newly-added supplementary group is NOT effective in the operator's CURRENT login session, so on the very
      # first run the landing can't rely on group membership yet. The recursive grant below makes the canonical
      # OPERATOR-OWNED, so that landing succeeds via OWNER perms regardless; this membership is the runtime/future
      # half (effective on the operator's next login).

    # ── THE AUDIT COMES FIRST: before this play writes anything into a canonical that is already there ──────────
    # The tasks below put a canonical right — they write `HEAD`, set the play's config keys again, install the
    # `update` hook, make `hooks/` root's. An audit behind them would never name one of those: it would read the
    # canonical as this play had just left it. Here it reads the canonical as it has been since the last deploy.
    # The price is a line that is nobody's doing: an update that ships a newer hook, or sets a key this play did
    # not set before, names that hook or key once — in the run that puts it right (docs/troubleshooting.md).
    # A link at the path is followed: the canonical is the directory it names, as the real run's `file` and `git
    # init` below take it (and the audit and the landing, which open the path). Looked at without following, a
    # link read as no directory, so it was never listed: a link to an empty directory was judged as a repository
    # and its dry run refused ("the canonical could not be read") while its real run landed (I-40). A link to
    # nothing is then no path at all, as the real run takes it: `file` makes the directory it names.
    - name: Is there a canonical already — so that it is audited BEFORE this play writes into it
      ansible.builtin.stat:
        path: "{{ bare }}"
        follow: true            # a link there is the directory it names (above)
        get_checksum: false     # one look at the path, and nothing started on it
        get_mime: false
        get_attributes: false
      register: _canonical_before

    # An EMPTY directory there is no canonical. The installer's compose service binds /srv/kontroll.git, and Docker
    # makes a bind source that is missing an empty root-owned directory, so after `fresh-init` every fresh node has
    # one before this play first runs. Taken for a canonical, it was audited (three lines that are nobody's doing)
    # and, under --check, the landing was judged against it, which cannot read a repository that is not one: the
    # mandated dry-run of every first install through the installer failed (measured 2026-11-07 on a GitHub-hosted
    # runner, the quickstart run as written). deploy-stack.yml's fresh-node preview probes HEAD for the same reason.
    # One listing of the path's top level answers in a word: `empty`; `repo`, with `HEAD` among the entries;
    # `headless`, a repository whose HEAD is gone (`objects` or `refs`, and no `HEAD`); `entries`, anything else (a
    # filesystem mounted at the path holds `lost+found`). Anything in the directory at all, and it is a canonical to
    # audit; and so is one this account could not list (the listing fails and says no word): the audit then says
    # what it could not read, where counting it as none would say nothing at all. Under --check the landing is
    # judged against `repo`, against no word and against a path that is no directory; not against `headless` or
    # `entries`, which the judgement cannot read as a repository: the real run makes the canonical there (or
    # restores its HEAD) and judges then. The listing prints a word and never a name. `find` returned every name,
    # and one that is not UTF-8 (the gid-1001 writer the audit watches can make one) failed its result on both
    # cores before the audit could name it (I-19's read A). It runs on the interpreter Ansible runs on, and it only
    # reads, so it runs under --check too.
    - name: List that path's top level in one word (Docker leaves an empty directory for a missing bind source)
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "-B"
          - "-c"
          - >-
            import os, sys; n = set(os.listdir(sys.argv[1])); print('empty' if not n else 'repo' if 'HEAD' in n
            else 'headless' if n & {'objects', 'refs'} else 'entries')
          - "{{ bare }}"
      register: _canonical_listing
      changed_when: false
      failed_when: false
      check_mode: false
      when: _canonical_before.stat.isdir | default(false)

    - name: Decide whether there is a canonical (not an empty directory), and a repository (HEAD among its entries)
      ansible.builtin.set_fact:
        _canonical_present: >-
          {{ _canonical_before.stat.exists and (_canonical_listing.stdout | default('') | trim) != 'empty' }}
        _canonical_repo: >-
          {{ _canonical_before.stat.exists
          and (_canonical_listing.stdout | default('') | trim) not in ['empty', 'headless', 'entries'] }}

    - name: Audit the canonical — name what is in it that this play did not put there (C10; it reports, it never stops)
      # Read-only, and it reads the repository AS FILES: it lists directories and reads `HEAD`, the ref files,
      # `packed-refs` and `hooks/update` itself, and the one process it starts (git, for the keys of the config) is
      # handed the config file's bytes and never the repository. A kind and a key per line, never a value — so
      # no_log is not needed, and would hide the one thing an operator has to read. A canonical that holds only
      # what this play and the tool write prints nothing. It runs under --check too (the mandated dry-run shows
      # the same report first) and it never fails the play: whether a finding should ever stop a deploy is not
      # decided. A first run has nothing to audit: the canonical is this play's own a moment later.
      # Exit 0 is a report. Any other status is NOT one — the path is no directory, the script could not be
      # started, it ended on an error of its own — and the last of these tasks says that in a sentence: an empty
      # list would read as "nothing found".
      ansible.builtin.command:
        cmd: python3 -B scripts/kontroll-canonical.py --audit {{ bare }}
        chdir: "{{ worktree }}"
      register: _canonical_audit
      changed_when: false
      failed_when: false
      check_mode: false
      when: _canonical_present

    - name: Show what the audit named (nothing was changed — docs/troubleshooting.md, "the audit of the canonical")
      ansible.builtin.debug:
        msg: "{{ _canonical_audit.stdout_lines | default([]) }}"
      when: _canonical_audit.stdout_lines | default([]) | length > 0

    - name: Say that the audit gave NO REPORT of the canonical — nothing listed is then not "nothing found"
      vars:
        _audit_no_report: >-
          local-canonical: the audit gave NO REPORT of {{ bare }} (exit status
          {{ _canonical_audit.rc | default('none', true) }}) — nothing listed does not mean the canonical is clean,
          and the deploy goes on. Run `python3 -B scripts/kontroll-canonical.py --audit {{ bare }}` in
          {{ worktree }}; docs/troubleshooting.md, "the audit of the canonical".
      ansible.builtin.debug:
        msg: >-
          {{ [_audit_no_report]
          + (_canonical_audit.stderr_lines | default([]))
          + ([] if (_canonical_audit.rc | default(none)) is number
          else ([_canonical_audit.msg | default('')] | select | list)) }}
      when: _canonical_present and (_canonical_audit.rc | default(-1)) != 0

    - name: Create the bare-repo dir (operator-owned; group-writable for the privileged API — C10)
      become: true
      ansible.builtin.file:
        path: "{{ bare }}"
        state: directory
        owner: "{{ operator_uid }}"       # the operator's working tree lands here (numeric — MF-1, user-DB-free)
        group: "1001"                     # the runtime uid (the privileged API/runner) — the C10 write grant
        mode: "2775"                      # setgid: pushed objects inherit gid 1001 so BOTH writers keep access;
                                          # others still clone (content is SOPS-encrypted). Group-write is the
                                          # C10 grant; receive.deny* below bounds it (no history rewrite).

    # The git module covers clone/checkout, not init-bare / remote-add / push — these
    # are raw git by necessity, hence the command-instead-of-module suppressions.
    - name: Initialize the bare repo if absent  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git init --bare {{ bare }}"
        creates: "{{ bare }}/HEAD"

    - name: Point the bare repo's HEAD at main (so a fresh clone checks out main)
      ansible.builtin.copy:
        dest: "{{ bare }}/HEAD"
        content: "ref: refs/heads/main\n"
        mode: "0664"            # group-writable, consistent with the C10 gid-1001 grant below — a 0644 here
                                #  would oscillate with the recursive `chmod g+w` (each run re-fighting HEAD)

    - name: Read which of the play's config keys the canonical holds already  # noqa: command-instead-of-module
      # `--file`: the config file read BY ITS PATH — no repository is opened, so nothing in the canonical decides
      # what this runs, and a canonical another uid owns needs no `safe.directory` for it. (Not quite the audit's
      # read, which hands git the file's BYTES on stdin: here a `config` that is a symbolic link is read through
      # the link — the audit names such a link, `link`, before this task runs.) `--no-includes`: an `[include]`
      # directive in the file names another file to read; git does not follow one under `--file` by default
      # (measured), and this says so where the default could change. rc 1 and no line for a key that is absent
      # (a fresh canonical: the file is not there yet under --check, which is the same answer); rc 128 and no line
      # for a file that is not config syntax; never a failure. The values it prints are the play's own five, never
      # a secret. Its loop and the harden task's below are THE SAME LIST IN THE SAME ORDER: the harden reads this
      # task's result by index (tests/unit/test_local_canonical.py holds the two equal).
      ansible.builtin.command:
        cmd: "git config --no-includes --file {{ bare }}/config --get-all {{ item.key }}"
      loop:
        - {key: receive.denyNonFastForwards, value: "true"}
        - {key: receive.denyDeletes, value: "true"}
        - {key: core.sharedRepository, value: "group"}
        - {key: gc.writeCommitGraph, value: "false"}
        - {key: repack.updateServerInfo, value: "false"}
      register: _canonical_config
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Harden the bare repo — deny non-FF/deletes; group-share new objects  # noqa: command-instead-of-module
      # receive.deny*: no force-push / history rewrite on the canonical, from ANY writer (the staging API —
      # which can only push a proposed/<run_id> ref anyway — the runner, or an accidental operator `-f`).
      # Defence-in-depth with the propose-then-promote posture; protects the operator's own pushes too.
      # core.sharedRepository=group: git itself makes NEW refs/objects group-writable + setgid, so a gid-1001
      # actor (the privileged API pushing a proposal; the Semaphore `promote-proposal` task fast-forwarding main
      # + deleting the proposal) can write them WITHOUT host root — the runtime complement to the recursive grant
      # below, which only fixes EXISTING objects.
      # gc.writeCommitGraph=false, repack.updateServerInfo=false: what git's own garbage collection would otherwise
      # leave in the canonical BY ITSELF (a push starts a collection once enough has gathered) — `info/refs` and
      # `objects/info/commit-graph`. Nothing here needs either: the tool's own git reads no commit-graph, and
      # nothing serves the canonical over the dumb protocol. With them off, a file of that name is somebody's, and
      # the audit above names it like any other entry there.
      # --replace-all: a key that is in the file TWICE is one git will not set with a single value (exit 5), so one
      # more line in `config` stopped every deploy at this task. Replaced, the key is there once, with this value —
      # and the audit above has named it (`config-value`) before this task put it right.
      # SET ONLY WHAT IS NOT SO ALREADY. `git config --replace-all` rewrites the file through a lock and a rename
      # even when the value is the one it holds (measured: a new inode each time), and this task runs as root in
      # the installer — so every real apply left `config` root's, and the ownership pass below re-owned it to the
      # operator and reported `changed`, on every run. The read above (`--file`, the audit's way: the file by its
      # path, no repository opened) says which keys hold exactly the one value asked; only the others are
      # written — a first run, a key that is missing, turned, or there twice. A second apply writes nothing,
      # `config` keeps its owner, and the pass has nothing to do: 0 changed. SECURITY.md C10 /
      # docs/privileged-mutation-enablement.md.
      ansible.builtin.command:
        cmd: "git -C {{ bare }} config --replace-all {{ item.key }} {{ item.value }}"
      loop:
        - {key: receive.denyNonFastForwards, value: "true"}
        - {key: receive.denyDeletes, value: "true"}
        - {key: core.sharedRepository, value: "group"}
        - {key: gc.writeCommitGraph, value: "false"}
        - {key: repack.updateServerInfo, value: "false"}
      loop_control:
        index_var: _key_index
      # the read registers one result per key, in this loop's order; a key that is absent reads as no line (rc 1),
      # one there twice as two lines — neither is the one value, so it is written
      when: (_canonical_config.results[_key_index].stdout_lines | default([])) != [item.value]
      changed_when: true

    - name: Install the C10 update-hook — an allow-list of what a push may do to the canonical (defence-in-depth)
      become: true
      # Belt-and-braces with gitio.commit_and_push's `and not staging` guard (the code boundary): what a PUSH may do
      # to the canonical is decided HERE, by the canonical itself, and it is an allow-list. As uid 1001 (the network
      # service): create refs/heads/proposed/<run id>, and nothing else — not main, not a tag, not refs/replace/*,
      # not a second push to a proposal that exists. As any other uid: a proposal (create or move), and nothing
      # else. refs/heads/main is refused from EVERYONE — nothing legitimate pushes it: the landing below
      # (scripts/kontroll-land.py) and the promote are ref transactions, not pushes (C2), so the hook is not what
      # bounds them. A delete is refused from everyone. The hook body is the committed
      # files/canonical-update-hook.sh (one source of truth
      # the tests read too — no twin drift). Idempotent (fixed file). Runs in BOTH container + host modes (a
      # canonical-config gesture, not a host gesture — no KONTROLL_IN_CONTAINER skip). Closes the dogfood VM-144
      # breach's push half. SECURITY.md C10 / docs/privileged-mutation-enablement.md.
      ansible.builtin.copy:
        src: files/canonical-update-hook.sh
        dest: "{{ bare }}/hooks/update"
        mode: "0755"

    # The top-dir grant (above) + setgid cover a FRESH canonical (objects inherit gid 1001); an EXISTING
    # canonical created before the grant has objects still on the operator's primary group / not group-writable /
    # owned by a different actor (e.g. uid-1001 staged a proposal), so the operator's landing can't write near them.
    # Fix the existing objects — the one-time manual `chown -R <operator>:1001 + chmod -R g+w + find -type d
    # setgid` step (F-CANON, #119), now an idempotent detect-then-apply pair: THE OWNERSHIP PASS of
    # scripts/kontroll-canonical.py (`--normalise`), which under `--check` names what it would change and,
    # applied, changes exactly that. owner=<operator> is the F-CANON half: operator-owned objects let the
    # operator's landing succeed via OWNER perms even before the group membership added above takes effect
    # (next login). SECURITY.md C10 / docs/install-from-scratch.md §3.
    #
    # The pass walks the repository the way the audit above reads it (one walker, `_walk`): each directory is
    # opened from its parent's descriptor and never through a link, each entry is opened from the directory it
    # was listed in, and the owner and the mode are changed THROUGH THAT DESCRIPTOR (fchown/fchmod) — on the
    # regular file or directory that was opened, inside the repository, whatever its name is exchanged for
    # meanwhile. A symbolic link is named (`link`) and left as it is, its own owner too, and nothing it points at
    # is looked at; a pipe, a socket, a device is named (`not-a-file`) and never opened. The canonical is mounted
    # :rw into the uid-1001 service when api_privileged (and, on the permissive edition, into the auto-promoter):
    # every name in it is that writer's to choose, and the pass changes no entry but the ones it opened there.
    #
    # hooks/ is PASSED OVER by the pass and re-owned by root at the end. With a group-writable hooks/ that writer
    # could plant a `reference-transaction` or `update` hook, and the next `sudo kontroll-promote` would run it as
    # ROOT (2026-10-08 review, finding 2). Every git actor only needs to READ hooks (receive-pack as uid 1001
    # executes hooks/update), so root:root 0755 is the whole grant.
    - name: Detect canonical entries outside hooks/ not operator:1001, or missing group-write or setgid (names only)
      become: true
      # `--check` prints what the pass would change — a kind and a path, bounded per kind, never a file's content —
      # and changes nothing: exit 3 when there is something, 0 when there is nothing, 1 when a part could not be
      # gone over (the lines say which part), 2 when it could not start. Read-only, so it runs under --check too
      # (`check_mode: false`) when there is a canonical to look at: the mandated dry-run prints the names the real
      # run then changes. become, because
      # an entry nobody else may open is still one the pass has to look at. -B: no __pycache__ in the checkout.
      ansible.builtin.command:
        cmd: >-
          python3 -B scripts/kontroll-canonical.py --normalise {{ bare }}
          --owner {{ operator_uid }} --group 1001 --check
        chdir: "{{ worktree }}"
      register: _normalise_needed
      changed_when: false
      failed_when: _normalise_needed.rc not in [0, 3]
      check_mode: false
      # Under the dry-run of a node that has no canonical yet there is nothing to look at (the `file` and `git
      # init` tasks above were only simulated), so the detect is skipped, and so is the apply: no path, or an empty
      # directory. A path that holds entries is gone over, a repository or not: the real run re-owns them (the
      # root-owned `0700 lost+found` of a filesystem mounted there becomes the operator's, group-writable), and the
      # dry run names them first (I-19's read A).
      when: _canonical_present or not ansible_check_mode

    - name: Show what the ownership pass names (what it would change; a link or a pipe it leaves as it is)
      ansible.builtin.debug:
        msg: "{{ _normalise_needed.stdout_lines | default([]) }}"
      when: _normalise_needed.stdout_lines | default([]) | length > 0

    - name: Make existing canonical entries operator:1001, group-writable, dirs setgid — hooks/ passed over (F-CANON)
      become: true
      # The same pass, applied: exit 0 says every entry it named is now as asked; any other status fails the play,
      # with the lines that say which entry was not gone over or not changed. Skipped when the detect task found
      # nothing (a second apply reports 0 changed) and in check mode (a command that writes).
      ansible.builtin.command:
        cmd: >-
          python3 -B scripts/kontroll-canonical.py --normalise {{ bare }}
          --owner {{ operator_uid }} --group 1001
        chdir: "{{ worktree }}"
      register: _normalised
      when: (_normalise_needed.rc | default(0)) == 3
      changed_when: true

    - name: Keep hooks/ root-owned and read-only to everyone else — a gid-1001 writer must never plant a hook (C10)
      become: true
      ansible.builtin.file:
        path: "{{ bare }}/hooks"
        state: directory
        owner: root
        group: root
        mode: "0755"
        recurse: true

    - name: Ensure the working tree has a 'local' remote  # noqa: command-instead-of-module
      # As the operator (`as_operator`): git rewrites `.git/config` through a lock file, so root's `remote add` left
      # a root-owned config in the operator's repository — which the check before the state commit then names.
      ansible.builtin.command:
        cmd: "{{ as_operator }} git remote add local {{ bare }}"
        chdir: "{{ worktree }}"
      register: _remote
      changed_when: _remote.rc == 0
      failed_when: _remote.rc != 0 and 'already exists' not in _remote.stderr

    - name: Check the fleet list before it is committed and landed (scripts/gen-requirements.py --fleet-check)
      # The commit below takes the operator's worktree as it is. A fleet line that is not a device-class key would be
      # committed — and the landing after it would then be REFUSED by the promote gate (which judges the whole tree),
      # leaving the canonical behind the checkout. This asks one rule (kontroll.paths) before the commit, so the
      # refusal comes before anything is committed and names the entry's place. Read-only: it runs under --check too,
      # so the mandated dry-run names it before the real run does. (The landing's own `--check` below judges the
      # rest of what the gate judges: a collection pin conflict, a signature policy, a link in the tree.)
      ansible.builtin.command:
        cmd: python3 -B scripts/gen-requirements.py --fleet-check   # -B: a read leaves no __pycache__ behind
        chdir: "{{ worktree }}"
      register: _fleet_check_canonical
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to mirror a fleet the promote gate would refuse, and say which entry
      # ANY non-zero status refuses, as for the plaintext guard below: a check that could not run checked nothing —
      # and then the message says that, not "correct the fleet".
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to commit —
          {{ _fleet_check_canonical.stderr_lines | default([]) | last
          | default('the fleet check printed nothing.', true) }}
          This play staged, committed and landed nothing: no ref of the canonical moved.
          {{ 'Correct instance/fleet.yml in'
          if 'gen-requirements: instance/fleet.yml' in (_fleet_check_canonical.stderr | default(''))
          else 'Nothing was checked: make `python3 scripts/gen-requirements.py --fleet-check` run in' }}
          {{ worktree }} and run again.
      when: _fleet_check_canonical.rc != 0

    - name: List anything the commit below would take in plaintext (names only, never content)
      # The commit below is a BLANKET add of the operator's worktree; this is its content gate
      # (scripts/lib/plaintext-guard.sh — a secret file that is not fully sops-encrypted, a stray file in a secrets
      # directory, a private key). Read-only: it lists what WOULD be staged and reads those files, so it runs under
      # --check as well and the mandated dry-run names the offender before the real run does. Its output is file
      # names, a rule and line numbers — never a value — so no_log is not needed, and would hide the one thing the
      # operator has to read.
      ansible.builtin.command:
        argv:
          - sh
          - "{{ worktree }}/scripts/lib/plaintext-guard.sh"
          - "{{ worktree }}"
      register: _plaintext_guard
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to commit plaintext into the canonical, and say which file
      # ANY non-zero status refuses, not only the guard's "found something" code: a guard that is missing or
      # could not run has checked nothing.
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to commit —
          {{ (_plaintext_guard.stderr_lines | default([]) | join('; ')) or 'the plaintext guard could not run' }}.
          This run staged, committed and landed nothing.
          {{ 'Move the named file out of the repository, or see' if 'REFUSED' in (_plaintext_guard.stderr | default(''))
          else 'Nothing was checked: see' }}
          docs/install-from-scratch.md ("REFUSING to commit") for the fix that fits.
          {{ 'A file with no sops block is encrypted with `sops --config instance/.sops.yaml -e -i <file>`.'
          if 'no sops block' in (_plaintext_guard.stderr | default('')) else '' }}
      when: _plaintext_guard.rc != 0

    - name: List what in the worktree's git directory is not the operator's (names only; nothing is changed)
      # The state commit and the sync below write the operator's repository AS THE OPERATOR (`as_operator`). Before
      # that, the state commit ran as root inside the installer container and left root's objects, index and ref
      # files in it — which the operator's git cannot write over, so the commit or the replay would stop half-way.
      # The directory walked is git's own answer (`--git-common-dir`, asked as the operator): in a linked worktree
      # `.git` is a file, and the objects and refs are in the common directory. Read-only, so it runs under --check
      # too and the mandated dry-run names them first. Nothing is re-owned here: a recursive change of owner in a
      # tree another uid writes is not this play's to make.
      ansible.builtin.shell: |
        set -e
        common=$({{ as_operator }} git -C {{ worktree | quote }} rev-parse --path-format=absolute --git-common-dir)
        echo "$common"
        find "$common" ! -user {{ operator_uid | quote }} -print
      args:
        executable: /bin/bash
      register: _wt_not_operator
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to commit or land while the operator's git cannot write its own repository, and say what
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to commit or land —

          {% if _wt_not_operator.stdout_lines | default([]) | length > 1 %}{{ _wt_not_operator.stdout_lines | first }}
          holds what is not the operator's (uid {{ operator_uid }}), among it:
          {{ _wt_not_operator.stdout_lines[1:21] | join(', ') }}. An earlier deploy ran inside the installer
          container as root (its `remote add`, or its state commit) and left those; the state commit and the sync
          now run as the operator, whose git cannot write over them. Once, by hand: `sudo chown -R
          {{ operator_uid }}:{{ operator_gid }} {{ _wt_not_operator.stdout_lines | first | quote }}`, then run
          again.{% else %}git could not name the git directory of {{ worktree }}, or it could not be listed
          ({{ _wt_not_operator.stderr_lines | default([]) | last | default('nothing was printed', true) }}).{% endif %}
          Nothing in the worktree was changed.
      when: _wt_not_operator.rc != 0 or (_wt_not_operator.stdout_lines | default([]) | length > 1)

    - name: Commit uncommitted instance state into the canonical  # noqa: command-instead-of-module
      # kontroll-init --fresh scaffolds instance/ AFTER install.sh's initial commit, so on a fresh node the
      # overlay (inventory, fleet, .sops.yaml, ENCRYPTED secrets) is untracked — the landing below takes HEAD,
      # which would omit it, leaving Semaphore's canonical clone without any instance config. Commit it here (the
      # operator needs no git knowledge — local-source-of-truth goal). "Everything committed is ciphertext or
      # public" is CHECKED by the plaintext guard above, not asserted. Idempotent: a no-op when the tree is already
      # clean.
      # As the operator (`as_operator`): the commit is the operator's repository's, and so are its objects.
      ansible.builtin.shell: |
        set -e
        cd {{ worktree }}
        if [ -n "$({{ as_operator }} git status --porcelain)" ]; then
          {{ as_operator }} git add -A
          {{ as_operator }} git -c user.name=kontroll -c user.email=kontroll@localhost \
              commit -q -m "kontroll: instance state {{ ansible_date_time.iso8601 }}"
          echo committed
        fi
      args:
        executable: /bin/bash
      register: _state_commit
      changed_when: "'committed' in _state_commit.stdout"

    # THE SYNC (T25). A promote moves the canonical's `main` to a commit this worktree has never seen, and the
    # landing below then refuses (not a fast-forward) until the worktree holds that commit and descends from it.
    # So, first, `kontroll-land.py --sync` brings the worktree forward, AS THE OPERATOR (`as_operator`; it writes
    # the operator's repository): the canonical packs what the worktree lacks, in the seam (none of its hooks or
    # config-named programs run, and no serving side — no fetch), the worktree reads the pack, and its own commits
    # since — this run's instance-state commit among them — are replayed on top (`git rebase`). Under --check the
    # first task says whether there is anything to bring forward (exit 3) and changes nothing; the second does it,
    # on a real run only (a command task is skipped under --check), and is "changed" when it brought the worktree
    # forward. A sync that is refused — a conflict, a merge in the worktree's own history or a commit already on
    # another remote, files changed and not committed — fails the sync task itself, said as this play's (exit 1).
    # A sync that brought the worktree forward stops the run IN THE SAME TASK (`--stop-as local-canonical`): the
    # tree the worktree now holds is what this deploy would go on to run as root (the landing's gate, the ownership
    # pass, every generator and the stack), and the dry-run before this run previewed the tree before it. The sync
    # leaves a mark in the worktree's git directory; kontroll-land then says what came in, in plain git as the
    # operator, removes the mark and exits 4, which fails the task — the run's last step, so the next run goes on.
    # Not a later task: an Ansible worker forked after the sync can import the filter plugins on disk — the tree that
    # came in — when it first templates, as root, before any later task could stop the run (read A-f3, B1). The
    # next run's sync is in step, so its dry-run previews the tree its real run applies — and runs that tree's own
    # playbooks and scripts, which is why what came in is said first (SECURITY.md C10). A sync by hand leaves the
    # same mark, and the stop at the top of this play (and of bootstrap.yml and deploy-stack.yml) stops the next
    # run on it — but that run's playbooks, and its filter plugins, are the tree that came in already.
    - name: Say whether the canonical's main has moved past the worktree (a promote) — nothing is changed
      ansible.builtin.command:
        cmd: >-
          {{ as_operator }} python3 -B scripts/kontroll-land.py --sync --check
          --worktree {{ worktree }} --repo {{ bare }}
        chdir: "{{ worktree }}"
      register: _sync_check
      changed_when: false
      failed_when: false
      check_mode: false
      # A repository to sync from (the landing's own condition below): a dry-run of a canonical directory that is
      # empty, or holds no HEAD, has nothing to bring forward, and its sync would only say so as a refusal.
      when: ansible_check_mode and _canonical_repo

    - name: Bring the worktree forward to the canonical's main, as the operator (a promote's commits, then its own)
      ansible.builtin.command:
        cmd: >-
          {{ as_operator }} python3 -B scripts/kontroll-land.py --sync --stop-as local-canonical
          --worktree {{ worktree }} --repo {{ bare }}
        chdir: "{{ worktree }}"
      register: _sync
      # Exit 4: brought forward, what came in said and the mark removed; exit 1: refused (a mark that could not be
      # written too — before the replay, HEAD as it was). Either fails THIS task, and the run ends with it.
      changed_when: _sync.rc == 4
      failed_when: _sync.rc != 0

    # Under --check only: the real run's sync is skipped there (a command task), and says its own refusal.
    - name: Refuse to land when the worktree cannot be brought forward — and say why
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to land — the sync of the worktree to the canonical's main (--check) exited
          {{ _sync_check.rc | default('none') }}:

          {{ ((_sync_check.stdout_lines | default([])) + (_sync_check.stderr_lines | default([])))
          | select | map('regex_replace', '(?<![.])$', '.') | join(' ')
          | default('kontroll-land printed nothing.', true) }}
          Nothing was changed: the canonical and the worktree are as they were. Do what the sentence says in
          {{ worktree }}, then run again.
      # `default(0)`: a skipped task registers no `rc`; under --check exit 3 is "there is something to bring forward"
      when: (_sync_check.rc | default(0)) not in [0, 3]

    - name: Say that the dry-run judges the landing after the sync, which only the real run makes
      ansible.builtin.debug:
        msg: >-
          local-canonical: the canonical's main has commit(s) the worktree does not (a promote; in a shallow clone,
          possibly history below where the clone stops, which the real run refuses with `fetch --unshallow`, as the line
          below says). The real run brings them in, as the operator, replays the worktree's own commits on top, says
          what came in and STOPS: nothing is landed or deployed from that tree until the run after it, whose dry-run
          previews it. Under --check none of that has happened, so the landing's judgement below is skipped.
          {{ _sync_check.stdout_lines | default([]) | select('search', '^kontroll_run_id=') | join(' ') }}
          {{ _sync_check.stdout_lines | default([]) | last | default('') }}
      when: (_sync_check.rc | default(0)) == 3

    # THE LANDING (SECURITY.md C10, rule 8 of the canonical's doors). The worktree's HEAD goes into the canonical's
    # `main` as a LANDING, never a push: scripts/kontroll-land.py reads the canonical's `main` once, by its full
    # name, in the seam (kontroll.canon — as root in the installer container that git is the service uid, never
    # root); refuses when that commit is not an ancestor of HEAD (rc 1 — a real divergence — and rc 128 — the
    # canonical's commit was never brought across — alike: a promote advances canonical `main` with a commit this
    # worktree has never seen, and a landing must not discard it); judges HEAD's tree with the promote gate (this
    # checkout's gen-requirements.py --conflict-check over the commit's files, read object by object from the
    # worktree's own repository and re-hashed) BEFORE anything touches the canonical; then brings the commit across
    # as a pack on a pipe (pack-objects --stdout here, index-pack --stdin there) and moves `main` in one
    # compare-and-swap transaction. No hook of the canonical runs, and no program its config names — a push ran
    # both, as the pusher: root in the installer, the operator host-direct. The canonical's hook now refuses a
    # push of `main` from everyone. Nothing here fetches into the worktree (a root fetch leaves a root-owned
    # `.git/FETCH_HEAD` in the operator's worktree — live-caught 2026-07-28; the sync above brings the canonical's
    # objects across as a pack, as the operator) and nothing runs git's serving side in the canonical (an
    # `ls-remote` did, as the caller, under the canonical's config).
    #
    # Two tasks. The first runs `--check` — ALWAYS, `check_mode: false`, read-only: it judges and prints what would
    # land, so the mandated `--check --diff` dry-run names a refusal (and its sentence) before the real run does,
    # and so does the real run, before it lands. Exit 0 = would land, or up to date; exit 2 = REFUSED (the gate
    # refused the tree, or could not run); exit 1 = nothing to land as asked (not a fast-forward — which the sync
    # above leaves only when the canonical moved again meanwhile: the sentence names the remedy, `kontroll-land.py
    # --sync`, never `--force`, which would delete every promoted proposal). The second lands, and is "changed" when
    # it says so. On a box that ran the previous build, a tree the promote gate refuses used to be mirrored and
    # is now refused HERE, with the generator's sentence: correct it in the checkout, or
    # `python3 scripts/kontroll-land.py --skip-conflict-check` as the human's override (docs/troubleshooting.md §10).
    - name: Say why the dry-run cannot judge the landing yet (the real run seeds the canonical, or restores its HEAD)
      # The judgement below needs a canonical to judge against (`--repo {{ bare }}`), and under --check on a node
      # that has none the `file` and `git init` tasks above were only simulated: the command would exit 1 ("--repo
      # must name a bare repository on this machine") and the refusal task would stop the mandated dry-run of
      # every first install (measured 2026-10-20, in the gate image as root). So it is skipped there, as the
      # ownership pass's detect is, and this says so instead of nothing. "Has none" includes the empty directory
      # the installer's bind mount leaves (above): judged against, it failed the same way (measured 2026-11-07); and
      # a directory that holds entries and no HEAD, which the audit above named (measured 2026-11-08). A repository
      # whose HEAD is gone is not judged either, and the note says so in its own words: the real run restores HEAD
      # and judges the landing then, and may refuse it (a promoted commit the worktree lacks), where "a first seed"
      # would say that it lands (I-19's read A).
      ansible.builtin.debug:
        msg: >-
          local-canonical: {{ bare }} {{ 'holds a repository without HEAD (the audit above named it)' if _word ==
          'headless' else 'holds no canonical yet (' ~ ('it holds entries but no repository: the audit above named
          them' if _canonical_present else ('it is an empty directory — what Docker leaves for a bind source that is
          missing' if _canonical_before.stat.exists else 'it is not there')) ~ ')' }}, so under --check the
          landing's judgement is skipped — the real run {{ 'restores HEAD, then judges the landing' if _word ==
          'headless' else 'creates the canonical and lands HEAD as a first seed, judged then' }}. To judge HEAD's
          tree now: in {{ worktree }}, `git init -q --bare /tmp/empty.git && python3 -B scripts/kontroll-land.py
          --check --repo /tmp/empty.git`.
      vars:
        _word: "{{ _canonical_listing.stdout | default('') | trim }}"
      when: ansible_check_mode and not _canonical_repo

    - name: Judge the working tree's commit as the landing would, and say what would land (nothing is changed)
      ansible.builtin.command:
        cmd: python3 -B scripts/kontroll-land.py --worktree {{ worktree }} --repo {{ bare }} --check
        chdir: "{{ worktree }}"
      register: _land_check
      changed_when: false
      failed_when: false
      check_mode: false
      # Always on a real run; under --check whenever there is a repository to judge against (the same condition as
      # the detect of the ownership pass after the landing) and nothing to bring forward first: the cases left out
      # are the dry-run of a node with no canonical yet, of one whose HEAD is gone, and the dry-run after a promote,
      # each said above.
      when: (_canonical_repo or not ansible_check_mode) and (_sync_check.rc | default(0)) != 3

    - name: Refuse to land what the promote gate refuses, or what would discard promoted work — and say which
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to land (exit {{ _land_check.rc }}) —

          {{ ((_land_check.stdout_lines | default([])) + (_land_check.stderr_lines | default([])))
          | select | map('regex_replace', '(?<![.])$', '.') | join(' ')
          | default('kontroll-land printed nothing.', true) }}
          Nothing was landed: the canonical is untouched and this checkout keeps its commit.
          {{ 'Correct the tree in ' + worktree + ' (the sentence names what), or land with --skip-conflict-check as the
          human override, then run again.'
          if _land_check.rc == 2 else 'Do what the sentence says in ' + worktree + ', then run again.' }}
      # `default(0)`: a skipped judgement (the fresh node's dry-run) registers no `rc`, and is not a refusal
      when: (_land_check.rc | default(0)) != 0

    - name: Land the working tree's commit on the canonical's main (judged above; a pack on a pipe, one CAS)
      ansible.builtin.command:
        cmd: python3 -B scripts/kontroll-land.py --worktree {{ worktree }} --repo {{ bare }}
        chdir: "{{ worktree }}"
      register: _land
      changed_when: "'landed refs/heads/main' in _land.stdout"
      failed_when: _land.rc != 0

    # THE OWNERSHIP PASS, AGAIN, AFTER THE LANDING — so that the deploy after this one reports 0 changed. What a
    # landing leaves in the canonical is not the operator's: run by root (the installer), its canonical-side git is
    # the service uid (rule 5 of kontroll.canon), so the pack, its index, `refs/heads/main` and the reflog are
    # 1001's; run by the operator (host-direct), they are the operator's — and either way git writes the pack and
    # its index READ-ONLY (`0444`), which the pass's group-write rule names. Left for the next deploy, the pass
    # there would re-own and re-mode them and report `changed`, once, after every landing (measured: `changed=1`
    # on the run after a landing by root — CLAUDE.md's rule is that a second apply reports 0 changed). So the
    # same pair runs here, on what this run left, and the next run finds nothing to do. The first pair above stays:
    # on a first run it is what lets a landing by root write into a canonical `git init --bare` left root's.
    # Under --check the landing was skipped, so this detect names only what was already there (and the first
    # pair named); a second detect on the same tree is read-only and cheap. hooks/ is passed over by the pass,
    # so the re-own above stays the last word on it.
    - name: Detect what the landing left that is not operator:1001 or lacks group-write (names only)
      become: true
      ansible.builtin.command:
        cmd: >-
          python3 -B scripts/kontroll-canonical.py --normalise {{ bare }}
          --owner {{ operator_uid }} --group 1001 --check
        chdir: "{{ worktree }}"
      register: _normalise_after
      changed_when: false
      failed_when: _normalise_after.rc not in [0, 3]
      check_mode: false
      when: _canonical_repo or not ansible_check_mode

    - name: Show what the ownership pass names after the landing
      ansible.builtin.debug:
        msg: "{{ _normalise_after.stdout_lines | default([]) }}"
      when: _normalise_after.stdout_lines | default([]) | length > 0

    - name: Make what the landing left operator:1001 and group-writable — hooks/ passed over (0 changed next run)
      become: true
      ansible.builtin.command:
        cmd: >-
          python3 -B scripts/kontroll-canonical.py --normalise {{ bare }}
          --owner {{ operator_uid }} --group 1001
        chdir: "{{ worktree }}"
      register: _normalised_after
      when: (_normalise_after.rc | default(0)) == 3
      changed_when: true

    - name: Report
      # The landing's own lines first — `kontroll_run_id=… land …` and what it landed — so that the deploy's output
      # holds the record (a command task's registered output is not printed).
      ansible.builtin.debug:
        msg: >-
          {{ (_land.stdout_lines | default([]))
          + ['local canonical ready at ' ~ bare ~ ' (Semaphore reads file:///srv/kontroll.git).'] }}

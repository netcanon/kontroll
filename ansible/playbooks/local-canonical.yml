---
# Ensure the LOCAL CANONICAL git — the instance's source of truth (Phase A of
# docs/local-source-of-truth.md). A bare repo on the control node that Semaphore
# reads instead of GitHub, so the running instance needs no remote git. The working
# tree gains a `local` remote pointing at it; onboard/GUI push here (offline, free)
# so changes are visible to Semaphore with zero GitHub dependency.
#
# Access chain used:   localhost (the control node itself)
# May break:           nothing on the lab — control-node git only
# Fallback required:   no
# Blast radius:        this VM only
# Idempotence:         re-runnable; init is `creates:`-guarded, remote add tolerated,
#                      the mirror push is a fast-forward (no-op if already current);
#                      the fleet check and the plaintext gate in front of the commit are read-only.

- name: Ensure the local canonical bare repo
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    # Operator-owned (the working tree pushes here) and runner-readable (Semaphore
    # clones it via the mount). NOT under the storage root (/var/lib/kontroll): that dir is
    # root's (deploy-stack.yml makes a missing one 0711; the installer's is Docker's 0755),
    # and its stores are the services' — the secret captures 1001's 0700. The operator's
    # canonical stays apart.
    bare: /srv/kontroll.git
    worktree: "{{ playbook_dir }}/../.."
    # MF-1 (compose-native installer — docs/reviews/2026-06-29-compose-native-install/99-synthesis.md): inside the
    # ephemeral installer container this play runs as root (user:0:0), so ansible_user_id is 'root' and a fact-derived
    # chown would make the canonical root-owned — breaking the (non-root) operator's `git push local` (the F-CANON
    # bug). The launcher passes the INVOKING host operator's identity in KONTROLL_OPERATOR_{USER,UID}; on a host-direct
    # run those env vars are absent ⇒ fall back to the gathered facts (the SAME value), so off-container is unchanged.
    operator: "{{ lookup('env', 'KONTROLL_OPERATOR_USER') or ansible_user_id }}"
    # Chowns use the NUMERIC uid, not the name: in-container the host operator is absent from /etc/passwd, so a
    # name owner can't resolve — a numeric uid is user-DB-independent and works on host + container alike.
    operator_uid: "{{ lookup('env', 'KONTROLL_OPERATOR_UID') or ansible_user_uid }}"
    # True only inside the installer container (the launcher sets KONTROLL_IN_CONTAINER=1). The NAMED gid-1001 group +
    # the operator's membership are HOST gestures (MF-6) — writing a container-local group that dies with the ephemeral
    # container is pointless; the canonical bytes still get gid 1001 via the numeric `group: "1001"` chown below.
    in_container: "{{ (lookup('env', 'KONTROLL_IN_CONTAINER') | default('', true)) | length > 0 }}"

  tasks:
    # F-CANON (#119): the canonical is group-1001 (the runtime uid:gid the privileged API/runner writes as), but a
    # FRESH control node has no NAMED group at gid 1001 AND the operator is not a member of it — so the operator's
    # Mirror push below (run as the operator, no become) hits "Permission denied" the moment any canonical object
    # is group-1001-owned but not operator-owned. Create the group + add the operator here, BEFORE the canonical is
    # touched. (Old `.10` never hit this — it ran no onboard-gui that staged gid-1001 objects.) Both tasks are
    # idempotent. The owner-side half lands on the recursive grant below.
    # MF-6: these two are HOST gestures — skipped in-container (a container-local group/membership dies with the
    # ephemeral installer and the operator name isn't even in the container's /etc/passwd). On the host they run as
    # before; in-container the operator does `groupadd -g 1001 kontroll && usermod -aG kontroll $USER` once by hand.
    - name: Ensure the gid-1001 group exists (the canonical's group = the runtime uid:gid)
      become: true
      ansible.builtin.group:
        name: kontroll
        gid: "1001"
        state: present
      when: not in_container

    - name: Add the operator to the gid-1001 group (so its `git push local` can write the canonical)
      become: true
      ansible.builtin.user:
        name: "{{ operator }}"
        groups: kontroll
        append: true            # supplementary only — never touches the operator's primary group
      when: not in_container
      # A newly-added supplementary group is NOT effective in the operator's CURRENT login session, so on the very
      # first run the Mirror push can't rely on group membership yet. The recursive grant below makes the canonical
      # OPERATOR-OWNED, so that push succeeds via OWNER perms regardless; this membership is the runtime/future
      # half (effective on the operator's next login).

    # ── THE AUDIT COMES FIRST: before this play writes anything into a canonical that is already there ──────────
    # The tasks below put a canonical right — they write `HEAD`, set the play's config keys again, install the
    # `update` hook, make `hooks/` root's. An audit behind them would never name one of those: it would read the
    # canonical as this play had just left it. Here it reads the canonical as it has been since the last deploy.
    # The price is a line that is nobody's doing: an update that ships a newer hook, or sets a key this play did
    # not set before, names that hook or key once — in the run that puts it right (docs/troubleshooting.md).
    - name: Is there a canonical already — so that it is audited BEFORE this play writes into it
      ansible.builtin.stat:
        path: "{{ bare }}"
        get_checksum: false     # one look at the path, and nothing started on it
        get_mime: false
        get_attributes: false
      register: _canonical_before

    - name: Audit the canonical — name what is in it that this play did not put there (C10; it reports, it never stops)
      # Read-only, and it reads the repository AS FILES: it lists directories and reads `HEAD`, the ref files,
      # `packed-refs` and `hooks/update` itself, and the one process it starts (git, for the keys of the config) is
      # handed the config file's bytes and never the repository. A kind and a key per line, never a value — so
      # no_log is not needed, and would hide the one thing an operator has to read. A canonical that holds only
      # what this play and the tool write prints nothing. It runs under --check too (the mandated dry-run shows
      # the same report first) and it never fails the play: whether a finding should ever stop a deploy is not
      # decided. A first run has nothing to audit: the canonical is this play's own a moment later.
      # Exit 0 is a report. Any other status is NOT one — the path is no directory, the script could not be
      # started, it ended on an error of its own — and the last of these tasks says that in a sentence: an empty
      # list would read as "nothing found".
      ansible.builtin.command:
        cmd: python3 -B scripts/kontroll-canonical.py --audit {{ bare }}
        chdir: "{{ worktree }}"
      register: _canonical_audit
      changed_when: false
      failed_when: false
      check_mode: false
      when: _canonical_before.stat.exists

    - name: Show what the audit named (nothing was changed — docs/troubleshooting.md, "the audit of the canonical")
      ansible.builtin.debug:
        msg: "{{ _canonical_audit.stdout_lines | default([]) }}"
      when: _canonical_audit.stdout_lines | default([]) | length > 0

    - name: Say that the audit gave NO REPORT of the canonical — nothing listed is then not "nothing found"
      vars:
        _audit_no_report: >-
          local-canonical: the audit gave NO REPORT of {{ bare }} (exit status
          {{ _canonical_audit.rc | default('none', true) }}) — nothing listed does not mean the canonical is clean,
          and the deploy goes on. Run `python3 -B scripts/kontroll-canonical.py --audit {{ bare }}` in
          {{ worktree }}; docs/troubleshooting.md, "the audit of the canonical".
      ansible.builtin.debug:
        msg: >-
          {{ [_audit_no_report]
          + (_canonical_audit.stderr_lines | default([]))
          + ([] if (_canonical_audit.rc | default(none)) is number
          else ([_canonical_audit.msg | default('')] | select | list)) }}
      when: _canonical_before.stat.exists and (_canonical_audit.rc | default(-1)) != 0

    - name: Create the bare-repo dir (operator-owned; group-writable for the privileged API — C10)
      become: true
      ansible.builtin.file:
        path: "{{ bare }}"
        state: directory
        owner: "{{ operator_uid }}"       # the operator's working tree pushes here (numeric — MF-1, user-DB-free)
        group: "1001"                     # the runtime uid (the privileged API/runner) — the C10 write grant
        mode: "2775"                      # setgid: pushed objects inherit gid 1001 so BOTH writers keep access;
                                          # others still clone (content is SOPS-encrypted). Group-write is the
                                          # C10 grant; receive.deny* below bounds it (no history rewrite).

    # The git module covers clone/checkout, not init-bare / remote-add / push — these
    # are raw git by necessity, hence the command-instead-of-module suppressions.
    - name: Initialize the bare repo if absent  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git init --bare {{ bare }}"
        creates: "{{ bare }}/HEAD"

    - name: Point the bare repo's HEAD at main (so a fresh clone checks out main)
      ansible.builtin.copy:
        dest: "{{ bare }}/HEAD"
        content: "ref: refs/heads/main\n"
        mode: "0664"            # group-writable, consistent with the C10 gid-1001 grant below — a 0644 here
                                #  would oscillate with the recursive `chmod g+w` (each run re-fighting HEAD)

    - name: Harden the bare repo — deny non-FF/deletes; group-share new objects  # noqa: command-instead-of-module
      # receive.deny*: no force-push / history rewrite on the canonical, from ANY writer (the staging API —
      # which can only push a proposed/<run_id> ref anyway — the runner, or an accidental operator `-f`).
      # Defence-in-depth with the propose-then-promote posture; protects the operator's own pushes too.
      # core.sharedRepository=group: git itself makes NEW refs/objects group-writable + setgid, so a gid-1001
      # actor (the privileged API pushing a proposal; the Semaphore `promote-proposal` task fast-forwarding main
      # + deleting the proposal) can write them WITHOUT host root — the runtime complement to the recursive grant
      # below, which only fixes EXISTING objects.
      # gc.writeCommitGraph=false, repack.updateServerInfo=false: what git's own garbage collection would otherwise
      # leave in the canonical BY ITSELF (a push starts a collection once enough has gathered) — `info/refs` and
      # `objects/info/commit-graph`. Nothing here needs either: the tool's own git reads no commit-graph, and
      # nothing serves the canonical over the dumb protocol. With them off, a file of that name is somebody's, and
      # the audit above names it like any other entry there.
      # --replace-all: a key that is in the file TWICE is one git will not set with a single value (exit 5), so one
      # more line in `config` stopped every deploy at this task. Replaced, the key is there once, with this value —
      # and the audit above has named it (`config-value`) before this task put it right.
      # Idempotent (set-or-replace). SECURITY.md C10 / docs/privileged-mutation-enablement.md.
      ansible.builtin.command:
        cmd: "git -C {{ bare }} config --replace-all {{ item.key }} {{ item.value }}"
      loop:
        - {key: receive.denyNonFastForwards, value: "true"}
        - {key: receive.denyDeletes, value: "true"}
        - {key: core.sharedRepository, value: "group"}
        - {key: gc.writeCommitGraph, value: "false"}
        - {key: repack.updateServerInfo, value: "false"}
      changed_when: false

    - name: Install the C10 update-hook — an allow-list of what a push may do to the canonical (defence-in-depth)
      become: true
      # Belt-and-braces with gitio.commit_and_push's `and not staging` guard (the code boundary): what a PUSH may do
      # to the canonical is decided HERE, by the canonical itself, and it is an allow-list. As uid 1001 (the network
      # service): create refs/heads/proposed/<run id>, and nothing else — not main, not a tag, not refs/replace/*,
      # not a second push to a proposal that exists. As any other uid (the Mirror push below: uid 0 in the installer
      # container, or the operator uid on a host-direct run — NEVER 1001): refs/heads/main and a proposal, and
      # nothing else. A delete is refused from everyone. A human promote is a ref update, not a push (C2): the hook
      # is not what bounds it. The hook body is the committed files/canonical-update-hook.sh (one source of truth
      # the tests read too — no twin drift). Idempotent (fixed file). Runs in BOTH container + host modes (a
      # canonical-config gesture, not a host gesture — no KONTROLL_IN_CONTAINER skip). Closes the dogfood VM-144
      # breach's push half. SECURITY.md C10 / docs/privileged-mutation-enablement.md.
      ansible.builtin.copy:
        src: files/canonical-update-hook.sh
        dest: "{{ bare }}/hooks/update"
        mode: "0755"

    # The top-dir grant (above) + setgid cover a FRESH canonical (objects inherit gid 1001); an EXISTING
    # canonical created before the grant has objects still on the operator's primary group / not group-writable /
    # owned by a different actor (e.g. uid-1001 staged a proposal), so the operator's push can't write near them.
    # Fix the existing objects — the one-time manual `chown -R <operator>:1001 + chmod -R g+w + find -type d
    # setgid` step (F-CANON, #119), now idempotent detect-then-fix tasks. owner=<operator> is the F-CANON half:
    # operator-owned objects let the operator's Mirror push succeed via OWNER perms even before the group
    # membership added above takes effect (next login). SECURITY.md C10 / docs/install-from-scratch.md §3.
    #
    # hooks/ is PRUNED from every grant below and re-owned by root at the end. The canonical is mounted :rw into
    # the uid-1001 service when api_privileged (and, on the permissive edition, into the auto-promoter); with a
    # group-writable hooks/ that writer could plant a `reference-transaction` or `update` hook, and the next
    # `sudo kontroll-promote` would run it as ROOT (2026-10-08 review, finding 2). Every git actor only needs to
    # READ hooks (receive-pack as uid 1001 executes hooks/update), so root:root 0755 is the whole grant.
    - name: Detect canonical objects (outside hooks/) not owned operator:1001  # noqa: command-instead-of-module
      become: true
      # find's own ( ) ! operators (no shell) — `command` passes them as argv. -print -quit stops at the FIRST
      # offender; non-empty stdout ⇒ at least one object still needs the chown. -user/-group take the numeric ids.
      ansible.builtin.command:
        cmd: >-
          find {{ bare }} -path {{ bare }}/hooks -prune -o
          ( ! -user {{ operator_uid }} -o ! -group 1001 ) -print -quit
      register: _own_needed
      changed_when: false

    - name: Chown existing canonical objects operator:1001, hooks/ pruned (F-CANON)  # noqa: command-instead-of-module
      become: true
      ansible.builtin.command:
        cmd: "find {{ bare }} -path {{ bare }}/hooks -prune -o -exec chown -h {{ operator_uid }}:1001 {} +"
      when: _own_needed.stdout | length > 0
      changed_when: true

    - name: Detect canonical objects outside hooks/ missing group-write or setgid  # noqa: command-instead-of-module
      become: true
      # Same shape: a `| head` under pipefail would SIGPIPE the task, so find's own -print -quit does the capping.
      # The find module can't express this perm predicate, hence raw find.
      ansible.builtin.command:
        cmd: >-
          find {{ bare }} -path {{ bare }}/hooks -prune -o
          ( ! -perm -020 -o -type d ! -perm -2000 ) -print -quit
      register: _grant_needed
      changed_when: false

    - name: Grant group-write + setgid on existing canonical objects, hooks/ pruned  # noqa: command-instead-of-module
      become: true
      ansible.builtin.shell: >-
        find {{ bare }} -path {{ bare }}/hooks -prune -o -exec chmod g+w {} +
        && find {{ bare }} -path {{ bare }}/hooks -prune -o -type d -exec chmod g+s {} +
      args:
        executable: /bin/bash
      when: _grant_needed.stdout | length > 0
      changed_when: true

    - name: Keep hooks/ root-owned and read-only to everyone else — a gid-1001 writer must never plant a hook (C10)
      become: true
      ansible.builtin.file:
        path: "{{ bare }}/hooks"
        state: directory
        owner: root
        group: root
        mode: "0755"
        recurse: true

    - name: Ensure the working tree has a 'local' remote  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git remote add local {{ bare }}"
        chdir: "{{ worktree }}"
      register: _remote
      changed_when: _remote.rc == 0
      failed_when: _remote.rc != 0 and 'already exists' not in _remote.stderr

    - name: Check the fleet list before it is committed and mirrored (scripts/gen-requirements.py --fleet-check)
      # The commit and the mirror below are a way into the canonical's `main` that passes no promote gate: they take
      # the operator's worktree as it is. A fleet line that is not a device-class key would be on `main` when this
      # play ends — and from then on the promote gate refuses EVERY proposal, not only one that touches the fleet.
      # One rule (kontroll.paths), asked before the commit. Read-only: it runs under --check too, so the mandated
      # dry-run names the entry's place before the real run does. (Not the only such way: scripts/update.sh,
      # scripts/update-from-bundle.sh and the operator CLI's onboard push HEAD to `main` unchecked — SECURITY.md C22.)
      ansible.builtin.command:
        cmd: python3 -B scripts/gen-requirements.py --fleet-check   # -B: a read leaves no __pycache__ behind
        chdir: "{{ worktree }}"
      register: _fleet_check_canonical
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to mirror a fleet the promote gate would refuse, and say which entry
      # ANY non-zero status refuses, as for the plaintext guard below: a check that could not run checked nothing —
      # and then the message says that, not "correct the fleet".
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to commit —
          {{ _fleet_check_canonical.stderr_lines | default([]) | last
          | default('the fleet check printed nothing.', true) }}
          This play staged, committed and pushed nothing: no ref of the canonical moved.
          {{ 'Correct instance/fleet.yml in'
          if 'gen-requirements: instance/fleet.yml' in (_fleet_check_canonical.stderr | default(''))
          else 'Nothing was checked: make `python3 scripts/gen-requirements.py --fleet-check` run in' }}
          {{ worktree }} and run again.
      when: _fleet_check_canonical.rc != 0

    - name: List anything the commit below would take in plaintext (names only, never content)
      # The commit below is a BLANKET add of the operator's worktree; this is its content gate
      # (scripts/lib/plaintext-guard.sh — a secret file that is not fully sops-encrypted, a stray file in a secrets
      # directory, a private key). Read-only: it lists what WOULD be staged and reads those files, so it runs under
      # --check as well and the mandated dry-run names the offender before the real run does. Its output is file
      # names, a rule and line numbers — never a value — so no_log is not needed, and would hide the one thing the
      # operator has to read.
      ansible.builtin.command:
        argv:
          - sh
          - "{{ worktree }}/scripts/lib/plaintext-guard.sh"
          - "{{ worktree }}"
      register: _plaintext_guard
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to commit plaintext into the canonical, and say which file
      # ANY non-zero status refuses, not only the guard's "found something" code: a guard that is missing or
      # could not run has checked nothing.
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to commit —
          {{ (_plaintext_guard.stderr_lines | default([]) | join('; ')) or 'the plaintext guard could not run' }}.
          This run staged, committed and pushed nothing.
          {{ 'Move the named file out of the repository, or see' if 'REFUSED' in (_plaintext_guard.stderr | default(''))
          else 'Nothing was checked: see' }}
          docs/install-from-scratch.md ("REFUSING to commit") for the fix that fits.
          {{ 'A file with no sops block is encrypted with `sops --config instance/.sops.yaml -e -i <file>`.'
          if 'no sops block' in (_plaintext_guard.stderr | default('')) else '' }}
      when: _plaintext_guard.rc != 0

    - name: Commit uncommitted instance state into the canonical  # noqa: command-instead-of-module
      # kontroll-init --fresh scaffolds instance/ AFTER install.sh's initial commit, so on a fresh node the
      # overlay (inventory, fleet, .sops.yaml, ENCRYPTED secrets) is untracked — the mirror below pushes HEAD,
      # which would omit it, leaving Semaphore's canonical clone without any instance config. Commit it here (the
      # operator needs no git knowledge — local-source-of-truth goal). "Everything committed is ciphertext or
      # public" is CHECKED by the two tasks above, not asserted. Idempotent: a no-op when the tree is already clean.
      ansible.builtin.shell: |
        cd {{ worktree }}
        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git -c user.name=kontroll -c user.email=kontroll@localhost \
              commit -q -m "kontroll: instance state {{ ansible_date_time.iso8601 }}"
          echo committed
        fi
      args:
        executable: /bin/bash
      register: _state_commit
      changed_when: "'committed' in _state_commit.stdout"

    # Where the canonical stands relative to the worktree. The mirror is a FAST-FORWARD-ONLY push, and the two can
    # legitimately diverge the moment propose-then-promote is in use: a promote advances canonical `main` with a
    # commit the operator's worktree has never seen. Ask first, so the failure below can say something true.
    - name: Read the canonical's current main — WITHOUT writing to the worktree  # noqa: command-instead-of-module
      # `ls-remote`, deliberately NOT `fetch`. This play runs as ROOT inside the installer container, and a fetch
      # writes `.git/FETCH_HEAD` into the OPERATOR's worktree — root-owned. The operator's own next `git fetch`
      # then dies with "cannot open '.git/FETCH_HEAD': Permission denied", i.e. the remedy this task's own error
      # message tells them to run. (Live-caught 2026-07-28: the first cut of this check did exactly that, and the
      # printed remedy failed when followed verbatim.) ls-remote writes nothing anywhere.
      ansible.builtin.command:
        cmd: "git ls-remote local refs/heads/main"
        chdir: "{{ worktree }}"
      register: _canon_ref
      changed_when: false
      failed_when: false

    - name: Note the canonical's main sha (empty on a first run — no main there yet)
      ansible.builtin.set_fact:
        canonical_main: "{{ (_canon_ref.stdout | default('')).split()[0] | default('', true) }}"

    - name: Check whether the canonical has commits the worktree does not  # noqa: command-instead-of-module
      # rc 0 = that sha is an ancestor of HEAD: a clean fast-forward (or identical) — mirror away.
      # ANY non-zero = it is not provably an ancestor, and BOTH failure modes mean the same thing here: rc 1 is a
      # real divergence, and rc 128 ("Not a valid object name") is the promote case — the canonical's commit was
      # never fetched, so its objects are absent from the worktree entirely. Fail closed on both: this gates a push
      # that would otherwise discard promoted work.
      ansible.builtin.command:
        cmd: "git merge-base --is-ancestor {{ canonical_main }} HEAD"
        chdir: "{{ worktree }}"
      register: _canon_behind
      changed_when: false
      failed_when: false
      when: canonical_main | length > 0

    - name: Refuse to mirror over promoted work, and say so  # noqa: command-instead-of-module
      # rc 1 = canonical main is NOT an ancestor of HEAD, i.e. it holds commits this worktree lacks. The push would
      # be rejected anyway — this exists so the operator reads an actionable sentence instead of git's generic
      # "Updates were rejected... fetch first" hint, which on a control plane sounds like a transient git problem
      # rather than "your promoted proposals live only here". Live-caught 2026-07-28: after promoting an onboard
      # bundle by hand, the next deploy died on this task with no indication that promoted state was the cause.
      # NEVER force: the canonical is where promotes land, and --force would silently delete them.
      # REBASE, not `merge --ff-only`: the two histories genuinely DIVERGE, they do not merely lag. This
      # play commits an "instance state" commit of its own on each run, so the moment a promote lands in the
      # canonical the worktree also has a commit the canonical lacks — neither is an ancestor of the other and
      # a fast-forward is impossible. `rebase` is correct in BOTH cases: with no local commits to replay it
      # simply fast-forwards. (Live-caught 2026-07-28: the first message said `--ff-only`, and following it
      # verbatim gave "fatal: Not possible to fast-forward, aborting" — an actionable message that was not.)
      ansible.builtin.fail:
        msg: >-
          local-canonical: REFUSING to mirror — the canonical ({{ bare }}) has commit(s) your worktree
          ({{ worktree }}) does not, so this push would discard them. That is normal once propose-then-promote is
          in use: a promote advances canonical `main` directly. Bring the worktree forward first —
          `git -C {{ worktree }} fetch local && git -C {{ worktree }} rebase local/main` — then re-run.
          Nothing was pushed and the canonical is untouched.
      when: canonical_main | length > 0 and (_canon_behind.rc | default(0)) != 0

    - name: Mirror the working tree's commit into the canonical  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "git push local HEAD:refs/heads/main"
        chdir: "{{ worktree }}"
      register: _mirror
      changed_when: "'->' in _mirror.stderr or 'new branch' in _mirror.stderr"
      failed_when: _mirror.rc != 0 and 'up-to-date' not in _mirror.stdout + _mirror.stderr

    - name: Report
      ansible.builtin.debug:
        msg: "local canonical ready at {{ bare }} (Semaphore reads file:///srv/kontroll.git)."

---
# Pull a fresh config from each device into {{ config_backup_dir }} and commit a
# timestamped snapshot into that dir's LOCAL git history (the snapshot play), so every
# device's config is diffable over time. Mirrors the migration repo's
# ops/backup-procedure.md intent for the new stack.
#
# Thin orchestrator — each device CLASS does its capture via its own role's
# `backup` entrypoint, selected by `device_role` (same dispatch as ping.yml).
# Adding a device class = add roles/<class>/tasks/backup.yml. This playbook
# never changes.
#
# Backup-capability: each class declares `backup_capable` (roles/<class>/
# defaults/main.yml); a class that is not capable records a logged skip instead
# of a forced empty capture. Override per host in host_vars/<host>.yml. The summary
# play prints a per-host summary (captured / skipped / FAILED / not-run) from the
# `kontroll_backup_result` fact each role sets. The raw-SSH, CLI, RouterOS, OPNsense
# and API backups record a read that answers nothing as a failed capture and never
# write it, so the last good capture is kept. The Proxmox and Docker-host backups,
# whose scripts print a `### ` header before each read, do the same with an answer
# of the headers alone. A capture that fails as a task is recorded as failed by the
# capture play's rescue, so its host still reaches the history, the prune and the
# key cleanup, and the summary names it (I-12). A class whose backup entrypoint is
# not installed, or holds no task, is refused as a task first, so the rescue records
# it the same way (I-66); one whose entrypoint is installed but cannot be loaded (a
# file it includes is missing) is failed in that rescue and fails the run, with no
# summary line; one whose entrypoint does not parse ends the whole run (rc 4).
#
# Access chain used:   control node (mgmt VLAN) -> mgmt IPs over SSH/API
# May break:           none (read-only captures)
# Fallback required:   no
# Blast radius:        none — pure reads

- name: Fleet preamble — stamp the run id + materialize per-host SSH keys
  ansible.builtin.import_playbook: _fleet-preamble.yml

# The controller plays (this one, the history and the prune) start from `localhost:all`, run once under the linear
# strategy, and delegate every task to localhost. A `--limit` that does not name localhost leaves the implicit
# localhost out, so a `hosts: localhost` play was skipped (`skipping: no hosts matched`), and every Semaphore backup
# schedule runs this playbook `--limit <its inventory group>` (scripts/gen-backup.py): no scheduled run checked the
# capture dir, committed a capture to the history or pruned it, and each passed (I-48's first half, I-90). Unlimited,
# localhost is the play's first host, so each task runs there, as before; under a limit, it runs once, for the first
# host left in the play, on the controller, with the controller's connection (a host's own `ansible_connection`
# outranks `connection: local`: I-41), and reads its variables as that host: a device's group or host var that set
# `config_backup_dir` or the retention would be the one used (none shipped does). `strategy: linear` outranks a
# caller's `ANSIBLE_STRATEGY`: the free strategy does not honour `run_once`, and would run each task once per host, on
# one repo. Where every host of the limit has failed, no host is left to run them; Ansible has ended the run already
# (I-48, I-66).
- name: Ensure backup dir exists
  hosts: localhost:all
  run_once: true
  strategy: linear
  gather_facts: false
  tasks:
    # config_backup_dir is referenced throughout this playbook and defined in instance/inventory/group_vars/all.yml.
    # instance.example/ shipped NO group_vars until 2026-07-28, so every box built by `kontroll-init --fresh`
    # had it UNDEFINED and this play died on an undefined-variable error that named a template, not a remedy.
    # New boxes now scaffold the default; boxes built BEFORE that fix still need this message. Cheap, and it
    # fails at the first task instead of part-way through a fleet capture.
    - name: Refuse without a capture directory, naming the remedy
      delegate_to: localhost
      ansible.builtin.assert:
        that: config_backup_dir is defined and (config_backup_dir | string | length > 0)
        fail_msg: >-
          config_backup_dir is not defined, so there is nowhere to write captures. Add it to
          instance/inventory/group_vars/all.yml (a box scaffolded before 2026-07-28 has no such file — copy
          instance.example/inventory/group_vars/all.yml), or pass -e config_backup_dir=/path for a one-off.
        # A default here: an assert templates its messages before it tests, so an undefined var in this one ended the
        # task on an undefined-variable error and the remedy above was never printed (I-91).
        success_msg: "captures -> {{ config_backup_dir | default('') }}"

    - name: Ensure backup directory exists
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ config_backup_dir }}"
        state: directory
        mode: "0700"            # deploy-stack.yml's mode: the captures hold device secrets (C8)

- name: Capture device configs (per-class backup entrypoint)
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  # A caller's any_errors_fatal (ANSIBLE_ANY_ERRORS_FATAL, an ansible.cfg) failed every other host once one host's
  # capture failed, rescue or not: a host whose read had answered was moved into the rescue and dropped from every
  # later play, its capture never written and no summary line for it (the I-12 reads' O1). The play's own keyword
  # wins over that setting.
  any_errors_fatal: false
  tasks:
    - name: Refuse a host whose device_role is a fact (only the inventory names the role it dispatches by)
      ansible.builtin.import_tasks: tasks/refuse-device-role-fact.yml

    # A capture that fails as a task (a read that exits non-zero or errors, a module or permission error, the API
    # credential gate's assert, a write that fails) is recorded as a failed capture: the rescue names the task it
    # stopped at, never its result (the reads and writes are no_log), so the host goes on to the history, the prune
    # and the key cleanup, and the summary names it FAILED and fails the run. Before, it failed the host here: no
    # summary line, and when every host failed so, the run ended at this play and left the run's keys (I-12). A
    # capture dir that is not writable fails the history commit next, which still ends the run (I-48). An
    # unreachable host is not failed (ignore_unreachable), so the rescue does not run for it, and the refusal above
    # stays outside the block: a refused host fails here, as before.
    #
    # A class whose backup entrypoint is not installed (a host with no `device_role`, a `device_role` no installed role
    # answers, a role with no tasks/backup.yml, or one the run's user cannot read) or holds no task (an empty or
    # comment-only file) is refused by the block's first task, a task failure the rescue records like any other, so the
    # host reaches the cleanup and the summary names it (I-66). Before, its include could not be loaded, which is no
    # task failure: Ansible dropped the host from every later play or ended the whole run, and where that was every
    # host the run's keys stayed; or it loaded and ran nothing, and the summary read "not run" with the run passing.
    #
    # An include that still cannot be loaded (a file or role the class's backup itself includes that is missing, a
    # role dependency that is not installed, or a class in collection form whose collection is not installed) is no
    # task failure: Ansible moves the host into the rescue with no failed task and drops it from every later play, so
    # it gets no summary line, and where it was every host Ansible ended the run with rc 0. The rescue's second task
    # fails it, so the run fails; where it is every host, the run's keys stay (I-66). An entry that does not parse or
    # is not a list, an installed collection whose role has no backup entry, and a role whose defaults, vars or meta do
    # not parse are not refused either: ansible-core ends the whole run at the include (rc 4), every host's capture and
    # keys with it (tasks/refuse-missing-entrypoint.yml lists what the check does not see).
    - name: Run the class-specific backup entrypoint
      block:
        - name: Refuse a host whose class has no backup entrypoint installed
          ansible.builtin.import_tasks: tasks/refuse-missing-entrypoint.yml
          vars:
            kontroll_entrypoint: backup

        - name: Run the class-specific backup entrypoint
          ansible.builtin.include_role:
            name: "{{ device_role }}"
            tasks_from: backup
      rescue:
        - name: Record a capture that failed as a task
          ansible.builtin.set_fact:
            kontroll_backup_result: >-
              FAILED: the capture stopped at the task "{{ ansible_failed_task.name | default('(unnamed)', true) }}"
              (a no_log task prints only that it failed).
            kontroll_backup_failed: true
        - name: Fail a host whose class's backup entrypoint could not be loaded
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: the backup entrypoint of the class {{ device_role | default('?') }} could not
              be loaded (a file or role it includes is missing, or the collection it names is not installed), so the
              run fails here (I-12).
          when: ansible_failed_task is not defined

# Keep a per-run, diffable HISTORY of every device's config instead of overwriting
# (docs/logging-architecture.md Layer 0, G3 — answers "what changed on this device?").
# The store is LOCAL-ONLY: it lives inside the already-0700/uid-1001 captures dir, has
# NO remote, and is never pushed — captures hold device secrets (running-config hashes,
# PSKs), so the history stays exactly as protected as the captures (SECURITY.md C8).
# The git module covers clone/checkout, not init/add/commit — raw git by necessity.
#
# Access chain used:   localhost (the control node's captures dir)
# May break:           nothing on the lab — control-node git only
# Fallback required:   no
# Blast radius:        this VM's captures dir only
# Idempotence:         no device change -> nothing staged -> no commit (0 changed)
- name: Snapshot the captures into local history (git)
  hosts: localhost:all  # under any --limit, as the play above (I-90)
  run_once: true
  strategy: linear
  gather_facts: false
  connection: local
  vars:
    _ts: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    # The capture-exception matrix (config/capture-exceptions.yml) is a SPARSE registry —
    # only captures that misbehave (e.g. FortiGate's non-deterministic full-config export).
    # Its exclude_from_history members are kept on disk (latest) but NOT versioned, so a
    # non-diffable capture can't fill the history with noise commits. Operator-extensible.
    _matrix: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../config/capture-exceptions.yml',
         errors='ignore') | default('', true) | from_yaml | default({}, true) }}
    _exclude_globs: >-
      {{ (_matrix.exceptions | default([])) | selectattr('disposition', 'defined')
         | selectattr('disposition', 'eq', 'exclude_from_history') | map(attribute='match') | list }}
  tasks:
    - name: Initialise the capture-history repo if absent  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.command:
        cmd: "git init -q {{ config_backup_dir }}"
        creates: "{{ config_backup_dir }}/.git"

    - name: Render the history .gitignore from the capture-exception matrix
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ config_backup_dir }}/.gitignore"
        mode: "0644"
        content: |
          # GENERATED from config/capture-exceptions.yml (disposition: exclude_from_history).
          # Non-deterministic/volatile captures: kept on disk (latest), kept OUT of the git
          # history so they don't make noise commits. Edit the matrix, not this file.
          {{ _exclude_globs | join('\n') }}

    # The capture-history store is owned by the Semaphore runtime uid (1001) — the SCHEDULED writer. The mutating
    # raw-git tasks below carry `-c safe.directory={{ config_backup_dir }}` (scoped to THIS store, never `*`) so an
    # operator hand-running this play on the host to debug or seed a first capture — necessarily a DIFFERENT uid
    # (root via sudo, or the uid-1000 operator; uid-1001 has no host passwd entry) — doesn't abort on git's
    # dubious-ownership guard. It is a no-op on the same-uid runner path and adds NO write capability (it only
    # suppresses the cross-uid guard for one dedicated dir). `git init` above needs none — it CREATES the repo.
    - name: Untrack any now-excluded captures (one-time cleanup; idempotent after)  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >-
          git -c safe.directory={{ config_backup_dir }} -C {{ config_backup_dir }}
          rm -r --cached --ignore-unmatch -- {{ _exclude_globs | join(' ') }}
      changed_when: false
      when: _exclude_globs | length > 0

    # A blanket add with NO plaintext gate, on purpose: this repository is device captures, which are plaintext BY
    # DESIGN (running-configs with hashes and pre-shared keys). Its protection is that it has no remote and lives
    # in the uid-1001 0700 store (SECURITY.md C8) — an is-encrypted gate here would refuse every capture.
    - name: Stage all captures (excluded ones are gitignored)  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.command:
        cmd: "git -c safe.directory={{ config_backup_dir }} -C {{ config_backup_dir }} add -A"
      changed_when: false

    - name: Commit a timestamped snapshot when configs changed  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >-
          git -c safe.directory={{ config_backup_dir }} -C {{ config_backup_dir }}
          -c user.email=kontroll-backup@localhost -c user.name='kontroll backup'
          commit -q -m 'backup {{ _ts }}'
      register: _snapshot
      changed_when: _snapshot.rc == 0
      failed_when:
        - _snapshot.rc != 0
        - "'nothing to commit' not in _snapshot.stdout + _snapshot.stderr"

# ENFORCE the backup retention window by pruning capture-history commits older than it (#125 — the deferred
# follow-up to #123, which only DECLARED + CARRIED `retention`). DEFAULT-SAFE: a NO-OP unless a finite
# `kontroll_backup_retention` window (30d/90d/365d) is passed; `keep-all` or an undefined var (a manual /
# unscheduled run) skips the prune (0 changed). The prune is a DESTRUCTIVE, history-only git rewrite of the
# LOCAL-ONLY captures repo: it re-roots the kept slice onto a synthetic FULL-snapshot baseline (each commit's
# tree is a complete snapshot, so dropping old commits loses no current capture — only the diffable HISTORY
# beyond the window), then gc's to reclaim disk. A fail-closed guard set (finite window / real worktree / NO
# git remote / not bare / not the canonical path) SKIPS or FAILS before any destructive command — a wrong-repo
# rewrite (the C10 canonical /srv/kontroll.git, the deploy tree) is the catastrophic mode this is built to make
# impossible. The captures repo NEVER has a remote; the canonical + deploy tree DO — that is the load-bearing
# distinguisher. Touches commit metadata/trees only, never prints capture CONTENT (no secret leak; SECURITY.md C8).
#
# Access chain used:   localhost (the control node's own captures dir — config_backup_dir); local git only,
#                      no network, no device, no SSH.
# May break:           at worst the LOCAL capture history's OLD commits (by design — that IS the prune). The
#                      latest snapshot + working tree are preserved. CANNOT touch the canonical /srv/kontroll.git
#                      or the deploy tree — guarded fail-closed (no-remote + non-bare + not-canonical-path).
# Fallback required:   no — captures are local-only ephemeral history; the latest capture state (working tree +
#                      HEAD) is preserved; only AGED history below the window is dropped.
# Blast radius:        this VM's captures dir ONLY (config_backup_dir). Never the canonical, deploy tree, device,
#                      or network.
# Idempotence:         re-running with the same window in the same time window ⇒ 0 changed (no commit is older
#                      than the cutoff after the first prune). A rolling cutoff means a later cron run MAY drop
#                      newly-aged commits (correct — changed_when reflects whether anything was actually pruned).
# Concurrency:         an mkdir lock serializes two prunes on the same captures dir. RESIDUAL (review SEC-MF1):
#                      a per-class snapshot COMMIT from ANOTHER concurrent backup run could be orphaned by this
#                      prune's history rewrite and reclaimed — bounded to ONE historical diff point on local-only
#                      ephemeral data (never the canonical, never the current capture — the next run re-captures
#                      live device state). Mitigated by the staggered per-class crons (≥30 min apart).
- name: Prune capture history older than the retention window (git)
  hosts: localhost:all  # under any --limit, as the play above (I-90)
  run_once: true
  strategy: linear
  gather_facts: false
  connection: local
  vars:
    _retention: "{{ kontroll_backup_retention | default('keep-all') | trim }}"
    # The finite windows (days) — MUST match service/backup.py _RETENTIONS (a covering test pins the agreement).
    _windows: {'30d': 30, '90d': 90, '365d': 365}
    _retention_days: "{{ _windows.get(_retention, 0) }}"
  tasks:
    # Tier 1 (UNCONDITIONAL): a hand-run `-e kontroll_backup_retention=7d` (a value the GUI never offers) FAILS
    # loudly rather than silently falling through to keep-all. keep-all / undefined pass (keep-all is allowed).
    - name: Fail-closed — reject a retention value that is not a known preset
      delegate_to: localhost
      ansible.builtin.assert:
        that:
          - _retention in ['keep-all', '30d', '90d', '365d']
        fail_msg: >-
          kontroll_backup_retention='{{ kontroll_backup_retention | default('') }}' is not a recognised window.
          Allowed: keep-all (no prune), 30d, 90d, 365d (matches service/backup.py _RETENTIONS). A hand-run -e
          with a bad value is refused, not silently treated as keep-all.
        quiet: true

    # The remaining tasks run ONLY for a finite window (keep-all / undefined ⇒ _retention_days == 0 ⇒ skip,
    # a clean no-op). The read-only guard resolvers carry check_mode:false (so a --check dry-run PROVES the
    # decision); the destructive prune does NOT (it stays check-skipped — a dry-run rewrites nothing).
    - name: Resolve the captures repo's real toplevel (read-only)  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.command:
        cmd: "git -C {{ config_backup_dir }} rev-parse --show-toplevel"
      register: _prune_toplevel
      changed_when: false
      failed_when: false
      check_mode: false
      when: _retention_days | int > 0

    - name: Stat the captures .git to confirm a real worktree repo
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ config_backup_dir }}/.git"
      register: _prune_dotgit
      check_mode: false
      when: _retention_days | int > 0

    # The captures repo must have NONE — the load-bearing guard (the canonical + deploy tree DO have remotes).
    - name: List the captures repo's remotes (must be empty)  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.command:
        cmd: "git -C {{ config_backup_dir }} remote"
      register: _prune_remotes
      changed_when: false
      failed_when: false
      check_mode: false
      when: _retention_days | int > 0

    # The canonical is a BARE repo; the captures dir is a worktree. A bare target ⇒ wrong repo ⇒ refuse.
    - name: Detect whether the captures repo is bare  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.command:
        cmd: "git -C {{ config_backup_dir }} rev-parse --is-bare-repository"
      register: _prune_is_bare
      changed_when: false
      failed_when: false
      check_mode: false
      when: _retention_days | int > 0

    # Fail CLOSED (loud) if ANY precondition is unmet. The no-remote + not-canonical clauses are the firewall
    # against rewriting the wrong repo; rc==0 on the discriminating reads means an ERRORED git read fails closed
    # rather than reading as a benign empty result.
    - name: Fail-closed — refuse the prune unless the target is provably the local-only captures repo
      delegate_to: localhost
      ansible.builtin.assert:
        that:
          - _prune_dotgit.stat.exists
          - _prune_toplevel.rc == 0 and (_prune_toplevel.stdout | length > 0)
          - _prune_remotes.rc == 0 and (_prune_remotes.stdout | trim | length == 0)
          - _prune_is_bare.rc == 0 and (_prune_is_bare.stdout | trim | lower == 'false')
          - (_prune_toplevel.stdout | trim) not in ['/srv/kontroll.git']
          - not (_prune_toplevel.stdout | trim | regex_search('(^|/)kontroll\.git(/|$)'))
        fail_msg: >-
          Refusing to prune capture history: the target {{ config_backup_dir }} (resolved
          {{ _prune_toplevel.stdout | default('?') | trim }}) failed a fail-closed safety gate
          [remotes='{{ _prune_remotes.stdout | default('') | trim }}',
          bare={{ _prune_is_bare.stdout | default('?') | trim }}].
          The prune ONLY ever rewrites the LOCAL-ONLY captures worktree — a non-bare git repo at config_backup_dir
          with NO remote that is NOT the canonical /srv/kontroll.git or the deploy tree. A remote, a bare repo, or a
          canonical path means the wrong repo (SECURITY.md C8/C10).
        quiet: true
      when: _retention_days | int > 0

    # The prune. History-only (no working-tree checkout): re-root the kept slice onto a synthetic full-snapshot
    # baseline, bake with filter-branch, drop the backup refs, reflog-expire + gc to actually reclaim disk. The
    # drop-set count (`--before`) gate makes a re-run a true no-op (after the first prune nothing is older than
    # the cutoff). In-script guards (no-remote / canonical-path) are REDUNDANT with the asserts above by design
    # (defense in depth on the catastrophic wrong-repo mode). belt-and-suspenders `when:` re-asserts every guard
    # + `not ansible_check_mode` so a --check dry-run never rewrites and a future edit must defeat BOTH layers.
    - name: Enforce retention — prune capture-history commits older than the window  # noqa: command-instead-of-module
      delegate_to: localhost
      ansible.builtin.shell: |
        set -euo pipefail
        repo='{{ config_backup_dir }}'
        window_days='{{ _retention_days }}'
        cd "$repo"
        # --- in-script fail-closed guards (redundant defense-in-depth with the ansible asserts) ---
        git rev-parse --git-dir >/dev/null 2>&1 || { echo "PRUNE_SKIP not-a-git-repo"; exit 0; }
        [ -z "$(git remote)" ] || { echo "PRUNE_ABORT has-remote"; exit 3; }
        case "$repo" in */srv/kontroll.git*|*kontroll.git) echo "PRUNE_ABORT canonical-path"; exit 3 ;; esac
        # A captures dir holds only device configs; the deploy/source tree has a root CLAUDE.md — a second
        # independent net for the deploy tree on top of its no-remote (it is a clone). (review SEC-MF2)
        [ ! -e CLAUDE.md ] || { echo "PRUNE_ABORT looks-like-source-tree"; exit 3; }
        # --- serialize against a CONCURRENT prune on the same captures dir: two filter-branch rewrites racing
        #     could corrupt refs. mkdir is atomic on every POSIX fs (no flock dep). Skip (don't fail) if locked —
        #     the next cron tick prunes. (review SEC-MF1; the snapshot-vs-prune residual is documented in the
        #     header + SECURITY.md C8.) ---
        lock="$(git rev-parse --git-dir)/kontroll-prune.lock"
        mkdir "$lock" 2>/dev/null || { echo "PRUNE_NOOP locked (a concurrent prune holds the lock)"; exit 0; }
        trap 'rmdir "$lock" 2>/dev/null || true' EXIT
        # --- clear stale rewrite scaffolding from a prior KILLED run BEFORE the drop-set gate, so a half-run
        #     can't (a) mask itself as a clean no-op via a lingering virtual graft or (b) leave history
        #     permanently grafted with the old objects never reclaimed. Idempotent (xargs -r no-ops when clean).
        #     This also makes `git replace --graft` below always run against a clean state. (review COR-MF1) ---
        git for-each-ref --format='%(refname)' refs/replace/  | xargs -r -n1 git update-ref -d
        git for-each-ref --format='%(refname)' refs/original/ | xargs -r -n1 git update-ref -d
        # --- empty / single-commit short-circuits ---
        git rev-parse -q --verify HEAD >/dev/null 2>&1 || { echo "PRUNE_NOOP empty-repo"; exit 0; }
        total=$(git rev-list --count HEAD)
        [ "$total" -gt 1 ] || { echo "PRUNE_NOOP single-commit"; exit 0; }
        # --- the drop set: commits OLDER than the window. zero -> idempotent no-op (the key re-run guard) ---
        drop=$(git rev-list --count --before="${window_days} days ago" HEAD)
        [ "$drop" -gt 0 ] || { echo "PRUNE_NOOP nothing-older-than-window"; exit 0; }
        # --- keep-root = oldest commit WITHIN the window; all-older -> keep ONLY the latest snapshot ---
        keep_root=$(git rev-list --reverse --since="${window_days} days ago" HEAD | head -1 || true)
        [ -n "$keep_root" ] || keep_root=$(git rev-parse HEAD)
        # --- re-root: synthetic full-snapshot baseline (no data loss), graft, bake, drop refs, gc ---
        baseline=$(git -c user.email=kontroll-backup@localhost -c user.name='kontroll backup' \
                     commit-tree "${keep_root}^{tree}" -m "backup history baseline (pruned >${window_days}d)")
        git replace --graft "${keep_root}" "${baseline}"
        FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force --tag-name-filter cat -- --all
        git replace -d "${keep_root}" 2>/dev/null || true
        git for-each-ref --format='%(refname)' refs/original/ | xargs -r -n1 git update-ref -d
        git reflog expire --expire=now --all
        git gc --prune=now --quiet
        # EXACT removed-count: total(before) - kept(after) + 1 (the synthetic baseline inflates the after-count
        # by exactly 1, so a kept keep_root/boundary commit is never mis-counted as dropped). (review COR-MF3)
        kept=$(git rev-list --count HEAD)
        echo "PRUNE_DONE dropped=$(( total - kept + 1 )) kept=${kept} window=${window_days}d"
      args:
        executable: /bin/bash
      register: _prune
      changed_when: "'PRUNE_DONE' in _prune.stdout"
      failed_when: "_prune.rc != 0"
      # NO check_mode:false — this is a MUTATOR; it must stay check-skipped so --check never rewrites history.
      # This `when:` is a FAITHFUL MIRROR of the fail-closed assert above (rc==0 reads + the kontroll.git regex,
      # not just the literal /srv/kontroll.git) so the "a future edit must defeat BOTH layers" invariant is real,
      # not a subset. (review SEC-MF3)
      when:
        - _retention_days | int > 0
        - _prune_dotgit.stat.exists | default(false)
        - (_prune_remotes.rc | default(1)) == 0 and (_prune_remotes.stdout | default('') | trim | length == 0)
        - (_prune_is_bare.rc | default(1)) == 0 and (_prune_is_bare.stdout | default('') | trim | lower == 'false')
        - (_prune_toplevel.stdout | default('') | trim) not in ['/srv/kontroll.git']
        - not ((_prune_toplevel.stdout | default('') | trim) | regex_search('(^|/)kontroll\.git(/|$)'))
        - not ansible_check_mode

    - name: Report the prune outcome (run-id-correlated audit; counts only, never capture content)
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "retention prune ({{ _retention }}): {{ _prune.stdout | default('(skipped)') }}"
      when: _retention_days | int > 0

# Post-run: remove the per-run ephemeral SSH key dir. It is the last import, after the fleet connections (MF-4), and
# it comes before the summary below, whose assert may fail every host (I-9).
- name: Clean up the per-run ephemeral SSH key dir
  ansible.builtin.import_playbook: _cleanup-ssh-keys.yml

# The summary is the last play. Its assert fails each host whose capture was recorded as failed, and when that is
# every host, Ansible ends the playbook there: a play after it would not run. Before I-9 the history, the prune and
# the key cleanup came after it, so a run whose every capture was recorded as failed (since I-5, one device that
# answers nothing) left the run's SSH keys on disk. It connects to nothing: a debug and an assert open no connection,
# whatever the host's connection (`connection: local` says so, it guards nothing), so it can follow the key cleanup.
# A capture that fails as a task is recorded as failed by the capture play's rescue, and its host reaches here
# (I-12), and so does a host whose class has no backup entrypoint installed, refused as a task first (I-66); a host
# whose class's installed backup entrypoint could not be loaded is failed in that rescue, and does not.
# A failing local play above (the backup dir's check, the history commit, the prune's retention check) still ends
# the run there, before the cleanup and this summary (I-48's second half); since I-90 a limited run, as every schedule
# is, reaches those plays, so this holds for it too.
- name: Backup run summary
  hosts: all
  gather_facts: false
  connection: local
  tasks:
    - name: Per-host backup result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ device_role | default('?') }}):
          {{ kontroll_backup_result | default('not run — unreachable or skipped') }}

    # A logged skip or an unreachable host is tolerated; a capture recorded as
    # FAILED — a read that answered nothing, an API answer that is not 200, a Docker
    # read that exited non-zero (I-62), or a capture that failed as a task, named by
    # the capture play's rescue (I-12) — must not pass silently: fail the run so a
    # scheduled job surfaces it. This runs after every host's summary line above.
    - name: Fail the run if any capture failed
      ansible.builtin.assert:
        that: not (kontroll_backup_failed | default(false) | bool)
        fail_msg: "{{ inventory_hostname }}: config-backup capture FAILED (see summary above)."
        quiet: true
      when: kontroll_backup_failed | default(false) | bool

---
# Connectivity smoke test — Phase 1 exit criterion.
# Reachability is determined by an explicit TCP probe FROM the control node
# (delegated to localhost) inside block/rescue — NOT by ignore_unreachable
# bookkeeping, which continues past an unreachable host and would otherwise
# let a down device report a misleading "ok". The per-class `check` (real
# protocol/creds liveness) runs only once the port is confirmed open.
#
# Access chain used:   control node (mgmt VLAN) -> mgmt IPs (TCP/SSH/API)
# May break:           none (read-only liveness checks)
# Fallback required:   no
# Blast radius:        none — pure reads
#
# The probe's port, first set wins (S28): `mgmt_port` (a hand override, normally unset) → `ansible_port` (what
# Ansible itself connects on; the onboard form's SSH port) → `kontroll_probe_port` (the port the host's backend
# declares, written at onboard: 443 for `api`) → 22. A host that sets none of the three is probed on 22, as before.
# A var set to null or empty counts as unset (`default(…, true)`): `wait_for` with no port only sleeps and reports
# ok, so a hand-written `ansible_port: ~` used to pass the probe with nothing listening.
#
# A host whose class has no `check` entrypoint installed (no `device_role`, one no installed role answers, a role with
# no tasks/check.yml or one with no task in it) is refused before the probe, as a task its own block's rescue records:
# the summary names it REFUSED, and the run's last play, after the key cleanup, fails it (I-83). The include of such a
# class could not be loaded, which is no task failure: Ansible dropped the host from every later play or ended the
# whole run, so the run's SSH keys stayed where no later play ran (no `device_role` was reported UNREACHABLE on 2.19
# instead); and a class that loads as a role running nothing (an empty `device_role`, a role with no tasks/, an empty
# or comment-only check) was reported OK. An unreachable host still leaves the run passing. An installed check that
# cannot be loaded (a file or role it includes is missing, a role dependency or a class's collection that is not
# installed) is not refused: the probe's rescue fails its host, which leaves every later play, so where that is every
# host the run's keys stay (before I-83 such a run ended with rc 0; it now fails). A check that does not parse, an
# installed collection whose role has no check, and a role whose defaults, vars or meta do not parse are not refused
# either: ansible-core ends the whole run at the include (rc 4), every host's keys left (the entrypoint check's
# header lists what it does not see).
#
# What the summary says, and what fails the run (I-84, I-85). The block records which of its steps failed: the probe
# (nothing answered on the host's port: UNREACHABLE, which a run tolerates, a down host being no failure) or the
# class's check after the probe passed (CHECK FAILED, naming the task it stopped at: the device answered but the check
# did not pass, a credential it rejects, a protocol error), which the last play fails after the key cleanup, so the
# smoke gate (scripts/run-smoke-gate.sh) fails a fleet whose reachable devices fail their checks. Before I-84 both read
# UNREACHABLE and the run passed. A dry run skips the probe and runs each check in check mode: its summary says so
# (`dry run: the port was not probed`), and it never fails for a check, which cannot run against every device in check
# mode (tests/fresh-node-check.sh runs it on a mock inventory). A caller that needs every host reachable (galaxy.py's
# onboard verify, which reads the rc) passes `-e kontroll_ping_require_reachable=true`, and the last play then fails
# an UNREACHABLE host too. A check whose connection fails (an SSH login or banner failure on a raw-SSH host) is no
# task failure: the host leaves the run with no summary line and the run ends rc 4, as before.

- name: Fleet preamble — stamp the run id + materialize per-host SSH keys
  ansible.builtin.import_playbook: _fleet-preamble.yml

- name: Reach the fleet (per-class liveness)
  hosts: all
  gather_facts: false
  # A caller's any_errors_fatal (ANSIBLE_ANY_ERRORS_FATAL, an ansible.cfg) failed every other host once one host's
  # probe or refusal failed, rescue or not: a reachable host was dropped from every later play with no summary line,
  # and where a down host stood beside it the run ended here, before the key cleanup (the I-83 reads' S3, as I-12's O1
  # for the capture). The play's own keyword wins over that setting; the probe only reads.
  any_errors_fatal: false
  tasks:
    # Outside the block: its rescue would name a refused host a failed check, which a dry run passes.
    - name: Refuse a host whose device_role is a fact (only the inventory names the role it dispatches by)
      ansible.builtin.import_tasks: tasks/refuse-device-role-fact.yml

    # Its own block: the probe's rescue would name a refused host a failed check, which a dry run passes. The rescue
    # records the refusal; the host skips the probe and the check, and fails in the last play, after the key cleanup
    # (I-83).
    - name: Refuse and record a host whose class has no check entrypoint installed
      block:
        - name: Refuse a host whose class has no check entrypoint installed
          ansible.builtin.import_tasks: tasks/refuse-missing-entrypoint.yml
          vars:
            kontroll_entrypoint: check
      rescue:
        - name: Record the refused class (the run fails on it after the key cleanup)
          ansible.builtin.set_fact:
            kontroll_class_refused: true

    - name: Probe reachability, then run the class check
      when: not (kontroll_class_refused | default(false))
      block:
        - name: TCP reachability probe from the control node
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: >-
              {{ mgmt_port | default(ansible_port | default(kontroll_probe_port | default(22, true), true), true) }}
            timeout: 5
          delegate_to: localhost
          register: _kontroll_probe

        - name: Run the class-specific liveness check
          ansible.builtin.include_role:
            name: "{{ device_role }}"
            tasks_from: check

        - name: Mark host reachable
          ansible.builtin.set_fact:
            kontroll_reachable: true
      rescue:
        # The probe's own failure is UNREACHABLE; any other task's is the check's (the probe passed, or was skipped
        # in a dry run). Only the failed task's name is kept, never its result: a check may handle a credential.
        - name: Mark host unreachable, or record the check's failure
          ansible.builtin.set_fact:
            kontroll_reachable: false
            kontroll_check_failed: "{{ _kontroll_probe | default({}) is not failed }}"
            kontroll_check_failed_at: "{{ ansible_failed_task.name | default('') }}"
        # An include that cannot be loaded is no task failure: the host comes here with no failed task and leaves every
        # later play, and where it was the only host the run ended with rc 0. Fail it, so the run does not pass.
        - name: Fail a host whose class's check entrypoint could not be loaded
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: the check entrypoint of the class {{ device_role | default('?') }} could not
              be loaded (a file or role it includes is missing, or the collection it names is not installed), so the
              run fails here.
          when: ansible_failed_task is not defined

- name: Reachability summary
  hosts: all
  gather_facts: false
  connection: local
  tasks:
    - name: Word each host's reachability
      ansible.builtin.set_fact:
        kontroll_ping_line: >-
          {{ 'REFUSED: its class has no check entrypoint installed'
          if kontroll_class_refused | default(false)
          else ('CHECK FAILED: its check stopped at the task: ' ~ kontroll_check_failed_at)
          if kontroll_check_failed | default(false) | bool
          else 'OK' if kontroll_reachable | default(false) else 'UNREACHABLE' }}{{
          ' (dry run: the port was not probed)' if ansible_check_mode and not kontroll_class_refused | default(false)
          else '' }}

    - name: Per-host reachability
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ kontroll_ping_line }}"

# Post-run: remove the per-run ephemeral SSH key dir (imported after the last fleet connection: MF-4; only a play
# that connects to nothing follows it).
- name: Clean up the per-run ephemeral SSH key dir
  ansible.builtin.import_playbook: _cleanup-ssh-keys.yml

# Last, after the key cleanup, so that a run whose every host is refused still removes its keys (as
# backup-configs.yml's summary follows it: I-9). It connects to nothing. It fails a refused host, a reachable host
# whose check failed (not in a dry run: I-84), and, when the caller requires it, an unreachable one.
- name: Fail the run for a host refused, whose check failed, or unreachable where the caller requires it
  hosts: all
  gather_facts: false
  connection: local
  tasks:
    - name: Fail a host refused, whose check failed, or unreachable where the caller requires it
      ansible.builtin.assert:
        that:
          - not (kontroll_class_refused | default(false))
          - ansible_check_mode or not (kontroll_check_failed | default(false) | bool)
          - not (kontroll_ping_require_reachable | default(false) | bool) or kontroll_reachable | default(false)
        fail_msg: "{{ inventory_hostname }}: {{ kontroll_ping_line | default('no summary') }} (see the summary)."
        quiet: true

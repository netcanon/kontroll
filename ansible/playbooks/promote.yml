---
# Promote a staged proposal (proposed/<run_id>) to main — the Semaphore "approve" half of C10's
# propose-then-promote. Runs the ONE tested FF-only promote (scripts/kontroll-promote.py ->
# gitio.promote_commit) against the mounted canonical. The network service (API/GUI) can only PROPOSE;
# THIS is the trusted promote, reachable only by a Semaphore admin (mgmt VLAN), NEVER by the API
# token — so a leaked token can never self-promote. SECURITY.md C10 / docs/privileged-mutation-enablement.md.
#
# Access chain used:   Semaphore runner (gid 1001) -> the rw-mounted canonical /srv/kontroll.git. No host root:
#                      it uses the gid-1001 group-write grant + core.sharedRepository=group set by
#                      local-canonical.yml. The promote is one ref transaction run by kontroll-promote.py (not a
#                      push, so the receive hooks are not what bounds it): it is fast-forward only, moves main
#                      only from the commit it read to the commit it judged, and can never rewrite history.
# May break:           advances the canonical's main (the instance source of truth). FF-only ⇒ no history
#                      rewrite; the canonical is a reconstructible cache (operator workstation + GitHub are truth).
# Fallback required:   no — a bad main is re-pushable from the workstation; main only ever fast-forwards.
# Blast radius:        the local canonical git on this VM only (never the lab fabric).
# Idempotence:         an APPROVAL action, not a convergence play. Promoting a given run_id once advances main
#                      and deletes the proposal; a second run for the same id fails loudly (no such proposal) —
#                      the correct behaviour for an approval (never silently "succeed" on a stale id).

- name: Stamp the run correlation id
  ansible.builtin.import_playbook: _log-run-id.yml

- name: Promote a staged proposal to main (C10 — trusted, fast-forward only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    canonical: /srv/kontroll.git
    repo_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Require the proposal as <run id>@<commit id> (which proposal, and which commit of it was looked at)
      # Survey-supplied free text -> validate before it reaches an argv. Pin to the EXACT minted grammar so only a
      # service-issued id is promotable: uuid4().hex[:12] (12 lowercase hex) OR mint_run_id()
      # (<YYYYMMDD>T<HHMMSS>Z-<6hex>, api/audit.py) — then `@` and the FULL commit id the operator was shown. The
      # commit is what ties this approval to what was read: kontroll-promote.py refuses when the proposal has
      # become another commit since. The command module (no shell) blocks injection.
      # A FULL match, the same rule as kontroll.canon.valid_run_id / valid_oid (one test feeds both the same
      # samples): `match` with `^…$` also accepts the value followed by a newline, because `$` matches before a
      # final one.
      ansible.builtin.assert:
        that:
          - run_id is defined
          - >-
            run_id is regex('([0-9a-f]{12}|[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6})@[0-9a-f]{40}([0-9a-f]{24})?',
            match_type='fullmatch')
        fail_msg: >-
          Give the proposal as <run id>@<commit id>: a service-minted run id (12 hex, or <UTC-stamp>-<6hex>), an
          @, and the full commit id. Copy it from the GUI's Pending panel (the copy control on the proposal's
          row), or print the staged proposals in that form on the control node with
          `kontroll-promote.py --list --repo {{ canonical }}`.
        quiet: true

    - name: Promote the proposal to main (fast-forward only, and only the commit that was named)
      # The single tested promote (scripts/kontroll-promote.py -> gitio.promote_commit): it reads main and the
      # proposal once, refuses unless the proposal is the commit named after the @, PRINTS what the approval lands
      # (run id, commit, the commits — this job's log is the record of what was approved), runs the resolve gate,
      # and moves main in one ref transaction. Non-zero exit fails the job: 1 = no such proposal, not the commit
      # named, not a fast-forward, or main moved meanwhile; 2 = the resolve gate refused the tree (two conflicting
      # pins, a fleet line that is not a class key, a tree it does not take) or could not run — its sentence is in
      # the job log.
      ansible.builtin.command:
        cmd: python3 {{ repo_root }}/scripts/kontroll-promote.py {{ run_id }} --require-pin --repo {{ canonical }}
      register: _promote
      changed_when: "'promoted' in _promote.stdout"

    - name: Promotion result (the promoter's own preview and outcome; run_id-correlated, never a secret)
      ansible.builtin.debug:
        msg: "{{ _promote.stdout_lines }}"

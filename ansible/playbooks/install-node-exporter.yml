---
# Install the Prometheus node_exporter on the metrics-eligible hosts — the device classes whose module
# declares a `via: host` metrics source (today: proxmox -> hypervisors, docker_host -> docker_hosts; keep
# the default group pattern in sync with those modules, or pass -e target=<host>/<group>). The scrape
# targets for these hosts are already GENERATED (scripts/gen-observability.py); this play lands the agent so
# those targets go UP. State-changing -> run with --check --diff FIRST (CLAUDE.md). The play tolerates a down host
# (`ignore_unreachable`): a host whose fact gathering is unreachable (down, refusing or timing out the connection,
# refusing the run's key or its host key, and on 2.19+ a become that never prompts: ansible-core counts each as
# unreachable) gets nothing more run on it, in a dry run too. The run passes for it (rc 0; its recap counts it
# `ignored`, not `unreachable`), and the `Install run report` play, after the key cleanup, names it: nothing installed.
# Before I-89 the role ran on it anyway and failed it at its OS-family task, its facts missing, so one down host failed
# the run. A host that answers the gathering and drops later is not skipped: each task it does not answer is ignored,
# and a re-check after its install (a `ping`, one more connection per host) names it in the report where it still
# does not answer: its install may not be done (I-92). One that answers again by the re-check is not named (its recap
# counts each task it did not answer as `ignored`). Under a caller's any_errors_fatal an ignored unreachable result
# trips it as a failure does: every host is failed in the rescue and the run ends before the cleanup with the keys
# kept, with one host or more; the rescue's message names a host whose own gathering or re-check was unreachable as
# such (I-97), and any other with the causes it cannot tell apart.
#
# Backfill the fleet:   ansible-playbook playbooks/install-node-exporter.yml --check --diff   (then for real)
# One host (onboard):   ansible-playbook playbooks/install-node-exporter.yml -e target=<host>
#                       (an unreachable host passes with nothing installed: the run's report says so)
#
# The play runs node_exporter on every host of the target pattern, whatever the host's device_role, so a host whose
# connection is not of the ssh family is refused before anything runs on it (tasks/refuse-local-connection.yml).
# Facts are gathered after that, so a refused host has nothing run on it.
#
# A host whose install fails, at a task or at a handler the role's tasks notify (those run inside the block: I-86), is
# recorded, not failed, at the install play, and failed by the last play, after the key cleanup: an install that fails
# on every host no longer ends the run before the cleanup, which would leave the run's SSH keys in its key dir (I-64).
# The rescue ends the install play for that host, as the failure did, so a handler a task notified before it does not
# run (a caller's force_handlers is not honoured for such a host: its handlers ran before). A host that reaches the
# rescue with no failed task of its own and no handlers due is failed there: its role could not be loaded, or another
# host's failure stopped it (a `run_once` task, a caller's any_errors_fatal). Under a caller's any_errors_fatal every
# host's install stops at the first failure: with one host whose install fails the run reaches the cleanup and the
# summary names it (before ansible-core 2.19.2, not where a handler fails: the rescue cannot tell that host from one
# another's failure stopped, and fails it there); where one host's failure stops another (or, before 2.19.2, every
# host's handler fails), or where an unreachable gathering or re-check trips it (above), the run ends at that play and
# the keys stay. What else still ends the run before the cleanup: every host refused, every host's role failing to load
# (I-66), and, before 2.19.2, a handler that fails on every host in a `meta: flush_handlers` of the role's own (no
# shipped role has one); _cleanup-ssh-keys.yml's header lists them. A handler notified by one defined after it would run
# after the block, and a `run_once` handler that failed would drop the other hosts from every later play unnamed:
# tests/unit/test_fleet_play_rescue.py refuses either in every role under roles/.
#
# Access chain used:   control VM (mgmt VLAN) -> target hosts (SSH, root key ~/.ssh/ansible_ed25519)
# May break:           none — additive read-only agent (:9100); no firewall/network change
# Fallback required:   no
# Blast radius:        the targeted hosts (a node_exporter service each; reversible: apt remove)

- name: Fleet preamble — stamp the run id + materialize per-host SSH keys
  ansible.builtin.import_playbook: _fleet-preamble.yml

- name: Install node_exporter on the metrics-eligible hosts
  hosts: "{{ target | default('hypervisors:docker_hosts') }}"
  gather_facts: false             # gathered below, after the refusal: nothing runs on a refused host
  ignore_unreachable: true        # a down host is tolerated, not fatal (CLAUDE.md)
  tasks:
    # The ssh family, bare and under `ansible.builtin.`. The `paramiko` alias and the `ansible.legacy.` spellings
    # are refused, which fails closed. paramiko_ssh is deprecated in ansible-core 2.19 (its removal is flagged for
    # 2.21): drop it here before the installer's ansible-core pin reaches 2.21.
    - name: Refuse a host whose connection is not of the ssh family (node_exporter runs on the host itself)
      ansible.builtin.import_tasks: tasks/refuse-local-connection.yml
      vars:
        refusal_connections: [ssh, ansible.builtin.ssh, paramiko_ssh, ansible.builtin.paramiko_ssh]

    # A task that failed here on every host ended the run at this play, before the key cleanup (I-64). The rescue
    # records the host's failure by the failed task's name (not its result, which is printed at that task), and the
    # run's last play fails the host, after the cleanup. A host reaches the rescue with no failed task of its own and
    # no handlers due when its role cannot be loaded (no task failure) or another host's failure moved it there (a
    # `run_once` task, a caller's any_errors_fatal). It would be dropped from every later play, so the rescue fails it
    # here, as backup-configs.yml's capture rescue does (I-12); the condition cannot tell the two causes apart, so the
    # message names both. Where every host's role fails to load, the keys stay (I-66).
    - name: Gather facts and install node_exporter, a failure recorded for the run's last play (I-64)
      block:
        # Cleared first, so a marker kept from an earlier play of the run (a caller that imports this playbook beside
        # wire-logging.yml), or an inventory var of that name, does not make the rescue record a host whose role never
        # ran its tasks as one whose handlers failed (I-86).
        - name: Clear the handlers-due marker (the role's tasks set it, below)
          ansible.builtin.set_fact:
            _kontroll_handlers_due: false

        # The `gather_facts` action, as the play keyword runs it. Under a network plugin (refused above) `setup` ran
        # on the controller and reported its facts; `gather_facts` picks the network OS's facts module instead.
        # Untagged, like the refusal and the include: they share fate.
        - name: Gather facts (ansible_os_family dispatches apt+systemd on Debian, apk+OpenRC on Alpine)
          ansible.builtin.gather_facts:
          register: _kontroll_gather

        # include_role (dynamic), matching the repo convention (ping.yml) — resolves via roles_path at runtime
        # (cwd = ansible/, ansible.cfg roles_path=roles), and doesn't trip syntax-check's static role resolution.
        # Not on a host whose gathering was unreachable: `ignore_unreachable` lets it go on, with no facts (I-89).
        - name: Install + start node_exporter (the via:host host metrics agent)
          ansible.builtin.include_role:
            name: node_exporter
          when: _kontroll_gather is not unreachable

        # The handlers the role's tasks notify run here, inside the block, not at the play's end, outside it, where
        # one that failed failed its host and, on every host, ended the run before the cleanup (I-86). A failed
        # handler is then recorded as a failed task is: by its name from ansible-core 2.19.2, which gives the rescue
        # the handler as `ansible_failed_task`; before 2.19.2 (without force_handlers) it gives none, and this marker
        # lets the rescue record it. A handler that one of them notifies runs in this flush only where it is defined
        # after the one notifying it (the unit row holds every role so).
        - name: Mark the host's role tasks done and its handlers due (the rescue reads it, I-86)
          ansible.builtin.set_fact:
            _kontroll_handlers_due: true

        - name: Run the role's handlers inside the block, so a failed one is recorded (I-86)
          ansible.builtin.meta: flush_handlers

        # A host that answered the gathering and stopped answering later has each later task's unreachable result
        # ignored, so its install ends with nothing failed (I-92). One more connection asks whether it still answers;
        # the run's report, after the cleanup, names one that does not. Inside the block, so a re-check that fails
        # (not unreachable) is recorded as a failed task is.
        - name: Re-check the host after its install (the run's report names one that no longer answers, I-92)
          ansible.builtin.ping:
          register: _kontroll_recheck
          when: _kontroll_gather is not unreachable
      rescue:
        - name: Record the failed install for the run's last play (the task's name; its result is printed above)
          ansible.builtin.set_fact:
            kontroll_install_failed: >-
              the install stopped at the task "{{ ansible_failed_task.name | default('(unnamed)', true) }}"
          when: ansible_failed_task is defined

        # Without any_errors_fatal only its own failed handler (before 2.19.2, which gives the rescue no failed task
        # unless force_handlers is on) brings a marked host here with no failed task. With it, another host's failure
        # can too, and ansible-core then drops the host from every later play, so the task below fails it after this
        # record, as it does a host stopped before its handlers. A caller sets any_errors_fatal only through the
        # config: an importing playbook's keyword does not reach these plays (import_playbook accepts
        # `any_errors_fatal` and ignores it). A `run_once` handler that failed would bring only the host it ran on,
        # ansible-core dropping the others from every later play unnamed: the unit row refuses one in every role.
        - name: Record an install stopped while its handlers ran (before 2.19.2 a failed handler is no failed task)
          ansible.builtin.set_fact:
            kontroll_install_failed: the install stopped while the role's handlers ran (the failure is printed above)
          when: ansible_failed_task is not defined and (_kontroll_handlers_due | default(false) | bool)

        # Under a caller's any_errors_fatal an ignored unreachable result moves every host here, the unreachable one
        # too, and ansible-core then holds each as failed, so this cannot record it and let it go on: it names a host
        # whose own gathering or re-check was unreachable by that cause (I-97), and any other by the causes the
        # condition cannot tell apart.
        - name: Fail a host stopped with no failed task of its own (no later play would see it)
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: {% if _kontroll_gather is defined and _kontroll_gather is unreachable %}its
              fact gathering was unreachable, so nothing was installed on it, and it was stopped with the play's other
              hosts (a caller's any_errors_fatal stops every host at an unreachable one as at a failed one, or another
              host's run_once task failed){% elif _kontroll_recheck is defined and _kontroll_recheck is unreachable %}it
              did not answer the re-check after its install, which may not be done, and a caller's any_errors_fatal
              stops every host at an unreachable one as at a failed one{% else %}stopped with no failed task of its
              own: the node_exporter role could not be loaded, or another host's failure stopped it (a run_once task, a
              caller's any_errors_fatal, under which before ansible-core 2.19.2 its own failed handler names no task
              either); the cause is printed above{% endif %}
          when: >-
            ansible_failed_task is not defined
            and (not (_kontroll_handlers_due | default(false) | bool)
            or (lookup('ansible.builtin.config', 'ANY_ERRORS_FATAL') | bool))

        - name: End the host's install play, as its failure did (no handler it notified runs, force_handlers or not)
          ansible.builtin.meta: end_host

# Post-run: remove the per-run ephemeral SSH key dir (imported LAST — after the fleet connections; MF-4).
- name: Clean up the per-run ephemeral SSH key dir
  ansible.builtin.import_playbook: _cleanup-ssh-keys.yml

# A host the install could not reach is not failed (a down host is tolerated, not fatal: CLAUDE.md); this names each,
# with what was not done (I-92). It reads the results the install play registered and connects to nothing: its tasks
# are `debug`s. Before the summary, which stays the run's last play.
- name: Install run report
  hosts: "{{ target | default('hypervisors:docker_hosts') }}"
  gather_facts: false
  connection: local
  tasks:
    - name: Name a host whose fact gathering was unreachable (nothing was installed; the run passes)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: not installed: its fact gathering was unreachable"
      when: _kontroll_gather is defined and _kontroll_gather is unreachable

    - name: Name a host that stopped answering after its fact gathering (its install may not be done; the run passes)
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: its install may not be done: it answered the fact gathering, then not the re-check
          after its install (each task it did not answer was ignored)
      when: _kontroll_recheck is defined and _kontroll_recheck is unreachable

# After the cleanup, so a run whose every install failed still removes its keys (I-64). It connects to nothing: its one
# task is a `fail`, which runs on the controller (`connection: local` guards nothing: a host's own
# `ansible_connection` outranks it).
- name: Install run summary
  hosts: "{{ target | default('hypervisors:docker_hosts') }}"
  gather_facts: false
  connection: local
  tasks:
    - name: Fail a host whose install failed, naming the task it stopped at
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }}: FAILED: {{ kontroll_install_failed }}"
      when: kontroll_install_failed is defined

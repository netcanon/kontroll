---
# Stamp + log this run's correlation id (Layer 0, docs/logging-architecture.md §3).
# Imported FIRST by every playbook a run can start with (directly, or through _fleet-preamble.yml;
# tests/unit/test_run_id_stamp_imported.py) so every run's id lands in the run's output (the ansible log
# where ansible/ansible.cfg is read, AND the Semaphore job output, Postgres-backed, queryable via the
# task API) — the key that correlates one operation across the ansible log, the Semaphore job, and
# (ahead) the aggregated logs. A caller may inject `-e kontroll_run_id=...`; otherwise a UTC timestamp
# is used.
#
# hosts: all:localhost + run_once. It starts from `all` (NOT hosts: localhost) so the stamp still
# fires under `--limit <host>` — the onboard verify path runs `ping.yml --limit <host>`, which a
# localhost-only play would skip, silently losing the correlation id for exactly the single-host
# runs. It adds localhost because the implicit localhost is not in `all`: on an inventory with no
# hosts, `all` matches nothing and nothing was stamped, while the run's localhost plays still
# acted (I-15: reload-observability's real run POSTed /-/reload with no id). run_once takes the
# play's first host, which is the first inventory host when there is one, so a fleet's stamp
# lands where it did and its recap gains no localhost (measured on ansible-core 2.19 and 2.18,
# tests/integration/test_run_id_stamp_runs.py). `--list-hosts` lists localhost for this play
# too; run_once stamps it there only when the inventory has no hosts.
#
# Both tasks run on the controller (delegate_to: localhost), so the stamp loads no fleet host's
# connection plugin and contacts nothing; it takes localhost's connection and become settings
# (`local` and none, unless the inventory names localhost with others). connection: local alone
# applies only to a host that names no connection of its own: a first host whose
# ansible_connection names a plugin that is not installed (network_cli before bootstrap.yml has
# installed ansible.netcommon) failed the stamp and ended the run, bootstrap's own included
# (I-52, I-41). The line reads `[<host> -> localhost]`.
# Both carry `tags: [always]`, so a `--tags` run is stamped too (`--skip-tags always` drops it).
#
# Printed ONCE per run. local-canonical.yml runs alone (the recovery paths) and under
# deploy-stack.yml, after deploy-stack's own stamp: the second import sees _kontroll_run_stamped and
# says nothing, so a run has one line and one id (an unset id is `now()`, which a second stamp
# could mint a second later) (I-41). Once holds for the shipped playbooks, which run the linear
# strategy and add no host; it does not hold under the free strategy (run_once is not honoured
# there: each host prints), for a host added by add_host before a later import (it carries no
# fact), or for a run given `-e _kontroll_run_stamped=...`: a key=value form is a non-empty
# string, so none prints, and a JSON `false` makes every import print. A run started with
# `--start-at-task` past the stamp prints none unless a later import runs, and one with
# `--skip-tags always` prints none.
#
# The id printed is kept as `_kontroll_run_id`, for a play later in the run that names it in a line of its own (the
# backup summary's per-device line, I-65): an unset id is `now()`, so a later read of `kontroll_run_id` would mint
# another. It is taken from the printed line, so it is the id the log carries; a later import keeps it, and a run
# that printed none has none. `kontroll_run_id` itself is left alone (group_vars/all.yml names the key dir by it).
- name: Stamp the run correlation id
  hosts: all:localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Log kontroll_run_id
      ansible.builtin.debug:
        msg: "kontroll_run_id={{ kontroll_run_id | default(now(utc=true, fmt='%Y%m%dT%H%M%SZ'), true) }}"
      register: _kontroll_run_stamp
      run_once: true
      delegate_to: localhost
      when: not (_kontroll_run_stamped | default(false))
      tags: [always]

    - name: Note that this run's id is printed (a later import of this stamp says nothing)
      ansible.builtin.set_fact:
        _kontroll_run_stamped: true
        _kontroll_run_id: >-
          {{ _kontroll_run_id if _kontroll_run_id is defined
             else (_kontroll_run_stamp.msg | default('') | regex_replace('^kontroll_run_id=', '')) }}
      run_once: true
      delegate_to: localhost
      tags: [always]

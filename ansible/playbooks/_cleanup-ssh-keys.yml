---
# Post-run: remove the per-run ephemeral SSH key dir _render-ssh-keys.yml created. Imported LAST by every fleet play
# (after the fleet connections are done); only a play that connects to nothing may follow it, as backup-configs.yml's,
# install-node-exporter.yml's and wire-logging.yml's summaries and ping.yml's last play do, so that a run whose every
# capture was recorded as failed (a read that answered nothing, an API answer that is not 200, a capture that failed as
# a task: I-12, a class whose backup entrypoint is not installed or holds no task, which the capture block refuses as
# such a task: I-66), whose every install or wiring failed, or whose wiring request was refused (I-64), or whose every
# ping host's class has no `check` entrypoint installed (I-83) still gets here (I-9). The device keys are EPHEMERAL
# (unlike file_tail_ssh's persistent bind-mounted read key). A hard-aborted run skips this (in backup-configs.yml and
# ping.yml, a host whose class's entrypoint does not parse, an installed collection whose role has no such entrypoint,
# or a role whose defaults, vars or meta do not parse: ansible-core ends the whole run at the include, rc 4: I-66), and
# so does a run that an earlier play stops: one whose every target is refused (by tasks/refuse-local-connection.yml, or
# in backup-configs.yml a `device_role` fact refused), whose every host's role cannot be loaded (in backup-configs.yml,
# a class whose installed backup entrypoint includes a file or role that is missing, or depends on a role or names a
# collection that is not installed: I-66; in ping.yml, a class whose installed `check` entrypoint cannot be loaded),
# whose failing local play ends it (in backup-configs.yml: I-48), whose caller's any_errors_fatal stops more than one
# host at a failure (a capture's play and ping's reach play override it; an install or a wiring honours it, and reaches
# this play where the failing host is its only one, unless before ansible-core 2.19.2 its handler is what fails: I-86;
# an install's or a wiring's ignored unreachable host trips it too, and ends the run before this play with one host or
# more: I-97),
# whose handler fails on every host in a `meta: flush_handlers` of the role's own before ansible-core 2.19.2
# (install-node-exporter.yml and wire-logging.yml, whose rescue then cannot tell it from a role that could not be
# loaded: I-86; no shipped role has one), whose class's backup or `check` entrypoint notifies a handler that fails on
# every host (backup-configs.yml and ping.yml run a class's handlers at the play's end, outside their rescued block; no
# shipped class's entrypoint notifies one), or (in ping.yml, whose reach play does not ignore unreachable hosts) that
# cannot be logged in to: ansible-core runs no later play once every host of a play's batch has failed or been
# unreachable, and a later play whose every host has failed by then runs nothing. Every key-auth host's key rendered for
# that run then stays in that run's dir. No shipped caller passes `kontroll_run_id` (the Semaphore templates and
# schedules and the enact commands pass none), so every run uses `kontroll-ssh-keys.manual`, which the next real run
# that completes removes. On the Semaphore runner that is `/tmp/kontroll-ssh-keys.manual` in the container's writable
# layer: a host reboot or a container restart keeps it, and the next Semaphore fleet job that completes, or recreating
# the container, removes it. A dry run (`--check`) uses that path with `.check` appended (group_vars/all.yml), a dir of
# its own, which the next dry run removes, so a dry run never removes a real run's keys (I-87). Two real runs that
# overlap share their dir, as two dry runs share theirs, so one's cleanup removes the other's keys mid-run: that job's
# connections already open go on (ControlPersist keeps one 60 s), and a new one cannot log in and counts as an ignored
# unreachable host, so the job can end green with that host not run; nothing runs elsewhere.
# On a CLI host it is under `$XDG_RUNTIME_DIR` when that is set (logout or a reboot clears it), else `/tmp`. A caller
# that passes `-e kontroll_run_id` gets a dir no later run reuses. `$KONTROLL_SSH_KEY_DIR`, when set, is the dir itself
# (a dry run's, with `.check`): every run uses it, whatever the run id, and this play removes it, when it holds nothing
# but `*.key` files. tasks/refuse-foreign-key-dir.yml, imported first, refuses a path that is not a directory or holds
# anything else (a home dir, `~/.ssh`, `/tmp`), which the delete removed whole with all it held: refused, every host
# fails, the run ends there and nothing is removed (I-95). The dir removed is the first remaining host's
# `kontroll_device_key_dir` (the task runs once): when a host var or a `set_fact` gives hosts different dirs, every
# other dir stays, with its keys. The residue is 0600, run-uid-owned keys outside the repo (accepted, SECURITY.md).
# Every run mode removes it, as every mode renders it: the delete carries `check_mode: false`, so a dry run (`--check`)
# removes its dir too (I-87: skipped, a dry run removed nothing, a stale key an earlier run left included), and the
# play is tagged `always`, so a `--tags` run does (I-93); a `--skip-tags always` (or `tagged`) run removes nothing, as
# it renders nothing; a `--start-at-task` past the render renders none, and this play still runs. Idempotent.
#
# Access chain used:   control node / Semaphore runner -> rm the local ephemeral key dir
# May break:           nothing on the fleet — removes a LOCAL ephemeral dir after this run's connections completed;
#                      a run overlapping it in the same mode loses its keys (above)
# Fallback required:   no
# Blast radius:        the runner's own per-run key dir
- name: Remove the per-run ephemeral SSH key dir
  hosts: all
  gather_facts: false
  connection: local
  run_once: true
  tags: [always]
  tasks:
    - name: Refuse a key dir that holds anything but SSH keys (it is removed whole)
      ansible.builtin.import_tasks: tasks/refuse-foreign-key-dir.yml

    - name: Delete the materialized per-host SSH keys (ephemeral)
      ansible.builtin.file:
        path: "{{ kontroll_device_key_dir }}"
        state: absent
      # delegate_to: localhost — same reason as _render-ssh-keys.yml: run_once picks the first host, whose
      # ansible_connection would otherwise route this LOCAL `rm` over its device connection. Pin it to the runner.
      delegate_to: localhost
      check_mode: false   # a dry run removes the dir it rendered, and an earlier run's (I-87)

---
# Apply ONE logging WIRING role to ONE onboarded device class — the device-side half of the logging capability
# (the ENACT step logsvc.logging_enact_commands emits for a PUSH method). ONE thin dispatcher fans every wiring
# role (logging_syslog_push / logging_journald_remote / logging_file_tail_ssh); the per-method config lives in
# the role, never here (no per-method playbook proliferation, no per-vendor branching — CLAUDE.md).
#
#   dry-run first (CLAUDE.md):  ansible-playbook playbooks/wire-logging.yml -e role=<r> -e target=<key> --check --diff
#   then apply:                 the same command without --check --diff
#   collector override:         add -e collector_host=<ip>  (else instance/instance.yml mgmt_ip)
#
# The wiring play runs `-e role` on every host of the class's group, whatever the host's device_role, so a host
# whose connection is not one the role is written for (the method's `wiring_connections`, logging/README.md) is
# refused before the role runs (tasks/refuse-local-connection.yml).
#
# A request the validation play refuses, and a host whose wiring fails, are recorded, not failed, and the run's last
# plays fail them, after the key cleanup: a refused request, or a wiring that fails on every host, no longer ends the
# run before the cleanup, which would leave the run's SSH keys in its key dir (I-64). A refused request targets no
# host: the device play and the summary read `_wire_refused` first, so no `_wire_group` from a vars file or an `-e`
# dispatches it. The device play's rescue ends that play for the host, as the failure did, so a handler a task
# notified before it does not run (a caller's force_handlers is not honoured for such a host: its handlers ran
# before). A host that reaches the rescue with no failed task of its own is failed there: its role could not be
# loaded, or another host's failure stopped it (a `run_once` task, a caller's any_errors_fatal). Under a caller's
# any_errors_fatal every host's wiring stops at the first failure: with one host the run reaches the cleanup and the
# summary names it; with more, the run ends at that play and the keys stay. What else still ends the run before the
# cleanup: every host refused, every host's role failing to load (I-66) and a handler that fails on every host (a
# role's handlers run at the play's end, outside the block: I-86); _cleanup-ssh-keys.yml's header lists them.
#
# Access chain used:   control VM (mgmt VLAN) -> the target class's inventory_group (per the method's role)
# May break:           per the dispatched role's access-chain header (e.g. a device's syslog config only)
# Fallback required:   per the dispatched role (console for edge_firewall/core_switch)
# Blast radius:        the targeted class's hosts only (the dispatched role is idempotent + --check-safe)

- name: Fleet preamble — stamp the run id + materialize per-host SSH keys
  ansible.builtin.import_playbook: _fleet-preamble.yml

- name: Validate the wiring request + resolve the target group and collector (control-side, no device contact)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # A refusal here ended the run at this play, before the key cleanup (I-64). The rescue records it by the
    # failed task's name (its message is printed at that task); the device play, which reads the record first, then
    # matches no host, and the run goes on to the cleanup; the run's last play fails it.
    - name: Validate the request, a refusal recorded for the run's last play (I-64)
      block:
        - name: Require the role + target extra-vars
          ansible.builtin.assert:
            that:
              - role | default('') | length > 0
              - target | default('') | length > 0
            fail_msg: "wire-logging.yml needs -e role=<wiring_role> -e target=<module_key>"
            quiet: true

        - name: Require the wiring role to exist (never dispatch a phantom role)
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../roles/{{ role }}/tasks/main.yml"
          register: _role_stat

        - name: Fail if the wiring role is missing
          ansible.builtin.assert:
            that:
              - _role_stat.stat.exists
            fail_msg: "wiring role '{{ role }}' has no ansible/roles/{{ role }}/tasks/main.yml"
            quiet: true

        # The loop below appends to `_wire_methods`, so a value the inventory or a vars file beside the playbooks gave
        # it would be read as methods, and widened a role's allowlist. A set_fact outranks both; an operator's `-e` of
        # `_wire_methods` or `_wire_connections` outranks it, and is the operator's (SECURITY.md C4).
        - name: Start the method list empty (no `_wire_methods` the inventory or a vars file sets is read)
          ansible.builtin.set_fact:
            _wire_methods: []

        - name: Read the logging methods (logging/<method>.yml or .yaml), to find the one whose wiring role this is
          ansible.builtin.set_fact:
            _wire_methods: "{{ _wire_methods | default([]) + [lookup('ansible.builtin.file', item) | from_yaml] }}"
          loop: >-
            {{ (query('ansible.builtin.fileglob', playbook_dir ~ '/../../logging/*.yml')
            + query('ansible.builtin.fileglob', playbook_dir ~ '/../../logging/*.yaml')) | sort }}

        - name: Resolve the connections the wiring role is written for (its method's `wiring_connections`)
          ansible.builtin.set_fact:
            _wire_connections: >-
              {{ _wire_methods | default([]) | selectattr('wiring_role', 'defined')
                 | selectattr('wiring_role', 'equalto', role)
                 | map(attribute='wiring_connections', default=[]) | flatten | unique }}

        - name: Fail if no method names a connection for the wiring role (the dispatch play would refuse every host)
          ansible.builtin.assert:
            that:
              - _wire_connections | length > 0
            fail_msg: "no logging/<method>.yml with wiring_role '{{ role }}' names its wiring_connections"
            quiet: true

        - name: Resolve the target class's inventory group + the collector host
          ansible.builtin.set_fact:
            _wire_group: >-
              {{ (lookup('file', playbook_dir ~ '/../../modules/' ~ target ~ '/module.yml')
                 | from_yaml).inventory_group }}
            _wire_collector: >-
              {{ collector_host | default((lookup('file', playbook_dir ~ '/../../instance/instance.yml')
                 | from_yaml).mgmt_ip, true) }}
      rescue:
        - name: Record the refusal for the run's last play (the device play then targets no host)
          ansible.builtin.set_fact:
            _wire_refused: >-
              the wiring request was refused at the task
              "{{ ansible_failed_task.name | default('(unnamed)', true) }}" (its message is printed above)

- name: Wire the logging method onto the target device class
  # A refused request (`_wire_refused`, which play 1's rescue sets) targets no host, whatever `_wire_group` a vars
  # file or an `-e` holds (an extra var outranks a set_fact, so a retarget by set_fact would not hold). The non-empty
  # sentinel default makes --syntax-check (which never runs the localhost play that sets _wire_group) resolve to a
  # pattern that matches NO host (a clean no-op): `hosts:` rejects an EMPTY value outright, and an undefined fact
  # would error. At runtime play 1 sets _wire_group unless it refuses the request.
  hosts: >-
    {{ '__no_target__' if hostvars['localhost']._wire_refused is defined
       else hostvars['localhost']._wire_group | default('__no_target__') }}
  gather_facts: false             # the wiring roles need no host facts (cli_config / lineinfile / systemd)
  ignore_unreachable: true        # a down host is tolerated, not fatal (CLAUDE.md hard rule)
  tasks:
    - name: Refuse a host whose connection is not one the wiring role is written for
      ansible.builtin.import_tasks: tasks/refuse-local-connection.yml
      vars:
        refusal_connections: "{{ hostvars['localhost']._wire_connections | default([]) }}"

    # A task that failed here on every host ended the run at this play, before the key cleanup (I-64). The rescue
    # records the host's failure by the failed task's name (not its result, which is printed at that task), and the
    # run's last plays fail the host, after the cleanup. A role that cannot be loaded is no task failure: the host
    # reaches the rescue with no failed task and is dropped from every later play, so the rescue fails it here, as
    # backup-configs.yml's capture rescue does (I-12); where that is every host, the keys stay (I-66).
    - name: Apply the wiring role, a failure recorded for the run's last play (I-64)
      block:
        - name: Apply the dispatched logging wiring role (collector resolved control-side)
          ansible.builtin.include_role:
            name: "{{ role }}"
          vars:
            logging_collector_host: "{{ hostvars['localhost']._wire_collector }}"
      rescue:
        - name: Record the failed wiring for the run's last play (the task's name; its result is printed above)
          ansible.builtin.set_fact:
            kontroll_wire_failed: >-
              the wiring stopped at the task "{{ ansible_failed_task.name | default('(unnamed)', true) }}"
          when: ansible_failed_task is defined

        - name: Fail a host stopped with no failed task of its own (no later play would see it)
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: stopped with no failed task of its own: the wiring role {{ role }} could not
              be loaded, or another host's failure stopped it (a run_once task, a caller's any_errors_fatal); the
              cause is printed above
          when: ansible_failed_task is not defined

        - name: End the host's wiring play, as its failure did (no handler it notified runs, force_handlers or not)
          ansible.builtin.meta: end_host

# Post-run: remove the per-run ephemeral SSH key dir (imported LAST — after the fleet connections; MF-4).
- name: Clean up the per-run ephemeral SSH key dir
  ansible.builtin.import_playbook: _cleanup-ssh-keys.yml

# After the cleanup, so a refused request, or a run whose every wiring failed, still removes its keys (I-64). These
# connect to nothing: each one's task is a `fail`, which runs on the controller (`connection: local` guards nothing: a
# host's own `ansible_connection` outranks it).
- name: Fail a refused wiring request
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Fail the run for the refused request, naming the task that refused it
      ansible.builtin.fail:
        msg: "{{ _wire_refused }}"
      when: _wire_refused is defined

- name: Wiring run summary
  hosts: >-
    {{ '__no_target__' if hostvars['localhost']._wire_refused is defined
       else hostvars['localhost']._wire_group | default('__no_target__') }}
  gather_facts: false
  connection: local
  tasks:
    - name: Fail a host whose wiring failed, naming the task it stopped at
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }}: FAILED: {{ kontroll_wire_failed }}"
      when: kontroll_wire_failed is defined

# Backend: api — REST/httpapi devices AND services (FortiGate, Servarr, …).
# Executed generically by roles/backend_api via plain `uri` (no vendor module, no
# httpapi plugin) driven by a per-API RECIPE (ansible/backends/api/recipes/<name>.yml:
# auth + endpoints). Actuation + backup are BOTH recipe-driven — but a recipe must
# exist, so backup is not auto-conferred from structural probing (each REST API
# differs); the recipe (derivable from OpenAPI, see docs/capability-matrix.md §5.2)
# or an override supplies it. Matched when a collection is httpapi-only (no cliconf);
# also the home for collection-less, purely recipe-driven APIs.
name: api
label: REST/httpapi (recipe-driven; backup via per-API recipe)
order: 5
classify:
  all_of:
    - {plugin: httpapi}
    - {none_of: [{plugin: cliconf}]}
# F2 confers: a REST/httpapi device is ICMP/TCP-probable with ZERO creds (blackbox); snmp/syslog need a CLI plane
# (not an httpapi shape) so they stay operator-DECLARED — fortigate declares snmp on its httpapi device (the honest
# gap). backup also omitted — it needs a per-API recipe.
confers: {actuate: true, telemetry: [blackbox], logs: []}
requires: []
# The SOPS domain a class of this backend stores its credentials in when the onboard request names none and the
# class is new (a reused class keeps its own `secrets_domain`). Read by service/onboard.py and the scaffold, and
# shown as the onboard form's default; no code names a domain (S27). A new name needs a rule in .sops.yaml.
default_secrets_domain: network
role: backend_api
# Onboarded api hosts are reached by localhost-delegated `uri`, not SSH/httpapi —
# so the host connection is local. The recipe (backend_api_recipe) + its credential vars
# carry everything else.
#
# TOKEN VAR — an onboarded api host's token var is `<host with - as _>_api_token`: this file's `api_token` entry
# below says so as a `maps_to` TEMPLATE, which service/onboard.py renders per host (S27). roles/backend_api accepts
# EITHER name: the recipe's declared `token_var` first, then that per-host one, refusing loudly and naming both if
# neither is in scope. Nothing resolves a recipe's `token_var` at onboard time — a comment here once claimed the
# planner did, and the mismatch silently reported a healthy FortiGate as UNREACHABLE for the life of the class
# (fixed 2026-07-28).
#
# BASIC-AUTH PAIR — the same rule (I-16): the `username` and `password` entries below write
# `<host with - as _>_api_username` and `_api_password`, and roles/backend_api reads the recipe's `username_var` and
# `password_var` first, then those, refusing by name before the request if either resolves to nothing. They were
# `ansible_user` and `ansible_password`, which the role never read, so an onboarded basic host could not
# authenticate; and a fallback to those connection vars would send whatever a group sets for SSH to the API.
connection:
  ansible_connection: local
# The TCP port ping.yml's reachability probe uses for a host of this backend (S28): the planner writes it into the
# host's drop-in as `kontroll_probe_port`. It is the API's port — the SSH port the probe otherwise defaults to says
# nothing about a REST device. The recipe's own `port:` still governs the check and backup requests; a recipe on
# another port needs its hosts to set `ansible_port` or `mgmt_port`. A YAML integer, or the onboard is refused.
probe_port: 443
# Self-describing credential SHAPE (F1 TIER-A): a REST/httpapi device authenticates with an API TOKEN (or basic
# auth) — NOT an SSH key. Deriving exactly these fields stops the form showing dead SSH boxes for a REST device (the
# operator's headline gap). Each host var is a `maps_to` template below (the notes above); the planner also gives each,
# by field name, to a field of the same name that a module's argument spec derives without one (TIER-B).
# A template takes `{cred_key}` only. The exact multi-field API auth (e.g. proxmox api_user+api_token_id+
# api_token_secret) is a TIER-B/Rung-1 sharpening; this is the generic REST shape. Read by scripts/kontroll/authspec.py.
auth:
  - {field: api_token, kind: token, label: "API token / key", maps_to: "{cred_key}_api_token"}
  - {field: username, kind: identity, label: "API username (basic auth)", maps_to: "{cred_key}_api_username"}
  - {field: password, kind: password, label: "API password (basic auth)", maps_to: "{cred_key}_api_password"}

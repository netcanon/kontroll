# Backend: vendor_config — uses a collection's own *_config module that exposes a
# `backup:` option (detected from ansible-doc). For platforms with a vendor config
# module but no generic cliconf path. Lower priority than netcommon_cli.
name: vendor_config
label: vendor *_config module with a backup option
order: 2
# No `role:` — no execution role ships for this backend yet, so it classifies (a search record lists it among
# its candidates) but never gives a class its role: the onboard planner and the scaffold never plan a new class
# with it, and refuse a request that names it for one (S26); only a reused class that brings its own role runs
# with it. Give it a role with tasks/check.yml + tasks/backup.yml under ansible/roles/ to make it runnable.
classify:
  any_of:
    - {module_option: {suffix: _config, option: backup}}
# F2 confers: a vendor *_config device is network_cli gear — the same agent-less floor (snmp + blackbox + syslog).
confers: {actuate: true, backup: true, telemetry: [snmp, blackbox], logs: [syslog_push]}
requires: [config_module]         # e.g. cisco.ios.ios_config
# The SOPS domain a class of this backend stores its credentials in when the onboard request names none and the
# class is new (a reused class keeps its own `secrets_domain`). Read by service/onboard.py and the scaffold, and
# shown as the onboard form's default; no code names a domain (S27). A new name needs a rule in .sops.yaml.
default_secrets_domain: network
# Self-describing credential SHAPE (F1 TIER-A): a vendor *_config device is reached over network_cli — SSH login
# (+ optional enable), same as netcommon_cli. Read by scripts/kontroll/authspec.py.
auth:
  - {field: username, kind: identity, label: "username (SSH)", maps_to: ansible_user, required: true}
  - {field: password, kind: password, label: "password (SSH)", maps_to: ansible_password}
  - {field: ssh_private_key, kind: ssh_key, label: "SSH private key (PEM)", maps_to: ansible_ssh_private_key_file}
  - {field: enable_password, kind: password, label: "enable secret (optional)", maps_to: ansible_become_password}

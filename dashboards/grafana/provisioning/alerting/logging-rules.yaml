# Grafana-managed unified alert rules over Loki (Layer 3) — a provisioning DROP-IN (apiVersion 1), the same
# "drop a file, edit no hub" doctrine as datasources/dashboards. NO separate Loki `ruler` container (a second
# process/topology element is rejected at homelab scale — 21-design-logging-continuation.md §2.2 / §7). Every
# rule queries the Loki datasource by its FIXED uid `loki` and has a numeric threshold + a BOUNDED window
# (fail-closed: no "alert forever / unbounded lookback"). Thresholds are conservative homelab defaults, tunable
# here. Live rendering is verified post-deploy (dashboards/README §Testing); CI runs the hermetic shape test
# tests/unit/test_alerting_logging.py. The log half of logging-architecture.md §2 G6; metrics-rules.yaml and
# heartbeat-rule.yaml are the rest, and policies.yaml routes every rule to the one contact point.
#
# Every rule counts matching lines, and a count of none comes back as no series at all, so each rule sets
# `noDataState: OK`. Grafana's default, NoData, held all four in NoData and sent a DatasourceNoData alert to the
# notifier every minute (two boxes, 2026-10-21): the Alerting page showed every logging alert as live. A query that
# fails (Loki down) is not a count of anything either, so each rule also sets `execErrState: Error`: under the
# default (Alerting) each rule fired under its own name once its `for` ran out, so a Loki outage read as a crash
# storm and an auth-denied spike (scratch box, 2026-10-21); with Error each rule shows Error instead. The trade:
# a selector that matches no stream (a misspelt label, a value nothing carries) now reads Normal for good, so the
# test holds every label a rule selects to one the Loki sink sets, and every `service` to one a shape emits.
#
# NB the body-substring matchers (|~ "...") are content-coupled (V1 M-9): if a log wording changes, the alert
# silently stops firing. The `auth-denied` token is pinned in the test as a shared contract; the runbook
# (docs/troubleshooting.md) documents where these strings come from.
apiVersion: 1
groups:
  - orgId: 1
    name: kontroll-logging
    folder: Homelab
    interval: 1m
    rules:
      - uid: kontroll-log-container-restart
        title: Container crash storm
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: {severity: warning, kontroll: logging}
        annotations: {summary: "A stack container keeps crashing (a crash loop); its lines are in Loki."}
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              # A container stream's `service` is the container's own name, so no one label picks them all: the body's
              # `container_name` (docker_logs sets it, nothing else does) does; `container_name != ""` keeps journald's
              # "Main process exited" and the ansible log's handler lines out. Each line is JSON. Two kinds of container
              # line say the words without a crash, measured over 7 days on two boxes (2026-10-21): Grafana logs this
              # rule's uid at every evaluation (every minute: it would fire for good), and each deploy's ansible prints
              # `TASK [Restart …]` banners. Both are dropped. A failed delivery's line names the alert's title and
              # folder (the group key) and the contact point, so no string in the alerting files but this rule's uid and
              # query says a counted word (test_alerting_metrics.py): this rule's own title would latch it firing on a
              # box whose deliveries fail.
              # A change here is re-measured first (docs/troubleshooting.md); test_alerting_logging.py pins it.
              expr: >-
                sum(count_over_time({source="internal"} | json container_name, message | __error__=""
                | container_name != "" | line_format "{{.message}}" |~ "(?i)restart|panic|exited"
                !~ `kontroll-log-container-restart|^(TASK|RUNNING HANDLER) \[` [5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
      # One alert per device a backup run did not back up, read from the line the run's summary prints for it
      # (ansible/playbooks/backup-configs.yml, "Name a device this run did not back up, for the alert"): the device,
      # its class, the reason (failed, unreachable, not-run), the run's id (the stream's `run_id`) and the Semaphore
      # task. Each device is its own alert, named by those labels, so a run that misses two sends two, and the run
      # need not fail for one to fire: a device not reached passes the run (I-65). A line is in the window for an hour,
      # so the rule waits a minute and fires; a `for` as long as the window, as before, never did, as the line left the
      # window as the wait ended. It resolves an hour after its run. A dry-run prints no such line. The ansible log
      # reaches Loki only where the scheduled jobs write it: docker/services/semaphore.yaml forwards ANSIBLE_LOG_PATH
      # to them (I-82). Each field is read on its own, as the yaml callback may fold the line between any two.
      - uid: kontroll-log-backup-failure
        title: Config backup missed a device
        condition: C
        noDataState: OK
        execErrState: Error
        for: 1m
        labels: {severity: warning, kontroll: logging}
        annotations:
          summary: >-
            The config backup did not back up {{ $$labels.device }} ({{ $$labels.class }}): {{ $$labels.reason }}.
          description: >-
            Run {{ $$labels.run_id }}, Semaphore task {{ $$labels.semaphore_task }}. failed: the capture failed
            (the device took the connection and its read was refused or failed, or its session did not open: a
            refused key; or the class's backup failed before its read), or the device is behind a jump host, or it
            left the run early (the run failed too). unreachable: the device took no TCP
            connection at its port (the run passed). not-run: the run recorded nothing for it. Any earlier capture
            is kept; the run's summary line for the device says why (docs/troubleshooting.md §15).
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              expr: >-
                sum by (device, class, reason, run_id, semaphore_task) (count_over_time({source="internal",
                service="ansible"} |= "KONTROLL-BACKUP-MISSED" | json message | __error__=""
                | line_format "{{.message}}"
                | regexp `KONTROLL-BACKUP-MISSED\s+device=(?P<device>\S+)`
                | regexp `\sclass=(?P<class>\S+)` | regexp `\sreason=(?P<reason>[a-z-]+)`
                | regexp `\ssemaphore_task=(?P<semaphore_task>[0-9a-z]+)` [1h]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
      # One alert per Semaphore task that failed: a job that exits non-zero (a playbook whose run failed, or one that
      # could not start, as a `--limit` that matches no host) is logged by Semaphore's task runner as `Failed to run
      # task` with its `task_id`, read here from Semaphore's container log (its `container_name`, as the crash rule
      # reads it: a container's `service` is its name, which no rule can name in advance). It covers what the backup
      # line cannot: a run that ended before its summary, and every other scheduled job that ran and exited non-zero
      # (not one stopped by hand, nor one Semaphore could not start: neither logs that line). A backup run that failed
      # sends both, its devices' alerts and its task's (I-65).
      - uid: kontroll-log-job-failed
        title: Scheduled job failed
        condition: C
        noDataState: OK
        execErrState: Error
        for: 1m
        labels: {severity: warning, kontroll: logging}
        annotations:
          summary: >-
            Semaphore task {{ $$labels.task_id }} failed; its output is in Semaphore (Task History, that task).
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              expr: >-
                sum by (task_id) (count_over_time({source="internal"} |= "Failed to run task"
                | json container_name, message | __error__="" | container_name = "semaphore"
                | line_format "{{.message}}"
                | regexp `task_id=(?P<task_id>[0-9]+)` [1h]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
      # One error fires it. The wait is one evaluation, well inside the window: a wait as long as the window let the
      # line leave it as the wait ended, so a one-off error never fired (I-102).
      - uid: kontroll-log-onboard-error
        title: Onboard / capability error
        condition: C
        noDataState: OK
        execErrState: Error
        for: 1m
        labels: {severity: warning, kontroll: logging}
        annotations: {summary: "An onboard or capability-promote surfaced an error in the audit stream."}
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              expr: >-
                sum(count_over_time({source="internal", service=~"gui-audit|api-audit"}
                |~ "(?i)onboard.*error|capability-result.*error" [10m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
      # More than five denials inside five minutes fire it, a burst included: with a wait as long as the window the
      # count had to stay over five for five minutes, so a burst of denials never fired (I-102).
      - uid: kontroll-log-auth-denied-spike
        title: auth-denied spike
        condition: C
        noDataState: OK
        execErrState: Error
        for: 1m
        labels: {severity: critical, kontroll: logging}
        annotations: {summary: "Repeated auth-denied in the privileged-surface audit log (brute-force / misconfig)."}
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({source="internal", service=~"api-audit|gui-audit"} |~ "auth-denied" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [5]}
              refId: C

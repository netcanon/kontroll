# Grafana-managed unified alert rules over Loki (Layer 3) — a provisioning DROP-IN (apiVersion 1), the same
# "drop a file, edit no hub" doctrine as datasources/dashboards. NO separate Loki `ruler` container (a second
# process/topology element is rejected at homelab scale — 21-design-logging-continuation.md §2.2 / §7). Every
# rule queries the Loki datasource by its FIXED uid `loki` and has a numeric threshold + a BOUNDED window
# (fail-closed: no "alert forever / unbounded lookback"). Thresholds are conservative homelab defaults, tunable
# here. Live rendering is verified post-deploy (dashboards/README §Testing); CI runs the hermetic shape test
# tests/unit/test_alerting_logging.py. Closes logging-architecture.md §2 G6 (no alerting on the log stream).
#
# Every rule counts matching lines, and a count of none comes back as no series at all, so each rule sets
# `noDataState: OK`. Grafana's default, NoData, held all four in NoData and sent a DatasourceNoData alert to the
# notifier every minute (two boxes, 2026-10-21): the Alerting page showed every logging alert as live. A query that
# fails (Loki down) is not a count of anything either, so each rule also sets `execErrState: Error`: under the
# default (Alerting) each rule fired under its own name once its `for` ran out, so a Loki outage read as a crash
# storm and an auth-denied spike (scratch box, 2026-10-21); with Error each rule shows Error instead. The trade:
# a selector that matches no stream (a misspelt label, a value nothing carries) now reads Normal for good, so the
# test holds every label a rule selects to one the Loki sink sets, and every `service` to one a shape emits.
#
# NB the body-substring matchers (|~ "...") are content-coupled (V1 M-9): if a log wording changes, the alert
# silently stops firing. The `auth-denied` token is pinned in the test as a shared contract; the runbook
# (docs/troubleshooting.md) documents where these strings come from.
apiVersion: 1
groups:
  - orgId: 1
    name: kontroll-logging
    folder: Homelab
    interval: 1m
    rules:
      - uid: kontroll-log-container-restart
        title: Container restart / crash storm
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: {severity: warning, kontroll: logging}
        annotations: {summary: "A stack container is restarting/panicking/exiting repeatedly (crash-loop)."}
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              # A container stream's `service` is the container's own name, so no one label picks them all:
              # the body's `container_name` (docker_logs sets it, nothing else does) does; `container_name != ""`
              # keeps journald's "Main process exited" and the ansible log's handler lines out. Each line is JSON.
              # Two kinds of container line say the words without a crash, measured over 7 days on two boxes
              # (2026-10-21): Grafana logs this rule's uid at every evaluation (every minute: it would fire for
              # good), and each deploy's ansible prints `TASK [Restart …]` banners. Both are dropped. A change here
              # is re-measured that way first (docs/troubleshooting.md); tests/unit/test_alerting_logging.py pins it.
              expr: >-
                sum(count_over_time({source="internal"} | json container_name, message | __error__=""
                | container_name != "" | line_format "{{.message}}" |~ "(?i)restart|panic|exited"
                !~ `kontroll-log-container-restart|^(TASK|RUNNING HANDLER) \[` [5m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
      - uid: kontroll-log-backup-failure
        title: Backup-config failure
        condition: C
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: {severity: warning, kontroll: logging}
        annotations: {summary: "A scheduled config backup failed or captured nothing."}
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              expr: >-
                sum(count_over_time({source="internal", service="ansible"}
                |~ "(?i)backup.*fail|captured nothing" [15m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
      - uid: kontroll-log-onboard-error
        title: Onboard / capability error
        condition: C
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: {severity: warning, kontroll: logging}
        annotations: {summary: "An onboard or capability-promote surfaced an error in the audit stream."}
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              expr: >-
                sum(count_over_time({source="internal", service=~"gui-audit|api-audit"}
                |~ "(?i)onboard.*error|capability-result.*error" [10m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: C
      - uid: kontroll-log-auth-denied-spike
        title: auth-denied spike
        condition: C
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: {severity: critical, kontroll: logging}
        annotations: {summary: "Repeated auth-denied in the privileged-surface audit log (brute-force / misconfig)."}
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({source="internal", service=~"api-audit|gui-audit"} |~ "auth-denied" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [5]}
              refId: C
